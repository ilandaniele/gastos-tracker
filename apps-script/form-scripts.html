<script>
  function setStatus(text, cls) {
    var el = document.getElementById('status');
    el.className = cls || '';
    el.textContent = text;
    // Mostrar/ocultar el overlay full-screen con spinner cuando es 'loading'
    var overlay = document.getElementById('loadingOverlay');
    if (overlay) {
      if (cls === 'loading') {
        var txt = document.getElementById('loadingText');
        if (txt) txt.textContent = text || 'Guardando...';
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }
  }

  function setLocked(locked) {
    // Disable all form inputs + quick buttons during save
    var f = document.getElementById('f');
    for (var i = 0; i < f.elements.length; i++) f.elements[i].disabled = locked;
    var qbtns = document.querySelectorAll('#quickVar button, #quickFijo button');
    for (var j = 0; j < qbtns.length; j++) qbtns[j].disabled = locked;
    document.body.style.opacity = locked ? '0.6' : '1';
    document.body.style.pointerEvents = locked ? 'none' : 'auto';
    // Keep status visible
    document.getElementById('status').style.pointerEvents = 'auto';
  }

  function getField(name) {
    return document.querySelector('#f [name="' + name + '"]');
  }

  // Asegurar que el input de fecha refleje el "hoy" del cliente, no el cacheado
  // del momento que se renderizó el HTML (caso típico: webapp abierta desde ayer).
  function _todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function refreshDateToToday() {
    var f = document.getElementById('date');
    if (f) f.value = _todayStr();
  }
  // Init: corregir el valor server-rendered con el "hoy" del cliente
  refreshDateToToday();
  // Cuando la PWA/pestaña vuelve a estar visible (típico al reabrir después de horas),
  // refrescar la fecha. Cubre el caso de webapp pinned/PWA abierta desde un día anterior.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') refreshDateToToday();
  });

  function fillQuick(data) {
    var itemField = getField('item');
    if (itemField) itemField.value = data.item || '';
    var amountField = getField('amount');
    if (data.amount !== undefined && data.amount !== null) amountField.value = data.amount;
    var curField = getField('currency'); if (data.currency && curField) curField.value = data.currency;
    var cardField = getField('card'); if (data.card && cardField) cardField.value = data.card;
    var catField = getField('category');
    if (data.category && catField) { catField.value = data.category; catTocadaAMano = true; }
    if (data.amount === undefined || data.amount === null) amountField.focus();
  }

  // Hardcoded quick presets — avoids HTML attribute sanitization issues
  var QUICKS = {
    // Variables
    bus52:     { item: 'Bus', amount: 52, currency: 'UYU', card: 'Crédito OCA', category: 'Transporte' },
    cafe:      { item: 'Café', currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    frog:      { item: 'Frog', currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    disco:     { item: 'Disco', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Comida' },
    devoto:    { item: 'Devoto', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Comida' },
    tata:      { item: 'Tata', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Comida' },
    claude:    { item: 'Claude', currency: 'USD', card: 'Crédito Itaú USD', category: 'Suscripciones' },
    uber:      { item: 'Uber', currency: 'UYU', card: 'Débito UYU', category: 'Transporte' },
    cabify:    { item: 'Cabify', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Transporte' },
    taxi:      { item: 'Taxi', currency: 'UYU', card: 'Débito UYU', category: 'Transporte' },
    agua140:   { item: 'Agua', amount: 140, currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    futbol350: { item: 'Fútbol', amount: 350, currency: 'UYU', card: 'Débito UYU', category: 'Gimnasio' },
    farma:     { item: 'Farmacia', currency: 'UYU', card: 'Débito UYU', category: 'Salud' },
    medic:     { item: 'Medicamento', currency: 'UYU', card: 'Débito UYU', category: 'Salud' },
    cine:      { item: 'Cine', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Entretenimiento' },
    regalo:    { item: 'Regalo', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Regalos' },
    ropa:      { item: 'Ropa', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Ropa' },
    pelu:      { item: 'Peluquería', currency: 'UYU', card: 'Débito UYU', category: 'Ropa' },
    powerade:  { item: 'Powerade', currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    empanadas: { item: 'Empanadas', currency: 'UYU', card: 'Débito UYU', category: 'Comida' },
    pizza:     { item: 'Pizza', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Comida' },
    fernet:    { item: 'Fernet', currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    nafta:     { item: 'Nafta', currency: 'UYU', card: 'Crédito OCA', category: 'Transporte' },
    otros:     { item: '', currency: 'UYU', card: 'Débito UYU', category: 'Otros' },
    // Fijos — kind:'fijo' routes to fixed-table row on server (Mayo 2026 layout)
    fijo_alquiler:   { kind: 'fijo', item: 'Alquiler',         currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_gc:         { kind: 'fijo', item: 'Gastos comunes',   currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_trib:       { kind: 'fijo', item: 'Tributos domiciliarios', currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_antel_int:  { kind: 'fijo', item: 'Antel Internet',   currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_antel_mov:  { kind: 'fijo', item: 'Antel móvil',      currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_luz:        { kind: 'fijo', item: 'Luz',              currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_itau:       { kind: 'fijo', item: 'Itau paquete',     currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_sandra:     { kind: 'fijo', item: 'Sandra Psicologa', currency: 'UYU', card: 'Débito UYU', category: 'Salud' },
    fijo_viandas:    { kind: 'fijo', item: 'Viandas',          currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_ble:        { kind: 'fijo', item: 'Ble',              currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_bluecross:  { kind: 'fijo', item: 'BlueCross',        currency: 'UYU', card: 'Débito UYU', category: 'Salud' },
    fijo_gimnasio:   { kind: 'fijo', item: 'Gimnasio',         currency: 'UYU', card: 'Débito UYU', category: 'Gimnasio' },
    fijo_itau_cred:  { kind: 'fijo', item: 'Itaú Crédito',     currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_oca:        { kind: 'fijo', item: 'Oca',              currency: 'UYU', card: 'Débito UYU', category: 'Servicios' }
  };
  var btns = document.querySelectorAll('#quickVar button, #quickFijo button');
  for (var i = 0; i < btns.length; i++) {
    (function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-key');
        if (QUICKS[key]) fillQuick(QUICKS[key]);
        else setStatus('Quick key no encontrado: ' + key, 'err');
      });
    })(btns[i]);
  }

  // === Clasificación en vivo por el nombre del ítem ===
  // Las reglas vienen de CAT_RULES en Code.gs (inyectadas al render), así que
  // el form muestra exactamente la categoría con la que se va a guardar. Antes
  // el desplegable quedaba en el default y recién al guardar se sabía: escribir
  // "Claude" mostraba Transporte y terminaba en Suscripciones.
  var CAT_RULES_JS = [];
  try {
    if (typeof CAT_RULES_RAW !== 'undefined') {
      CAT_RULES_JS = CAT_RULES_RAW.map(function(r) {
        return { re: new RegExp(r.source, r.flags), cat: r.cat };
      });
    }
  } catch (e) { CAT_RULES_JS = []; }

  function clasificarItem(texto) {
    var s = String(texto || '').trim();
    if (!s) return null;
    for (var i = 0; i < CAT_RULES_JS.length; i++) {
      if (CAT_RULES_JS[i].re.test(s)) return CAT_RULES_JS[i].cat;
    }
    return 'Otros';
  }

  // Si el usuario elige una categoría a mano, se deja de pisar hasta que
  // limpie el ítem o guarde.
  var catTocadaAMano = false;
  (function() {
    var cat = getField('category');
    if (cat) cat.addEventListener('change', function() { catTocadaAMano = true; });
  })();

  function autoClasificar() {
    if (catTocadaAMano) return;
    var itemField = getField('item'), catField = getField('category');
    if (!itemField || !catField) return;
    var v = itemField.value.trim();
    if (!v) return;
    var c = clasificarItem(v);
    if (c && c !== 'Otros') catField.value = c;
  }

  var AUTO_CARD_RULES = [
    { re: /^\s*bus\b/i, card: 'Crédito OCA' }
  ];
  function autoCorrectCard() {
    var itemField = getField('item');
    var cardField = getField('card');
    if (!itemField || !cardField) return;
    var v = itemField.value.trim();
    var matched = 'Débito UYU'; // default
    for (var i = 0; i < AUTO_CARD_RULES.length; i++) {
      if (AUTO_CARD_RULES[i].re.test(v)) { matched = AUTO_CARD_RULES[i].card; break; }
    }
    cardField.value = matched;
  }
  (function(){
    var itemField = getField('item');
    if (itemField) itemField.addEventListener('input', function() {
      autoCorrectCard();
      autoClasificar();
    });
  })();

  function onSuccess(result) {
    setLocked(false);
    if (result && result.ok) {
      var cot = result.written && result.written.cotizacion;
      var src = result.cotizSource || '?';
      var prefix = result.fixed ? '✓ FIJO actualizado · ' : '✓ Guardado · ';
      var prevNote = '';
      if (result.fixed && result.written && result.written.prevAmount > 0) {
        prevNote = ' (sobreescribió ' + result.written.prevAmount + ')';
      }
      setStatus(prefix + result.tab + ' · row ' + result.row + ' · cot=' + cot + ' (' + src + ')' + prevNote, 'ok');
      var f = document.getElementById('f');
      f.reset();
      catTocadaAMano = false;
      // Local date, not UTC (avoids next-day glitch in evening)
      var n = new Date();
      var iso = n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
      var dateField = getField('date');
      if (dateField) dateField.value = iso;
    } else {
      setStatus('✗ Error: ' + (result && result.error ? result.error : 'desconocido'), 'err');
    }
  }

  function onError(err) {
    setLocked(false);
    setStatus('✗ Server: ' + (err && err.message ? err.message : err), 'err');
  }

  // Normaliza decimales: acepta coma o punto → siempre punto para el backend
  function normDec(s) { return String(s == null ? '' : s).replace(',', '.').trim(); }

  // Real-time: reemplazar coma por punto en campos numéricos mientras se tipea
  (function(){
    var numericFields = ['amount', 'cotizacion'];
    numericFields.forEach(function(name){
      var el = getField(name);
      if (!el) return;
      el.addEventListener('input', function(){
        var pos = el.selectionStart;
        var v = el.value;
        // Sólo permitir dígitos, coma, punto (una sola)
        var cleaned = v.replace(/[^0-9.,]/g, '');
        // Colapsar múltiples separadores → dejar sólo el primero
        var firstSep = cleaned.search(/[.,]/);
        if (firstSep >= 0) {
          cleaned = cleaned.slice(0, firstSep + 1) + cleaned.slice(firstSep + 1).replace(/[.,]/g, '');
        }
        if (cleaned !== v) {
          el.value = cleaned;
          try { el.setSelectionRange(pos, pos); } catch(_){}
        }
      });
    });
  })();

  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var f = document.getElementById('f');
    var data = {};
    for (var i = 0; i < f.elements.length; i++) {
      var el = f.elements[i];
      if (el.name && el.value) {
        // Normalizar decimales antes de mandar al backend
        data[el.name] = (el.name === 'amount' || el.name === 'cotizacion') ? normDec(el.value) : el.value;
      }
    }
    setLocked(true);
    setStatus('Guardando...', 'loading');
    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onError)
      .addExpenseSafe(data);
  });

  // === Ticket OCR scan ===
  var scannedItems = [];
  var CATS = (typeof CATEGORIAS !== 'undefined' && CATEGORIAS.length)
    ? CATEGORIAS
    : ['Bebida/Bar','Comida','Entretenimiento','Gimnasio','Hogar','Limpieza','Regalos','Ropa','Salud','Servicios','Suscripciones','Transporte','Viajes','Otros'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function resizeImage(dataUrl, maxSize, cb) {
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      var ratio = Math.min(maxSize/w, maxSize/h, 1);
      var nw = Math.round(w * ratio), nh = Math.round(h * ratio);
      var canvas = document.createElement('canvas');
      canvas.width = nw; canvas.height = nh;
      canvas.getContext('2d').drawImage(img, 0, 0, nw, nh);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = dataUrl;
  }

  document.getElementById('scanBtn').addEventListener('click', function(){
    document.getElementById('ticketFile').click();
  });
  document.getElementById('ticketFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (!file) return;
    setStatus('Procesando imagen...', 'loading');
    var reader = new FileReader();
    reader.onload = function(e){
      resizeImage(e.target.result, 1280, function(resizedDataUrl){
        var b64 = resizedDataUrl.split(',')[1];
        setStatus('Escaneando ticket con AI (puede tardar)...', 'loading');
        google.script.run
          .withSuccessHandler(onScanResult)
          .withFailureHandler(function(err){
            setStatus('✗ Scan: ' + (err && err.message ? err.message : err), 'err');
          })
          .scanTicket(b64);
      });
    };
    reader.readAsDataURL(file);
    // Reset input so same file can be re-selected
    ev.target.value = '';
  });

  function onScanResult(result) {
    if (!result || !result.ok) {
      setStatus('✗ ' + (result && result.error || 'scan error'), 'err');
      return;
    }
    scannedItems = (result.items || []).map(function(it){
      return { name: it.name || '', amount: parseFloat(normDec(it.amount)) || 0, category: it.category || 'Otros' };
    });
    if (!scannedItems.length) {
      setStatus('No se detectaron items. Probá con foto más clara.', 'err');
      return;
    }
    renderScanPreview();
    setStatus('✓ ' + scannedItems.length + ' items detectados', 'ok');
  }

  function renderScanPreview() {
    var container = document.getElementById('scanItems');
    var html = '';
    for (var i = 0; i < scannedItems.length; i++) {
      var it = scannedItems[i];
      html += '<div class="scan-row">' +
        '<input type="text" data-idx="' + i + '" data-field="name" value="' + esc(it.name) + '">' +
        '<input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" data-idx="' + i + '" data-field="amount" value="' + it.amount + '">' +
        '<select data-idx="' + i + '" data-field="category">' +
        CATS.map(function(c){ return '<option' + (c===it.category?' selected':'') + '>' + c + '</option>'; }).join('') +
        '</select>' +
        '<button type="button" class="del-btn" data-del="' + i + '">×</button>' +
      '</div>';
    }
    container.innerHTML = html;
    var totEl = document.getElementById('scanTotal');
    var tot = scannedItems.reduce(function(s,e){ return s + (parseFloat(normDec(e.amount))||0); }, 0);
    totEl.textContent = fmt(tot, 'UYU');
    document.getElementById('scanPreview').style.display = 'block';
    // Wire delete buttons
    var dels = container.querySelectorAll('[data-del]');
    for (var d = 0; d < dels.length; d++) {
      (function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.getAttribute('data-del'), 10);
          scannedItems.splice(idx, 1);
          if (!scannedItems.length) {
            document.getElementById('scanPreview').style.display = 'none';
          } else {
            renderScanPreview();
          }
        });
      })(dels[d]);
    }
    // Wire input updates
    var inputs = container.querySelectorAll('input,select');
    for (var ii = 0; ii < inputs.length; ii++) {
      (function(el){
        el.addEventListener('change', function(){
          var idx = parseInt(el.getAttribute('data-idx'), 10);
          var fld = el.getAttribute('data-field');
          if (!scannedItems[idx]) return;
          scannedItems[idx][fld] = fld === 'amount' ? (parseFloat(normDec(el.value)) || 0) : el.value;
          if (fld === 'amount') {
            var tot = scannedItems.reduce(function(s,e){ return s + (parseFloat(normDec(e.amount))||0); }, 0);
            document.getElementById('scanTotal').textContent = fmt(tot, 'UYU');
          }
        });
      })(inputs[ii]);
    }
  }

  document.getElementById('cancelScan').addEventListener('click', function(){
    scannedItems = [];
    document.getElementById('scanPreview').style.display = 'none';
    setStatus('Cancelado', 'ok');
    setTimeout(function(){ var s = document.getElementById('status'); s.style.display = 'none'; }, 1500);
  });
  document.getElementById('saveAll').addEventListener('click', function(){
    if (!scannedItems.length) return;
    var cardField = getField('card');
    var defaultCard = cardField ? cardField.value : 'Débito UYU';
    var dateField = getField('date');
    var date = dateField ? dateField.value : '';
    var batch = scannedItems.map(function(it){
      return {
        item: it.name,
        amount: it.amount,
        currency: 'UYU',
        card: defaultCard,
        category: it.category,
        date: date
      };
    });
    setLocked(true);
    setStatus('Guardando ' + batch.length + ' items...', 'loading');
    google.script.run
      .withSuccessHandler(function(result){
        setLocked(false);
        if (result && result.ok) {
          setStatus('✓ ' + result.saved + ' guardados · ' + result.failed + ' fallaron · ' + result.tab, 'ok');
          scannedItems = [];
          document.getElementById('scanPreview').style.display = 'none';
        } else {
          setStatus('✗ Batch: ' + (result && result.error || 'error'), 'err');
        }
      })
      .withFailureHandler(function(err){
        setLocked(false);
        setStatus('✗ Batch: ' + (err && err.message ? err.message : err), 'err');
      })
      .addBatch(batch);
  });

  // === Tabs ===
  var dashLoadedOnce = false;
  function switchTab(panelId) {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-panel') === panelId);
    }
    var panels = document.querySelectorAll('.panel');
    for (var j = 0; j < panels.length; j++) {
      panels[j].classList.toggle('active', panels[j].id === panelId);
    }
    if (panelId === 'dashPanel' && !dashLoadedOnce) loadDashboard();
    // Recargar siempre al entrar: si guardaste y volviste, tenés que ver lo
    // que quedó en la hoja y no el form viejo. Si hay cambios sin guardar se
    // respetan y no se pisan.
    if (panelId === 'argPanel') loadArg();
    if (panelId === 'habitPanel') {
      if (!habitLoadedOnce) loadHabitToday();
      else if (!H.dirty) loadDay(H.date || todayISO());
    }
    // Cada vez que se abre la pestaña de agregar, refrescar la fecha a "hoy"
    if (panelId === 'addPanel') refreshDateToToday();
  }
  var tabBtns = document.querySelectorAll('.tab');
  for (var t = 0; t < tabBtns.length; t++) {
    (function(b){ b.addEventListener('click', function(){ switchTab(b.getAttribute('data-panel')); }); })(tabBtns[t]);
  }
  document.getElementById('refreshDash').addEventListener('click', function(){ loadDashboard(); });

  // === Dashboard ===
  function fmt(n, cur) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    try {
      if (!cur) {
        return new Intl.NumberFormat('es-UY', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
      }
      // UYU: sin decimales (montos enteros). USD/ARS: 2 decimales.
      var maxFrac = cur === 'UYU' ? 0 : 2;
      return new Intl.NumberFormat('es-UY', {
        style: 'currency',
        currency: cur,
        currencyDisplay: 'symbol',
        minimumFractionDigits: 0,
        maximumFractionDigits: maxFrac
      }).format(n);
    } catch(e) {
      var sym = cur === 'USD' ? 'US$ ' : '$ ';
      return sym + n.toFixed(cur === 'UYU' ? 0 : 2);
    }
  }

  function loadDashboard() {
    var content = document.getElementById('dashContent');
    content.className = 'dash-loader';
    content.textContent = 'Cargando datos...';
    google.script.run
      .withSuccessHandler(renderDashboard)
      .withFailureHandler(function(err){
        content.textContent = '✗ Error: ' + (err && err.message ? err.message : err);
      })
      .getDashboardData();
  }

  function renderDashboard(data) {
    dashLoadedOnce = true;
    var content = document.getElementById('dashContent');
    if (!data || !data.ok) {
      content.className = 'dash-loader';
      content.textContent = '✗ ' + ((data && data.error) || 'Error desconocido');
      return;
    }
    document.getElementById('dashTitle').textContent = data.tab;
    content.className = '';
    var t = data.totals || {};
    var html = '';

    // KPIs
    html += '<div class="dash-section"><div class="dash-kpis">';
    html += '<div class="dash-kpi big"><div class="dash-kpi-label">Total UYU+USD en UYU</div><div class="dash-kpi-val">' + fmt(t.uyuInUyu, 'UYU') + '</div><div class="dash-kpi-sub">cot. ' + fmt(data.cotizacion) + '</div></div>';
    html += '<div class="dash-kpi"><div class="dash-kpi-label">Total UYU</div><div class="dash-kpi-val">' + fmt(t.uyu, 'UYU') + '</div></div>';
    html += '<div class="dash-kpi"><div class="dash-kpi-label">Total USD</div><div class="dash-kpi-val">' + fmt(t.usd, 'USD') + '</div></div>';
    html += '<div class="dash-kpi"><div class="dash-kpi-label">Fijos UYU</div><div class="dash-kpi-val">' + fmt(t.fixedUyu, 'UYU') + '</div></div>';
    html += '<div class="dash-kpi"><div class="dash-kpi-label">Variable UYU</div><div class="dash-kpi-val">' + fmt(t.varUyu, 'UYU') + '</div><div class="dash-kpi-sub">' + (data.variableCount || 0) + ' gastos</div></div>';
    // Top categoría KPI
    if (data.byCategory && data.byCategory.length) {
      var topCat = data.byCategory.filter(function(c){ return (c.uyu||0) > 0; })[0];
      if (topCat) {
        html += '<div class="dash-kpi big" style="background:#fef3c7;border-color:#fde68a"><div class="dash-kpi-label">🥇 Top categoría</div><div class="dash-kpi-val" style="color:#92400e">' + topCat.name + '</div><div class="dash-kpi-sub">' + fmt(topCat.uyu, 'UYU') + '</div></div>';
      }
    }
    html += '</div></div>';

    // Por categoría con barras + ranking
    if (data.byCategory && data.byCategory.length) {
      var maxCat = data.byCategory.reduce(function(m, x){ return Math.max(m, x.uyu || 0); }, 0);
      var totalCatUyu = data.byCategory.reduce(function(s, x){ return s + (x.uyu || 0); }, 0);
      html += '<div class="dash-section"><h2>Por categoría (UYU)</h2><div class="dash-list">';
      var rank = 0;
      for (var i = 0; i < data.byCategory.length; i++) {
        var c = data.byCategory[i];
        if (!c.uyu && !c.usd) continue;
        rank++;
        var pct = maxCat > 0 ? (c.uyu / maxCat * 100) : 0;
        var pctTot = totalCatUyu > 0 ? (c.uyu / totalCatUyu * 100) : 0;
        var medal = rank === 1 ? '🥇 ' : (rank === 2 ? '🥈 ' : (rank === 3 ? '🥉 ' : ''));
        var rowStyle = rank === 1 ? ' style="background:#fefce8"' : '';
        var barColor = rank === 1 ? '#f59e0b' : '#0f766e';
        html += '<div class="dash-list-row"' + rowStyle + '>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="name">' + medal + c.name + '</div>' +
            '<div class="dash-bar"><div style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
          '</div>' +
          '<div class="val" style="text-align:right">' + fmt(c.uyu, 'UYU') +
            '<div class="sub" style="font-weight:400">' + pctTot.toFixed(0) + '%</div>' +
          '</div>' +
        '</div>';
      }
      html += '</div></div>';
    }

    // Por medio de pago
    if (data.byCard && data.byCard.length) {
      html += '<div class="dash-section"><h2>Por medio de pago</h2><div class="dash-list">';
      for (var k = 0; k < data.byCard.length; k++) {
        var card = data.byCard[k];
        if (!card.amount) continue;
        html += '<div class="dash-list-row"><span class="name">' + card.name + '</span><span class="val">' + fmt(card.amount, card.currency) + '</span></div>';
      }
      html += '</div></div>';
    }

    // Últimos gastos
    if (data.recent && data.recent.length) {
      html += '<div class="dash-section"><h2>Últimos gastos</h2><div class="dash-list">';
      for (var r = 0; r < data.recent.length; r++) {
        var e = data.recent[r];
        html += '<div class="dash-list-row"><div style="flex:1;min-width:0"><div class="name">' + e.item + '</div><div class="sub">' + (e.card || '') + (e.category ? ' · ' + e.category : '') + '</div></div><div class="val">' + fmt(e.amount, e.currency) + '</div></div>';
      }
      html += '</div></div>';
    }

    content.innerHTML = html;
  }


  // ==========================================================
  // === HABITOS ==============================================
  // ==========================================================
  var habitLoadedOnce = false;
  var AGUA_STEP = 250, AGUA_META = 2400;

  // Estado local del dia que se esta editando. NADA se guarda hasta
  // que se toca "Guardar dia" (salvo las comidas, que son un log aparte).
  var H = { date: '', meals: [], waters: [], saved: {}, dirty: false, editingRow: null, editingWater: null };

  function hEl(id) { return document.getElementById(id); }

  function habStatus(text, cls) {
    var el = hEl('habStatus');
    if (!el) return;
    el.className = cls || '';
    el.textContent = text || '';
    var ov = hEl('loadingOverlay');
    if (ov) {
      if (cls === 'loading') {
        var t = hEl('loadingText'); if (t) t.textContent = text || 'Guardando...';
        ov.classList.add('show');
      } else { ov.classList.remove('show'); }
    }
  }

  function nowHM() {
    var d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtMl(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  function markDirty() {
    H.dirty = true;
    var f = hEl('dirtyFlag'); if (f) f.classList.add('show');
  }
  function clearDirty() {
    H.dirty = false;
    var f = hEl('dirtyFlag'); if (f) f.classList.remove('show');
  }

  // ---------- Ruedas de hora ----------
  function fillWheels() {
    var hs = ['--'], ms = ['--'], i;
    for (i = 0; i < 24; i++) hs.push(String(i).padStart(2, '0'));
    for (i = 0; i < 60; i += 5) ms.push(String(i).padStart(2, '0'));
    [['levH', hs], ['acoH', hs], ['levM', ms], ['acoM', ms]].forEach(function(pair) {
      var el = hEl(pair[0]);
      if (!el) return;
      el.innerHTML = pair[1].map(function(v) { return '<option value="' + (v === '--' ? '' : v) + '">' + v + '</option>'; }).join('');
    });
  }
  fillWheels();

  function getWheel(hId, mId) {
    var h = hEl(hId), m = hEl(mId);
    if (!h || !m || !h.value) return '';
    return h.value + ':' + (m.value || '00');
  }
  function setWheel(hId, mId, hm) {
    var h = hEl(hId), m = hEl(mId);
    if (!h || !m) return;
    if (!hm) { h.value = ''; m.value = ''; return; }
    var parts = String(hm).split(':');
    var hh = parseInt(parts[0] || '0', 10);
    var mm = parseInt(parts[1] || '0', 10);
    if (!isFinite(hh)) hh = 0;
    if (!isFinite(mm)) mm = 0;
    // Redondear al múltiplo de 5 más cercano. Si redondea a 60 hay que subir
    // la hora: antes 07:58 quedaba en 07:00, una hora para atrás, y eso se
    // metía directo en el cálculo de horas dormidas.
    var r = Math.round(mm / 5) * 5;
    if (r >= 60) { r = 0; hh = (hh + 1) % 24; }
    h.value = String(hh).padStart(2, '0');
    m.value = String(r).padStart(2, '0');
  }

  // ---------- Carga de un dia ----------
  function loadDay(dateStr) {
    var d = dateStr || todayISO();
    habStatus('Cargando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        habStatus('', '');
        habitLoadedOnce = true;
        if (!r || !r.ok) { habStatus('✗ ' + ((r && r.error) || 'error'), 'err'); return; }
        H.date = r.date || d;
        H.meals = r.meals || [];
        H.waters = r.waters || [];
        H.saved = r.day || {};
        if (hEl('dayPicker')) hEl('dayPicker').value = H.date;
        paintDay(H.saved);
        renderMeals();
        renderWaters();
        pintarEstadoDia();
        clearDirty();
      })
      .withFailureHandler(function(err) { habStatus('✗ ' + (err && err.message ? err.message : err), 'err'); })
      .getHabitDaySafe(d);
  }

  // Relee el día sin tocar lo que el usuario esté escribiendo: sólo
  // actualiza H.saved y el badge de estado.
  function refreshSaved() {
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) { H.saved = r.day || {}; pintarEstadoDia(); }
      })
      .withFailureHandler(function() {})
      .getHabitDaySafe(H.date);
  }

  // Muestra si el día elegido ya tiene datos guardados
  function pintarEstadoDia() {
    var el = hEl('dayStatus');
    if (!el) return;
    var s = H.saved || {};
    var n = 0;
    ['levante','acoste','trabajo','avance','animo','ejercicio','ejercicioMin',
     'medite','mediteMin','lei','notas'].forEach(function(k) {
      if (s[k] !== undefined && s[k] !== null && s[k] !== '') n++;
    });
    var extras = (H.meals || []).length + (H.waters || []).length;
    if (n || extras) {
      el.textContent = 'guardado · ' + n + ' campo' + (n === 1 ? '' : 's') +
                       (extras ? ' · ' + extras + ' registro' + (extras === 1 ? '' : 's') : '');
      el.className = 'hdaystatus con';
    } else {
      el.textContent = 'sin datos todavía';
      el.className = 'hdaystatus sin';
    }
  }

  function paintDay(d) {
    d = d || {};
    setWheel('levH', 'levM', d.levante || '');
    setWheel('acoH', 'acoM', d.acoste || '');
    pintarSueno();
    if (hEl('habTrabajo')) hEl('habTrabajo').value = d.trabajo != null ? String(d.trabajo) : '';
    if (hEl('habNotas'))   hEl('habNotas').value   = d.notas || '';
    if (hEl('ejerText'))   hEl('ejerText').value   = d.ejercicio || '';
    if (hEl('ejerMin'))    hEl('ejerMin').value    = d.ejercicioMin != null ? String(d.ejercicioMin) : '';
    if (hEl('mediteMin'))  hEl('mediteMin').value  = d.mediteMin != null ? String(d.mediteMin) : '';
    setSiNo('medite', d.medite || '');
    setSiNo('lei',    d.lei || '');
    setSlider('habAvance', 'avanceVal', d.avance);
    setSlider('habAnimo',  'animoVal',  d.animo);
    if (hEl('mastInput')) hEl('mastInput').value = d.mast != null ? d.mast : 0;
    if (hEl('aguaHora') && !hEl('aguaHora').value) hEl('aguaHora').value = nowHM();
    if (hEl('mealHora') && !hEl('mealHora').value) hEl('mealHora').value = nowHM();
  }

  // Calcula y muestra las horas dormidas con los dos valores de la fila.
  // Como acostarse y levantarse describen la MISMA noche, si la hora de
  // acostarse es mayor que la de levantarse es que se cruzó la medianoche, y
  // por lo tanto fue el día anterior. Se muestra la fecha para que no quede
  // ninguna duda de a qué noche corresponde.
  function pintarSueno() {
    var aco = getWheel('acoH', 'acoM');
    var lev = getWheel('levH', 'levM');
    var out = hEl('hsSueno'), sub = hEl('acosteDia');

    if (!aco || !lev) {
      if (out) out.textContent = '';
      if (sub) sub.textContent = '';
      return;
    }
    function mins(hm) { var p = hm.split(':'); return parseInt(p[0],10)*60 + parseInt(p[1],10); }
    var m = mins(lev) - mins(aco);
    var prevDia = m < 0;
    if (m < 0) m += 1440;
    var hs = Math.round(m / 60 * 100) / 100;

    if (sub) {
      if (!H.date) { sub.textContent = prevDia ? 'el día anterior' : 'ya pasada la medianoche'; }
      else {
        var pp = H.date.split('-');
        var dd = new Date(parseInt(pp[0],10), parseInt(pp[1],10)-1, parseInt(pp[2],10));
        if (prevDia) dd.setDate(dd.getDate() - 1);
        sub.textContent = String(dd.getDate()).padStart(2,'0') + '/' + String(dd.getMonth()+1).padStart(2,'0');
      }
    }
    if (out) out.textContent = hs ? ('😴 ' + String(hs).replace('.', ',') + ' hs dormidas') : '';
  }

  // Sí/No: el valor vive en H (no en un input) porque son botones. Tocar el que
  // ya está activo lo apaga, así se puede dejar el día sin contestar.
  function setSiNo(campo, val) {
    H[campo] = val || '';
    var bs = document.querySelectorAll('.hsino[data-campo="' + campo + '"]');
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('activo', bs[i].getAttribute('data-val') === H[campo]);
    }
  }
  (function() {
    var bs = document.querySelectorAll('.hsino');
    for (var i = 0; i < bs.length; i++) {
      (function(b) {
        b.addEventListener('click', function() {
          var campo = b.getAttribute('data-campo'), val = b.getAttribute('data-val');
          setSiNo(campo, H[campo] === val ? '' : val);
          markDirty();
        });
      })(bs[i]);
    }
  })();

  function setSlider(sliderId, badgeId, val) {
    var s = hEl(sliderId), b = hEl(badgeId);
    if (!s) return;
    s.value = (val != null && isFinite(val)) ? val : 0;
    if (b) b.textContent = (String(s.value) === '0') ? '—' : s.value;
  }

  // ---------- Navegacion de dias ----------
  function shiftDay(delta) {
    var base = (hEl('dayPicker') && hEl('dayPicker').value) || todayISO();
    var parts = base.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    d.setDate(d.getDate() + delta);
    var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    goToDay(iso);
  }
  function goToDay(iso) {
    if (H.dirty) {
      if (confirm('Tenés cambios sin guardar.\n\nAceptar = guardarlos y cambiar de día\nCancelar = cambiar sin guardar')) {
        saveDay({ silent: true, then: function() { loadDay(iso); } });
        return;
      }
    }
    loadDay(iso);
  }
  if (hEl('dayPrev'))  hEl('dayPrev').addEventListener('click', function() { shiftDay(-1); });
  if (hEl('dayNext'))  hEl('dayNext').addEventListener('click', function() { shiftDay(1); });
  if (hEl('dayToday')) hEl('dayToday').addEventListener('click', function() { goToDay(todayISO()); });
  if (hEl('dayPicker')) hEl('dayPicker').addEventListener('change', function() { goToDay(hEl('dayPicker').value); });

  // ---------- Marcar cambios ----------
  ['levH','levM','acoH','acoM','habTrabajo','habAvance','habAnimo','habNotas',
   'ejerText','ejerMin','mediteMin','mastInput'].forEach(function(id) {
    var el = hEl(id);
    if (!el) return;
    el.addEventListener('change', markDirty);
    el.addEventListener('input', markDirty);
  });

  // Las ruedas de hora recalculan el sueño en vivo, sin esperar al guardado
  ['levH','levM','acoH','acoM'].forEach(function(id) {
    var el = hEl(id);
    if (el) el.addEventListener('change', pintarSueno);
  });

  // "ahora" solo completa la rueda; se guarda con "Guardar dia"
  if (hEl('btnLevante')) hEl('btnLevante').addEventListener('click', function() {
    setWheel('levH', 'levM', nowHM()); markDirty(); pintarSueno();
  });
  if (hEl('btnAcoste')) hEl('btnAcoste').addEventListener('click', function() {
    setWheel('acoH', 'acoM', nowHM()); markDirty(); pintarSueno();
  });

  // ---------- Sliders ----------
  [['habAvance','avanceVal'], ['habAnimo','animoVal']].forEach(function(pair) {
    var s = hEl(pair[0]);
    if (!s) return;
    s.addEventListener('input', function() {
      var b = hEl(pair[1]);
      if (b) b.textContent = (s.value === '0') ? '—' : s.value;
    });
  });

  // ---------- Numericos con +/- (solo cambian el campo en pantalla) ----------
  function bumpField(inputId, delta, after) {
    var el = hEl(inputId);
    if (!el) return;
    var v = parseInt(String(el.value).replace(/\D/g, ''), 10);
    if (!isFinite(v)) v = 0;
    v += delta;
    if (v < 0) v = 0;
    el.value = v;
    markDirty();
    if (after) after();
  }
  if (hEl('mastPlus'))  hEl('mastPlus').addEventListener('click',  function() { bumpField('mastInput',  1); });
  if (hEl('mastMinus')) hEl('mastMinus').addEventListener('click', function() { bumpField('mastInput', -1); });

  // ---------- Foto de comida (Gemini Vision) ----------
  if (hEl('btnScanMeal')) hEl('btnScanMeal').addEventListener('click', function() {
    if (hEl('mealPhoto')) hEl('mealPhoto').click();
  });

  if (hEl('mealPhoto')) hEl('mealPhoto').addEventListener('change', function(ev) {
    var file = ev.target.files[0];
    if (!file) return;
    habStatus('Procesando foto...', 'loading');
    var reader = new FileReader();
    reader.onload = function(e) {
      // Reusa el resize del scan de tickets: menos peso, misma calidad util
      resizeImage(e.target.result, 1280, function(dataUrl) {
        var b64 = dataUrl.split(',')[1];
        habStatus('Analizando la comida con AI...', 'loading');
        var hora = (hEl('mealHora') && hEl('mealHora').value) || nowHM();
        google.script.run
          .withSuccessHandler(onMealScan)
          .withFailureHandler(function(err) {
            habStatus('✗ ' + (err && err.message ? err.message : err), 'err');
          })
          .scanMealSafe(b64, hora);
      });
    };
    reader.readAsDataURL(file);
    ev.target.value = '';   // permite volver a elegir la misma foto
  });

  function onMealScan(r) {
    if (!r || !r.ok) { habStatus('✗ ' + ((r && r.error) || 'error al analizar'), 'err'); return; }
    habStatus('', '');
    if (hEl('scNombre')) hEl('scNombre').value = r.nombre || '';
    if (hEl('scIngr'))   hEl('scIngr').value   = r.ingredientes || '';
    if (hEl('scMacro'))  hEl('scMacro').value  = r.macro || '';
    if (hEl('scKcal'))   hEl('scKcal').value   = r.kcal || '';
    if (hEl('scProc'))   hEl('scProc').value   = r.procesado || 'Medio';
    if (hEl('scHora'))   hEl('scHora').value   = r.hora || nowHM();
    var conf = hEl('scanConf');
    if (conf) {
      var c = String(r.confianza || 'Media');
      conf.textContent = 'confianza ' + c.toLowerCase();
      conf.className = 'hscan-conf ' + c.toLowerCase();
    }
    if (hEl('mealScanBox')) hEl('mealScanBox').classList.add('show');
  }

  function closeScanBox() {
    if (hEl('mealScanBox')) hEl('mealScanBox').classList.remove('show');
  }
  if (hEl('scCancel')) hEl('scCancel').addEventListener('click', function() {
    closeScanBox(); habStatus('Descartado', 'ok');
  });

  if (hEl('scSave')) hEl('scSave').addEventListener('click', function() {
    var nombre = (hEl('scNombre') && hEl('scNombre').value.trim()) || '';
    if (!nombre) { habStatus('Poné un nombre al plato', 'err'); return; }
    habStatus('Guardando comida...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) {
          closeScanBox();
          var w = r.written || {};
          habStatus('✓ ' + nombre + ' — ' + (w.macro || '') + (w.kcal ? ' · ' + w.kcal + ' kcal' : ''), 'ok');
          reloadLog();
        } else { habStatus('✗ ' + ((r && r.error) || 'error'), 'err'); }
      })
      .withFailureHandler(function(err) { habStatus('✗ ' + (err && err.message ? err.message : err), 'err'); })
      .addMealSafe({
        date: H.date,
        comida: nombre,
        hora: (hEl('scHora') && hEl('scHora').value) || nowHM(),
        macro: (hEl('scMacro') && hEl('scMacro').value.trim()) || '',
        procesado: (hEl('scProc') && hEl('scProc').value) || '',
        kcal: (hEl('scKcal') && hEl('scKcal').value.replace(/\D/g, '')) || '',
        ingredientes: (hEl('scIngr') && hEl('scIngr').value.trim()) || ''
      });
  });

  // ---------- Agua: registro de tomas (se guardan al instante) ----------
  function renderAgua() {
    var total = 0;
    for (var i = 0; i < H.waters.length; i++) total += (H.waters[i].ml || 0);
    var lbl = hEl('aguaTot');
    if (lbl) lbl.textContent = fmtMl(total) + ' ml' + (total >= AGUA_META ? ' · meta ✓' : ' de ' + fmtMl(AGUA_META));
    var box = hEl('aguaBar');
    if (!box) return;
    var segs = Math.ceil(AGUA_META / AGUA_STEP);
    var full = Math.min(Math.floor(total / AGUA_STEP), segs);
    var html = '';
    for (var j = 0; j < segs; j++) html += '<i class="' + (j < full ? 'on' : '') + '"></i>';
    box.innerHTML = html;
  }

  function renderWaters() {
    var box = hEl('aguaList');
    renderAgua();
    if (!box) return;
    if (!H.waters.length) {
      box.innerHTML = '<div style="color:#aaa;font-size:13px;padding:6px 2px">Sin tomas registradas este día</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < H.waters.length; i++) {
      var w = H.waters[i];
      html += '<div class="hmeal-row" data-row="' + w.row + '">' +
        '<span class="mt">' + esc(w.hora) + '</span>' +
        '<span class="mn">' + esc(w.tipo) + '</span>' +
        '<span class="mm">' + fmtMl(w.ml) + ' ml</span>' +
      '</div>';
    }
    box.innerHTML = html;
    var rows = box.querySelectorAll('.hmeal-row');
    for (var k = 0; k < rows.length; k++) {
      (function(el) {
        el.addEventListener('click', function() { openWaterModal(parseInt(el.getAttribute('data-row'), 10)); });
      })(rows[k]);
    }
  }

  function addWater(ml, tipo) {
    if (!ml || ml <= 0) { habStatus('Poné una cantidad válida', 'err'); return; }
    var hora = (hEl('aguaHora') && hEl('aguaHora').value) || nowHM();
    habStatus('Guardando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) {
          if (hEl('aguaMl')) hEl('aguaMl').value = '';
          if (hEl('aguaHora')) hEl('aguaHora').value = nowHM();
          habStatus('✓ ' + (r.written && r.written.tipo) + ' · ' + fmtMl(ml) + ' ml — total ' + fmtMl(r.total) + ' ml', 'ok');
          reloadLog();
        } else { habStatus('✗ ' + ((r && r.error) || 'error'), 'err'); }
      })
      .withFailureHandler(function(err) { habStatus('✗ ' + (err && err.message ? err.message : err), 'err'); })
      .addWaterSafe({ date: H.date, ml: ml, tipo: tipo || '', hora: hora });
  }

  (function() {
    var ab = document.querySelectorAll('#quickAgua button');
    for (var i = 0; i < ab.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          addWater(parseInt(btn.getAttribute('data-ml'), 10) || 0, btn.getAttribute('data-tipo') || '');
        });
      })(ab[i]);
    }
  })();

  // ---------- Guardar el dia ----------
  // Un solo camino de guardado para el boton manual y para el autoguardado.
  // opts: { silent: no muestra spinner, then: callback al terminar }
  function saveDay(opts) {
    opts = opts || {};
    var payload = { date: H.date };
    var campos = [];

    // Lo que se guarda es exactamente lo que se ve en el form. Un campo con
    // valor se manda; uno vacío que ANTES tenía algo se manda en 'clear'
    // para que se borre de la hoja. Sin esto no habría forma de corregir un
    // dato mal cargado.
    var borrar = [];
    var prev = H.saved || {};
    function poner(campo, valor, etiqueta) {
      var teniaAntes = prev[campo] !== undefined && prev[campo] !== null && prev[campo] !== '';
      if (valor !== '' && valor !== null && valor !== undefined) {
        payload[campo] = valor;
        campos.push(etiqueta);
      } else if (teniaAntes) {
        borrar.push(campo);
        campos.push(etiqueta + ' (borrado)');
      }
    }

    poner('levante', getWheel('levH', 'levM'), 'levanté');
    poner('acoste',  getWheel('acoH', 'acoM'), 'acosté');

    var tr = hEl('habTrabajo');
    poner('trabajo', tr ? normDec(tr.value.trim()) : '', 'trabajo');
    var av = hEl('habAvance');
    poner('avance', (av && av.value !== '0') ? av.value : '', 'avance');
    var an = hEl('habAnimo');
    poner('animo', (an && an.value !== '0') ? an.value : '', 'ánimo');
    var et = hEl('ejerText');
    poner('ejercicio', et ? et.value.trim() : '', 'ejercicio');
    var em = hEl('ejerMin');
    poner('ejercicioMin', em ? normDec(em.value.trim()) : '', 'min');
    poner('medite', H.medite || '', 'meditación');
    var mm = hEl('mediteMin');
    poner('mediteMin', mm ? normDec(mm.value.trim()) : '', 'min medit.');
    poner('lei', H.lei || '', 'lectura');
    var nt = hEl('habNotas');
    poner('notas', nt ? nt.value.trim() : '', 'notas');

    // El agua no va acá: se lleva como registro de tomas, con su propio guardado.
    // El contador pasa por poner() como el resto: antes se mandaba SIEMPRE, así
    // que un autoguardado con H.saved a medio cargar escribía 0 encima del
    // valor real, y además 'campos' nunca quedaba vacío.
    var ms = hEl('mastInput');
    var msv = ms ? parseInt(String(ms.value).replace(/\D/g,''), 10) : NaN;
    poner('mast', (isFinite(msv) && msv > 0) ? msv : '', 'contador');

    if (borrar.length) payload.clear = borrar.join(',');

    if (!campos.length) {
      if (!opts.silent) habStatus('No hay nada para guardar', 'err');
      if (opts.then) opts.then(false);
      return;
    }

    if (!opts.silent) habStatus('Guardando día...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) {
          clearDirty();
          pintarSueno();
          // Releer del sheet para que H.saved refleje lo que quedó guardado.
          // Sin esto el próximo guardado compararía contra un estado viejo y
          // podría pedir borrar algo que ya no corresponde.
          if (!opts.then) refreshSaved();
          habStatus((opts.silent ? '✓ Guardado automático · ' : '✓ Guardado · ') + campos.join(', '), 'ok');
        } else {
          habStatus('✗ ' + ((r && r.error) || 'error'), 'err');
        }
        if (opts.then) opts.then(!!(r && r.ok));
      })
      .withFailureHandler(function(err) {
        habStatus('✗ ' + (err && err.message ? err.message : err), 'err');
        if (opts.then) opts.then(false);
      })
      .habitDaySafe(payload);
  }

  // ---------- Autoguardado y cambio de día ----------
  // El form vive en el celular hasta que se guarda, asi que la red de
  // seguridad tiene que correr acá y no en un trigger del servidor.
  var rolloverTimer = null;

  // Guarda lo pendiente y pasa al dia nuevo con el form limpio.
  function rolloverDay() {
    // Si nunca se abrió la pestaña no hay nada que rotar: H.date está vacío
    // y cargar el día acá dispararía una llamada al server al pedo.
    if (!habitLoadedOnce) { programarMedianoche(); return; }
    var siguiente = todayISO();
    if (H.dirty) {
      saveDay({ silent: true, then: function() { loadDay(siguiente); } });
    } else if (H.date !== siguiente) {
      loadDay(siguiente);
    }
    programarMedianoche();
  }

  // Timer hasta las 00:00:05 del dia siguiente (5s de gracia para no
  // pelearse con el reloj). Se reprograma solo despues de cada disparo.
  function programarMedianoche() {
    if (rolloverTimer) clearTimeout(rolloverTimer);
    var ahora = new Date();
    var proxima = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() + 1, 0, 0, 5);
    var ms = proxima.getTime() - ahora.getTime();
    // setTimeout revienta arriba de ~24.8 dias; acá nunca pasa de 24 hs.
    rolloverTimer = setTimeout(rolloverDay, ms);
  }
  programarMedianoche();

  // Si la app se va a segundo plano con cambios sin guardar, guardarlos.
  // En iOS 'visibilitychange' a hidden es mucho mas confiable que beforeunload.
  document.addEventListener('visibilitychange', function() {
    // No se filtra por pestaña visible: si hay cambios de hábitos sin guardar
    // hay que rescatarlos aunque el usuario esté parado en Gastos.
    if (!habitLoadedOnce) return;

    if (document.visibilityState === 'hidden') {
      if (H.dirty) saveDay({ silent: true });
    } else {
      // Al volver: si cambio el dia (quedo abierta toda la noche), rotar.
      if (H.date !== todayISO()) rolloverDay();
      else programarMedianoche();
    }
  });

  // pero no cuesta nada intentarlo.
  window.addEventListener('pagehide', function() {

  });

  function argStatus(t, cls) {
    var el = hEl('argStatus');

  }
  function nArg(v) { return parseFloat(String(v == null ? '' : v).replace(/\./g, '').replace(',', '.')) || 0; }
  function fmtArs(n) { return '$ ' + fmtMl(Math.round(n || 0)); }
  function fmtUsd(n) { return 'US$ ' + (Math.round((n || 0) * 100) / 100).toString().replace('.', ','); }

  // ---- Selector de tipo: cambia qué campos se piden ----
  function setTipo(t) {
    ARG.tipo = t;
    var bs = document.querySelectorAll('.argtipo');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('activo', bs[i].getAttribute('data-tipo') === t);

    var esGasto = (t === 'Gasto');
    var show = function(id, on) { var e = hEl(id); if (e) e.style.display = on ? '' : 'none'; };
    show('argCampoArs', esGasto);     // pesos + cotización
    show('argCampoUsd', !esGasto);    // dólares que le devolviste
    show('argCampoCat', esGasto);
    show('argCampoQuien', esGasto);   // un pago siempre es a mamá
    show('argCampoDetalle', true);
    var d = hEl('argDetalle');
    if (d) d.placeholder = esGasto ? '¿En qué gastaste?' : 'ej: le transferí';
    var b = hEl('argAdd');
    if (b) b.textContent = esGasto ? 'Guardar gasto' : 'Guardar';

    var hint = hEl('argHint');
    if (hint) {
      hint.textContent = esGasto
        ? 'Pagaste algo en pesos. Con la cotización se anota cuántos dólares fueron.'
        : 'Le diste dólares a tu madre. Baja lo que le debés.';
    }
    argCalc();
  }
  (function() {
    var bs = document.querySelectorAll('.argtipo');
    for (var i = 0; i < bs.length; i++) {
      (function(b) { b.addEventListener('click', function() { setTipo(b.getAttribute('data-tipo')); }); })(bs[i]);
    }
    var qs = document.querySelectorAll('.argquien');
    for (var j = 0; j < qs.length; j++) {
      (function(b) {
        b.addEventListener('click', function() {
          ARG.quien = b.getAttribute('data-quien');
          for (var k = 0; k < qs.length; k++) qs[k].classList.toggle('activo', qs[k] === b);
        });

    }
  })();

  // Muestra cuántos dólares son esos pesos a la cotización puesta
  function argCalc() {
    var el = hEl('argCalc');
    if (!el) return;
    if (ARG.tipo !== 'Gasto') { el.textContent = ''; return; }
    var a = nArg(hEl('argArs') && hEl('argArs').value);
    var c = nArg(hEl('argCotiz') && hEl('argCotiz').value);
    el.textContent = (a > 0 && c > 0) ? ('= ' + fmtUsd(Math.round((a / c) * 100) / 100)) : '';
  }
  ['argArs','argCotiz'].forEach(function(id) {
    var e = hEl(id); if (e) e.addEventListener('input', argCalc);
  });

  // ---- Carga de datos ----
  function loadArg() {
    argStatus('Cargando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        argStatus('', '');
        argLoadedOnce = true;
        if (!r || !r.ok) { argStatus('✗ ' + ((r && r.error) || 'error'), 'err'); return; }
        ARG.entradas = r.entradas || [];
        ARG.cats = r.categorias || [];
        if (hEl('argMes')) hEl('argMes').textContent = '· ' + (r.tab || '');
        var sel = hEl('argCat');
        if (sel && !sel.options.length) {
          sel.innerHTML = ARG.cats.map(function(c) { return '<option>' + esc(c) + '</option>'; }).join('');
          sel.value = 'Comida';
        }
        if (hEl('argFecha') && !hEl('argFecha').value) hEl('argFecha').value = todayISO();
        pintarArg(r.totales);
      })
      .withFailureHandler(function(e) { argStatus('✗ ' + (e && e.message ? e.message : e), 'err'); })
      .getArgentinaDataSafe(null);
  }

  function pintarArg(t) {
    t = t || {};
    var set = function(id, v) { var e = hEl(id); if (e) e.textContent = v; };
    set('argGaste',    fmtArs(t.gastadoArs));
    set('argGasteUsd', fmtUsd(t.gastadoUsd));
    set('argMio',      fmtUsd(t.pusoMioUsd));
    set('argMama',     fmtUsd(t.pusoMamaUsd));
    set('argPagado',   fmtUsd(t.pagadoUsd));
    // La deuda arrastrada solo aparece si existe; en un mes que arranca de cero
    // es ruido.
    set('argAntes',    fmtUsd(t.deudaAntesUsd));
    var rowAntes = hEl('argRowAntes');
    if (rowAntes) rowAntes.style.display = (t.deudaAntesUsd || 0) ? '' : 'none';

    // Si le devolvió más de lo que gastó con plata suya, una deuda negativa se
    // lee mal. Se muestra al revés: le diste de más.
    var dd = hEl('argDeuda'), lblD = dd && dd.previousElementSibling;
    if ((t.deudaUsd || 0) < 0) {
      set('argDeuda', fmtUsd(Math.abs(t.deudaUsd)));
      if (lblD) lblD.textContent = 'Le di de más';
      if (dd) dd.style.color = '#15803d';
    } else {
      set('argDeuda', fmtUsd(t.deudaUsd));
      if (lblD) lblD.textContent = 'Le debo a mamá';
      if (dd) dd.style.color = '';
    }

    var box = hEl('argList');
    if (!box) return;
    if (!ARG.entradas.length) {
      box.innerHTML = '<div style="color:#aaa;font-size:13px;padding:6px 2px">Sin movimientos este mes</div>';
      return;
    }
    var html = '';
    for (var i = ARG.entradas.length - 1; i >= 0; i--) {
      var e = ARG.entradas[i];
      var tipoL = e.tipo.toLowerCase();
      // El sheet guarda Carga/Gasto/Pago; en pantalla se muestran en primera
      // persona, que es como el usuario piensa lo que hizo.
      var etiqueta = tipoL === 'carga' ? 'Cambié' : (tipoL === 'pago' ? 'Le di' : 'Gasté');
      var monto = (tipoL === 'pago') ? fmtUsd(e.usd) : fmtArs(e.ars);
      var extra = (tipoL !== 'pago' && e.usd) ? (' · ' + fmtUsd(e.usd)) : '';
      var fecha = e.fecha ? e.fecha.slice(8) + '/' + e.fecha.slice(5, 7) : '';
      html += '<div class="argmov" data-row="' + e.row + '">' +
        '<span class="at ' + tipoL + '">' + etiqueta + '</span>' +
        '<span class="ad">' + esc(e.detalle || '—') +
          (e.categoria ? ' <span class="aq">· ' + esc(e.categoria) + '</span>' : '') +
          (e.quien ? ' <span class="aq">· ' + esc(e.quien) + '</span>' : '') + '</span>' +
        '<span class="am">' + monto + extra + '<span class="aq"> ' + fecha + '</span></span>' +
      '</div>';
    }
    box.innerHTML = html;
    var rows = box.querySelectorAll('.argmov');
    for (var k = 0; k < rows.length; k++) {
      (function(el) {
        el.addEventListener('click', function() { abrirArgModal(parseInt(el.getAttribute('data-row'), 10)); });
      })(rows[k]);
    }
  }

  // ---- Alta ----
  if (hEl('argAdd')) hEl('argAdd').addEventListener('click', function() {
    var payload = {
      fecha: (hEl('argFecha') && hEl('argFecha').value) || todayISO(),
      tipo: ARG.tipo,
      detalle: (hEl('argDetalle') && hEl('argDetalle').value.trim()) || ''
    };
    if (ARG.tipo === 'Gasto') {
      var a = nArg(hEl('argArs') && hEl('argArs').value);
      if (!a) { argStatus('¿Cuántos pesos argentinos gastaste?', 'err'); return; }
      var c = nArg(hEl('argCotiz') && hEl('argCotiz').value);
      if (!c) { argStatus('Falta la cotización del dólar', 'err'); return; }
      payload.ars = a;
      payload.cotiz = c;
      payload.quien = ARG.quien;
      payload.categoria = (hEl('argCat') && hEl('argCat').value) || '';
    } else {
      var u = nArg(hEl('argUsd') && hEl('argUsd').value);
      if (!u) { argStatus('¿Cuántos dólares le diste?', 'err'); return; }
      payload.usd = u;
      payload.quien = 'Mamá';
    }
    argStatus('Guardando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) {
          // La cotización no se limpia: en un mismo viaje es casi siempre la
          // misma y volver a escribirla en cada gasto es un fastidio.
          ['argDetalle','argArs','argUsd'].forEach(function(id) {
            var e = hEl(id); if (e) e.value = '';
          });
          argCalc();
          var dicho = ARG.tipo === 'Pago' ? 'Anotado: le diste dólares a tu madre' : 'Gasto guardado';
          argStatus('✓ ' + dicho, 'ok');
          loadArg();
        } else { argStatus('✗ ' + ((r && r.error) || 'error'), 'err'); }
      })
      .withFailureHandler(function(e) { argStatus('✗ ' + (e && e.message ? e.message : e), 'err'); })
      .addArgentinaSafe(payload);
  });

  // ---- Editar / borrar ----
  function abrirArgModal(row) {
    var e = null;
    for (var i = 0; i < ARG.entradas.length; i++) if (ARG.entradas[i].row === row) { e = ARG.entradas[i]; break; }
    if (!e) return;
    ARG.editRow = row;
    ARG.editTipo = e.tipo || 'Gasto';
    ARG.editQuien = (String(e.quien || '').toLowerCase().indexOf('mam') >= 0) ? 'Mamá' : 'Mía';
    var esPago = String(e.tipo || '').toLowerCase() === 'pago';
    var showM = function(id, on) { var el = hEl(id); if (el) el.style.display = on ? '' : 'none'; };
    showM('agCampoGasto', !esPago);
    showM('agCampoPago', esPago);
    var qs = document.querySelectorAll('.agquien');
    for (var j = 0; j < qs.length; j++) qs[j].classList.toggle('activo', qs[j].getAttribute('data-quien') === ARG.editQuien);
    if (hEl('agDetalle')) hEl('agDetalle').value = e.detalle || '';
    if (hEl('agUsd'))     hEl('agUsd').value     = e.usd != null ? e.usd : '';
    if (hEl('agCotiz'))   hEl('agCotiz').value   = e.cotiz != null ? e.cotiz : '';
    if (hEl('agArs'))     hEl('agArs').value     = e.ars != null ? e.ars : '';
    if (hEl('agFecha'))   hEl('agFecha').value   = e.fecha || '';
    agCalc();
    if (hEl('argModal'))  hEl('argModal').classList.add('show');
  }
  function cerrarArgModal() {
    ARG.editRow = null;
    if (hEl('argModal')) hEl('argModal').classList.remove('show');
  }
  // Al tocar los pesos o la cotización, mostrar en vivo cuántos dólares son.
  // Sin esto el modal guardaba el USD viejo y la deuda quedaba mal.
  function agCalc() {
    var el = hEl('agCalc');
    if (!el) return;
    var a = nArg(hEl('agArs') && hEl('agArs').value);
    var c = nArg(hEl('agCotiz') && hEl('agCotiz').value);
    el.textContent = (a > 0 && c > 0) ? ('= ' + fmtUsd(Math.round((a / c) * 100) / 100)) : '';
  }
  ['agArs','agCotiz'].forEach(function(id) {
    var e = hEl(id);
    if (e) e.addEventListener('input', agCalc);
  });
  (function() {
    var qs = document.querySelectorAll('.agquien');
    for (var j = 0; j < qs.length; j++) {
      (function(b) {
        b.addEventListener('click', function() {
          ARG.editQuien = b.getAttribute('data-quien');
          for (var k = 0; k < qs.length; k++) qs[k].classList.toggle('activo', qs[k] === b);
        });
      })(qs[j]);
    }
  })();

  if (hEl('agCancel')) hEl('agCancel').addEventListener('click', cerrarArgModal);
  if (hEl('argModal')) hEl('argModal').addEventListener('click', function(ev) {
    if (ev.target === hEl('argModal')) cerrarArgModal();
  });

  if (hEl('agSave')) hEl('agSave').addEventListener('click', function() {
    if (ARG.editRow == null) return;
    argStatus('Guardando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        cerrarArgModal();
        if (r && r.ok) { argStatus('✓ Actualizado', 'ok'); loadArg(); }
        else argStatus('✗ ' + ((r && r.error) || 'error'), 'err');
      })
      .withFailureHandler(function(e) { cerrarArgModal(); argStatus('✗ ' + (e && e.message ? e.message : e), 'err'); })
      .updateArgentinaSafe({
        row: ARG.editRow,
        detalle: (hEl('agDetalle') && hEl('agDetalle').value.trim()) || '',
        usd:   (hEl('agUsd')   && hEl('agUsd').value.trim())   || '',
        cotiz: (hEl('agCotiz') && hEl('agCotiz').value.trim()) || '',
        ars:   (hEl('agArs')   && hEl('agArs').value.trim())   || '',
        quien: ARG.editQuien || '',
        fecha: (hEl('agFecha') && hEl('agFecha').value) || ''
      });
  });

  if (hEl('agDelete')) hEl('agDelete').addEventListener('click', function() {
    if (ARG.editRow == null) return;
    if (!confirm('¿Borrar este movimiento?')) return;
    var row = ARG.editRow;
    argStatus('Borrando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        cerrarArgModal();
        if (r && r.ok) { argStatus('✓ Borrado: ' + r.deleted, 'ok'); loadArg(); }
        else argStatus('✗ ' + ((r && r.error) || 'error'), 'err');
      })
      .withFailureHandler(function(e) { cerrarArgModal(); argStatus('✗ ' + (e && e.message ? e.message : e), 'err'); })
      .deleteArgentinaSafe({ row: row });
  });

  setTipo('Gasto');
</script>
