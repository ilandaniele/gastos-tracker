<script>
  function setStatus(text, cls) {
    var el = document.getElementById('status');
    el.className = cls || '';
    el.textContent = text;
    // Mostrar/ocultar el overlay full-screen con spinner cuando es 'loading'
    var overlay = document.getElementById('loadingOverlay');
    if (overlay) {
      if (cls === 'loading') {
        var txt = document.getElementById('loadingText');
        if (txt) txt.textContent = text || 'Guardando...';
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }
  }

  function setLocked(locked) {
    // Disable all form inputs + quick buttons during save
    var f = document.getElementById('f');
    for (var i = 0; i < f.elements.length; i++) f.elements[i].disabled = locked;
    var qbtns = document.querySelectorAll('#quickVar button, #quickFijo button');
    for (var j = 0; j < qbtns.length; j++) qbtns[j].disabled = locked;
    document.body.style.opacity = locked ? '0.6' : '1';
    document.body.style.pointerEvents = locked ? 'none' : 'auto';
    // Keep status visible
    document.getElementById('status').style.pointerEvents = 'auto';
  }

  function getField(name) {
    return document.querySelector('#f [name="' + name + '"]');
  }

  // Asegurar que el input de fecha refleje el "hoy" del cliente, no el cacheado
  // del momento que se renderizó el HTML (caso típico: webapp abierta desde ayer).
  function _todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function refreshDateToToday() {
    var f = document.getElementById('date');
    if (f) f.value = _todayStr();
  }
  // Init: corregir el valor server-rendered con el "hoy" del cliente
  refreshDateToToday();
  // Cuando la PWA/pestaña vuelve a estar visible (típico al reabrir después de horas),
  // refrescar la fecha. Cubre el caso de webapp pinned/PWA abierta desde un día anterior.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') refreshDateToToday();
  });

  function fillQuick(data) {
    var itemField = getField('item');
    if (itemField) itemField.value = data.item || '';
    var amountField = getField('amount');
    if (data.amount !== undefined && data.amount !== null) amountField.value = data.amount;
    var curField = getField('currency'); if (data.currency && curField) curField.value = data.currency;
    var cardField = getField('card'); if (data.card && cardField) cardField.value = data.card;
    var catField = getField('category');
    if (data.category && catField) { catField.value = data.category; catTocadaAMano = true; }
    if (data.amount === undefined || data.amount === null) amountField.focus();
  }

  // Hardcoded quick presets — avoids HTML attribute sanitization issues
  var QUICKS = {
    // Variables
    bus52:     { item: 'Bus', amount: 52, currency: 'UYU', card: 'Crédito OCA', category: 'Transporte' },
    cafe:      { item: 'Café', currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    frog:      { item: 'Frog', currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    disco:     { item: 'Disco', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Comida' },
    devoto:    { item: 'Devoto', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Comida' },
    tata:      { item: 'Tata', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Comida' },
    claude:    { item: 'Claude', currency: 'USD', card: 'Crédito Itaú USD', category: 'Suscripciones' },
    uber:      { item: 'Uber', currency: 'UYU', card: 'Débito UYU', category: 'Transporte' },
    cabify:    { item: 'Cabify', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Transporte' },
    taxi:      { item: 'Taxi', currency: 'UYU', card: 'Débito UYU', category: 'Transporte' },
    agua140:   { item: 'Agua', amount: 140, currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    futbol350: { item: 'Fútbol', amount: 350, currency: 'UYU', card: 'Débito UYU', category: 'Gimnasio' },
    farma:     { item: 'Farmacia', currency: 'UYU', card: 'Débito UYU', category: 'Salud' },
    medic:     { item: 'Medicamento', currency: 'UYU', card: 'Débito UYU', category: 'Salud' },
    cine:      { item: 'Cine', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Entretenimiento' },
    regalo:    { item: 'Regalo', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Regalos' },
    ropa:      { item: 'Ropa', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Ropa' },
    pelu:      { item: 'Peluquería', currency: 'UYU', card: 'Débito UYU', category: 'Ropa' },
    powerade:  { item: 'Powerade', currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    empanadas: { item: 'Empanadas', currency: 'UYU', card: 'Débito UYU', category: 'Comida' },
    pizza:     { item: 'Pizza', currency: 'UYU', card: 'Crédito Itaú UYU', category: 'Comida' },
    fernet:    { item: 'Fernet', currency: 'UYU', card: 'Débito UYU', category: 'Bebida/Bar' },
    nafta:     { item: 'Nafta', currency: 'UYU', card: 'Crédito OCA', category: 'Transporte' },
    otros:     { item: '', currency: 'UYU', card: 'Débito UYU', category: 'Otros' },
    // Fijos — kind:'fijo' routes to fixed-table row on server (Mayo 2026 layout)
    fijo_alquiler:   { kind: 'fijo', item: 'Alquiler', amount: 29500, currency: 'UYU', card: 'Débito UYU', category: 'Hogar' },
    fijo_gc:         { kind: 'fijo', item: 'Gastos comunes',   currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_trib:       { kind: 'fijo', item: 'Tributos domiciliarios', currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_antel_int:  { kind: 'fijo', item: 'Antel Internet',   currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_antel_mov:  { kind: 'fijo', item: 'Antel móvil',      currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_luz:        { kind: 'fijo', item: 'Luz',              currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_itau:       { kind: 'fijo', item: 'Itau paquete',     currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_sandra:     { kind: 'fijo', item: 'Sandra Psicologa', currency: 'UYU', card: 'Débito UYU', category: 'Salud' },
    fijo_viandas:    { kind: 'fijo', item: 'Viandas',          currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_ble:        { kind: 'fijo', item: 'Ble',              currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_bluecross:  { kind: 'fijo', item: 'BlueCross',        currency: 'UYU', card: 'Débito UYU', category: 'Salud' },
    fijo_gimnasio:   { kind: 'fijo', item: 'Gimnasio',         currency: 'UYU', card: 'Débito UYU', category: 'Gimnasio' },
    fijo_itau_cred:  { kind: 'fijo', item: 'Itaú Crédito',     currency: 'UYU', card: 'Débito UYU', category: 'Servicios' },
    fijo_oca:        { kind: 'fijo', item: 'Oca',              currency: 'UYU', card: 'Débito UYU', category: 'Servicios' }
  };
  var btns = document.querySelectorAll('#quickVar button, #quickFijo button');
  for (var i = 0; i < btns.length; i++) {
    (function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-key');
        if (QUICKS[key]) fillQuick(QUICKS[key]);
        else setStatus('Quick key no encontrado: ' + key, 'err');
      });
    })(btns[i]);
  }

  // === Clasificación en vivo por el nombre del ítem ===
  // Las reglas vienen de CAT_RULES en Code.gs (inyectadas al render), así que
  // el form muestra exactamente la categoría con la que se va a guardar. Antes
  // el desplegable quedaba en el default y recién al guardar se sabía: escribir
  // "Claude" mostraba Transporte y terminaba en Suscripciones.
  var CAT_RULES_JS = [];
  try {
    if (typeof CAT_RULES_RAW !== 'undefined') {
      CAT_RULES_JS = CAT_RULES_RAW.map(function(r) {
        return { re: new RegExp(r.source, r.flags), cat: r.cat };
      });
    }
  } catch (e) { CAT_RULES_JS = []; }

  function clasificarItem(texto) {
    var s = String(texto || '').trim();
    if (!s) return null;
    for (var i = 0; i < CAT_RULES_JS.length; i++) {
      if (CAT_RULES_JS[i].re.test(s)) return CAT_RULES_JS[i].cat;
    }
    return 'Otros';
  }

  // Si el usuario elige una categoría a mano, se deja de pisar hasta que
  // limpie el ítem o guarde.
  var catTocadaAMano = false;
  (function() {
    var cat = getField('category');
    if (cat) cat.addEventListener('change', function() { catTocadaAMano = true; });
  })();

  function autoClasificar() {
    if (catTocadaAMano) return;
    var itemField = getField('item'), catField = getField('category');
    if (!itemField || !catField) return;
    var v = itemField.value.trim();
    if (!v) return;
    var c = clasificarItem(v);
    if (c && c !== 'Otros') catField.value = c;
  }

  var AUTO_CARD_RULES = [
    { re: /^\s*bus\b/i, card: 'Crédito OCA' }
  ];
  function autoCorrectCard() {
    var itemField = getField('item');
    var cardField = getField('card');
    if (!itemField || !cardField) return;
    var v = itemField.value.trim();
    var matched = 'Débito UYU'; // default
    for (var i = 0; i < AUTO_CARD_RULES.length; i++) {
      if (AUTO_CARD_RULES[i].re.test(v)) { matched = AUTO_CARD_RULES[i].card; break; }
    }
    cardField.value = matched;
  }
  (function(){
    var itemField = getField('item');
    if (itemField) itemField.addEventListener('input', function() {
      autoCorrectCard();
      autoClasificar();
    });
  })();

  function onSuccess(result) {
    setLocked(false);
    if (result && result.ok) {
      var cot = result.written && result.written.cotizacion;
      var src = result.cotizSource || '?';
      var prefix = result.fixed ? '✓ FIJO actualizado · ' : '✓ Guardado · ';
      var prevNote = '';
      if (result.fixed && result.written && result.written.prevAmount > 0) {
        prevNote = ' (sobreescribió ' + result.written.prevAmount + ')';
      }
      setStatus(prefix + result.tab + ' · row ' + result.row + ' · cot=' + cot + ' (' + src + ')' + prevNote, 'ok');
      var f = document.getElementById('f');
      f.reset();
      catTocadaAMano = false;
      // Local date, not UTC (avoids next-day glitch in evening)
      var n = new Date();
      var iso = n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
      var dateField = getField('date');
      if (dateField) dateField.value = iso;
    } else {
      setStatus('✗ Error: ' + (result && result.error ? result.error : 'desconocido'), 'err');
    }
  }

  function onError(err) {
    setLocked(false);
    setStatus('✗ Server: ' + (err && err.message ? err.message : err), 'err');
  }

  // Normaliza decimales: acepta coma o punto → siempre punto para el backend
  function normDec(s) { return String(s == null ? '' : s).replace(',', '.').trim(); }

  // Real-time: reemplazar coma por punto en campos numéricos mientras se tipea
  (function(){
    var numericFields = ['amount', 'cotizacion'];
    numericFields.forEach(function(name){
      var el = getField(name);
      if (!el) return;
      el.addEventListener('input', function(){
        var pos = el.selectionStart;
        var v = el.value;
        // Sólo permitir dígitos, coma, punto (una sola)
        var cleaned = v.replace(/[^0-9.,]/g, '');
        // Colapsar múltiples separadores → dejar sólo el primero
        var firstSep = cleaned.search(/[.,]/);
        if (firstSep >= 0) {
          cleaned = cleaned.slice(0, firstSep + 1) + cleaned.slice(firstSep + 1).replace(/[.,]/g, '');
        }
        if (cleaned !== v) {
          el.value = cleaned;
          try { el.setSelectionRange(pos, pos); } catch(_){}
        }
      });
    });
  })();

  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var f = document.getElementById('f');
    var data = {};
    for (var i = 0; i < f.elements.length; i++) {
      var el = f.elements[i];
      if (el.name && el.value) {
        // Normalizar decimales antes de mandar al backend
        data[el.name] = (el.name === 'amount' || el.name === 'cotizacion') ? normDec(el.value) : el.value;
      }
    }
    setLocked(true);
    setStatus('Guardando...', 'loading');
    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onError)
      .addExpenseSafe(data);
  });

  // === Ticket OCR scan ===
  var scannedItems = [];
  var CATS = (typeof CATEGORIAS !== 'undefined' && CATEGORIAS.length)
    ? CATEGORIAS
    : ['Bebida/Bar','Comida','Entretenimiento','Gimnasio','Hogar','Limpieza','Regalos','Ropa','Salud','Servicios','Suscripciones','Transporte','Viajes','Otros'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function resizeImage(dataUrl, maxSize, cb) {
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      var ratio = Math.min(maxSize/w, maxSize/h, 1);
      var nw = Math.round(w * ratio), nh = Math.round(h * ratio);
      var canvas = document.createElement('canvas');
      canvas.width = nw; canvas.height = nh;
      canvas.getContext('2d').drawImage(img, 0, 0, nw, nh);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = dataUrl;
  }

  document.getElementById('scanBtn').addEventListener('click', function(){
    document.getElementById('ticketFile').click();
  });
  document.getElementById('ticketFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (!file) return;
    setStatus('Procesando imagen...', 'loading');
    var reader = new FileReader();
    reader.onload = function(e){
      resizeImage(e.target.result, 1280, function(resizedDataUrl){
        var b64 = resizedDataUrl.split(',')[1];
        setStatus('Escaneando ticket con AI (puede tardar)...', 'loading');
        google.script.run
          .withSuccessHandler(onScanResult)
          .withFailureHandler(function(err){
            setStatus('✗ Scan: ' + (err && err.message ? err.message : err), 'err');
          })
          .scanTicket(b64);
      });
    };
    reader.readAsDataURL(file);
    // Reset input so same file can be re-selected
    ev.target.value = '';
  });

  function onScanResult(result) {
    if (!result || !result.ok) {
      setStatus('✗ ' + (result && result.error || 'scan error'), 'err');
      return;
    }
    scannedItems = (result.items || []).map(function(it){
      return { name: it.name || '', amount: parseFloat(normDec(it.amount)) || 0, category: it.category || 'Otros' };
    });
    if (!scannedItems.length) {
      setStatus('No se detectaron items. Probá con foto más clara.', 'err');
      return;
    }
    renderScanPreview();
    setStatus('✓ ' + scannedItems.length + ' items detectados', 'ok');
  }

  function renderScanPreview() {
    var container = document.getElementById('scanItems');
    var html = '';
    for (var i = 0; i < scannedItems.length; i++) {
      var it = scannedItems[i];
      html += '<div class="scan-row">' +
        '<input type="text" data-idx="' + i + '" data-field="name" value="' + esc(it.name) + '">' +
        '<input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" data-idx="' + i + '" data-field="amount" value="' + it.amount + '">' +
        '<select data-idx="' + i + '" data-field="category">' +
        CATS.map(function(c){ return '<option' + (c===it.category?' selected':'') + '>' + c + '</option>'; }).join('') +
        '</select>' +
        '<button type="button" class="del-btn" data-del="' + i + '">×</button>' +
      '</div>';
    }
    container.innerHTML = html;
    var totEl = document.getElementById('scanTotal');
    var tot = scannedItems.reduce(function(s,e){ return s + (parseFloat(normDec(e.amount))||0); }, 0);
    totEl.textContent = fmt(tot, 'UYU');
    document.getElementById('scanPreview').style.display = 'block';
    // Wire delete buttons
    var dels = container.querySelectorAll('[data-del]');
    for (var d = 0; d < dels.length; d++) {
      (function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.getAttribute('data-del'), 10);
          scannedItems.splice(idx, 1);
          if (!scannedItems.length) {
            document.getElementById('scanPreview').style.display = 'none';
          } else {
            renderScanPreview();
          }
        });
      })(dels[d]);
    }
    // Wire input updates
    var inputs = container.querySelectorAll('input,select');
    for (var ii = 0; ii < inputs.length; ii++) {
      (function(el){
        el.addEventListener('change', function(){
          var idx = parseInt(el.getAttribute('data-idx'), 10);
          var fld = el.getAttribute('data-field');
          if (!scannedItems[idx]) return;
          scannedItems[idx][fld] = fld === 'amount' ? (parseFloat(normDec(el.value)) || 0) : el.value;
          if (fld === 'amount') {
            var tot = scannedItems.reduce(function(s,e){ return s + (parseFloat(normDec(e.amount))||0); }, 0);
            document.getElementById('scanTotal').textContent = fmt(tot, 'UYU');
          }
        });
      })(inputs[ii]);
    }
  }

  document.getElementById('cancelScan').addEventListener('click', function(){
    scannedItems = [];
    document.getElementById('scanPreview').style.display = 'none';
    setStatus('Cancelado', 'ok');
    setTimeout(function(){ var s = document.getElementById('status'); s.style.display = 'none'; }, 1500);
  });
  document.getElementById('saveAll').addEventListener('click', function(){
    if (!scannedItems.length) return;
    var cardField = getField('card');
    var defaultCard = cardField ? cardField.value : 'Débito UYU';
    var dateField = getField('date');
    var date = dateField ? dateField.value : '';
    var batch = scannedItems.map(function(it){
      return {
        item: it.name,
        amount: it.amount,
        currency: 'UYU',
        card: defaultCard,
        category: it.category,
        date: date
      };
    });
    setLocked(true);
    setStatus('Guardando ' + batch.length + ' items...', 'loading');
    google.script.run
      .withSuccessHandler(function(result){
        setLocked(false);
        if (result && result.ok) {
          setStatus('✓ ' + result.saved + ' guardados · ' + result.failed + ' fallaron · ' + result.tab, 'ok');
          scannedItems = [];
          document.getElementById('scanPreview').style.display = 'none';
        } else {
          setStatus('✗ Batch: ' + (result && result.error || 'error'), 'err');
        }
      })
      .withFailureHandler(function(err){
        setLocked(false);
        setStatus('✗ Batch: ' + (err && err.message ? err.message : err), 'err');
      })
      .addBatch(batch);
  });

  // === Tabs ===
  var dashLoadedOnce = false;
  function switchTab(panelId) {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      var esActiva = tabs[i].getAttribute('data-panel') === panelId;
      tabs[i].classList.toggle('active', esActiva);
      // La barra de tabs scrollea horizontal (ver .tabs en el CSS): al activar
      // una que estaba fuera de vista (ej. "Arg" tocada desde un atajo, o el
      // usuario ya había scrolleado), la trae a la vista sola.
      if (esActiva) tabs[i].scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
    }
    var panels = document.querySelectorAll('.panel');
    for (var j = 0; j < panels.length; j++) {
      panels[j].classList.toggle('active', panels[j].id === panelId);
    }
    if (panelId === 'dashPanel' && !dashLoadedOnce) loadDashboard();
    // Recargar siempre al entrar: si guardaste y volviste, tenés que ver lo
    // que quedó en la hoja y no el form viejo. Si hay cambios sin guardar se
    // respetan y no se pisan.
    if (panelId === 'argPanel') loadArg();
    if (panelId === 'ahoPanel') loadAhorros();
    if (panelId === 'tareasPanel') loadTareas();
    if (panelId === 'habitPanel') {
      if (!habitLoadedOnce) loadHabitToday();
      else if (!H.dirty) loadDay(H.date || todayISO());
    }
    // Cada vez que se abre la pestaña de agregar, refrescar la fecha a "hoy"
    if (panelId === 'addPanel') refreshDateToToday();
  }
  var tabBtns = document.querySelectorAll('.tab');
  for (var t = 0; t < tabBtns.length; t++) {
    (function(b){ b.addEventListener('click', function(){ switchTab(b.getAttribute('data-panel')); }); })(tabBtns[t]);
  }

  // === Pantalla de inicio ===
  // La app arranca en homePanel (ver form.html) con la barra de tabs oculta;
  // tocar una tarjeta entra a esa sección y muestra la barra + la flecha de
  // volver. goHome() hace el camino inverso.
  function goHome() {
    document.getElementById('tabsWrap').hidden = true;
    var tabs2 = document.querySelectorAll('.tab');
    for (var i2 = 0; i2 < tabs2.length; i2++) tabs2[i2].classList.remove('active');
    var panels2 = document.querySelectorAll('.panel');
    for (var j2 = 0; j2 < panels2.length; j2++) panels2[j2].classList.toggle('active', panels2[j2].id === 'homePanel');
    window.scrollTo(0, 0);
  }
  document.getElementById('backHomeBtn').addEventListener('click', goHome);
  var homeCards = document.querySelectorAll('.home-card');
  for (var h = 0; h < homeCards.length; h++) {
    (function(b){ b.addEventListener('click', function(){
      document.getElementById('tabsWrap').hidden = false;
      switchTab(b.getAttribute('data-panel'));
      // La barra estaba con hidden (ancho 0) cuando se midió al cargar la
      // página, así que hay que recalcular la flechita recién ahora que se ve.
      actualizarTabsFade();
    }); })(homeCards[h]);
  }

  // Flechita de "hay más tabs" — se apaga sola cuando ya no queda nada para
  // scrollear a la derecha (con un margen de 4px por redondeos de subpíxel).
  var actualizarTabsFade = function() {};
  (function() {
    var bar = document.getElementById('tabsBar'), fade = document.getElementById('tabsFade');
    if (!bar || !fade) return;
    function actualizar() {
      var alFinal = bar.scrollWidth - bar.scrollLeft - bar.clientWidth < 4;
      fade.classList.toggle('hide', alFinal);
    }
    actualizarTabsFade = actualizar;
    bar.addEventListener('scroll', actualizar);
    window.addEventListener('resize', actualizar);
    actualizar();
  })();
  document.getElementById('refreshDash').addEventListener('click', function(){ loadDashboard(); });

  // === TAREAS ===============================================================
  // Una sola lista con Tipo Tarea|Cita. La tarjeta "Hoy" es la versión visual
  // del mismo cálculo que arma el mail de la mañana (_tasksDigestHoy en el
  // server) — lo que ves al abrir la app es lo que te llega por mail.
  var TAR = { tareas: [], categorias: [], periodos: [], subcategorias: {}, hoy: '', editando: null,
              tipoNuevo: 'Tarea', tipoModal: 'Tarea', catNuevo: 'Otros', catModal: 'Otros',
              recurNuevo: false, recurModal: false, subcatCategoriaAbierta: '',
              subtareasNuevas: [], subtareasModal: [] };
  var TAR_CAT_EMOJI = { 'Salud': '🩺', 'Trabajo': '💼', 'Personal': '🙋', 'Hogar': '🏠', 'Finanzas': '💵', 'Otros': '📌' };
  function tarEl(id) { return document.getElementById(id); }
  function tarStatus(txt, cls) {
    var el = tarEl('tarStatus');
    if (!el) return;
    el.className = cls || '';
    el.textContent = txt || '';
  }
  function tarDiaCorto(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    return p[2] + '/' + p[1];
  }
  function tarCatEmoji(cat) { return TAR_CAT_EMOJI[cat] || '📌'; }
  // Clase CSS por categoría (ninguna tiene tilde ni espacio, así que alcanza con minúscula)
  function tarCatSlug(cat) { return 'cat-' + String(cat || 'otros').toLowerCase(); }
  // Puebla los <select> de categoría una sola vez, con lo que mandó el server
  // (misma lista que arma las columnas de la pizarra — una sola fuente de verdad).
  function tarPoblarCategorias() {
    var html = TAR.categorias.map(function(c) {
      return '<option value="' + esc(c) + '">' + esc(tarCatEmoji(c)) + ' ' + esc(c) + '</option>';
    }).join('');
    if (tarEl('tarCategoria')) tarEl('tarCategoria').innerHTML = html;
    if (tarEl('tmCategoria')) tarEl('tmCategoria').innerHTML = html;
  }
  function tarPoblarPeriodos() {
    var html = TAR.periodos.map(function(p) { return '<option value="' + esc(p) + '">' + esc(p) + '</option>'; }).join('');
    if (tarEl('tarPeriodo')) tarEl('tarPeriodo').innerHTML = html;
    if (tarEl('tmPeriodo')) tarEl('tmPeriodo').innerHTML = html;
  }
  // Sugerencias del <datalist> de subcategoría para la categoría elegida —
  // siempre se puede escribir cualquier cosa igual, esto solo autocompleta
  // con lo que ya se usó (o se dio de alta a mano, ver subcatModal).
  function tarPoblarSubcatList(categoria, datalistId) {
    var dl = tarEl(datalistId);
    if (!dl) return;
    var lista = TAR.subcategorias[categoria] || [];
    dl.innerHTML = lista.map(function(s) { return '<option value="' + esc(s) + '"></option>'; }).join('');
  }

  // Subtareas: un checklist propio adentro de "Agregar" (TAR.subtareasNuevas)
  // y otro adentro del modal de editar (TAR.subtareasModal) — arrancan vacíos
  // o precargados con lo que ya tenía la tarea (ver tarAbrirModal) y se
  // arman/editan en el cliente; recién viajan al server al guardar.
  function tarSubtareaRowHtml(s, i, conCheck) {
    var check = conCheck
      ? '<span class="hsubtask-check' + (s.d ? ' on' : '') + '" data-subtoglocal="' + i + '">' + (s.d ? '✓' : '') + '</span>'
      : '';
    return '<div class="hsubtask-row' + (s.d ? ' done' : '') + '">' + check +
      '<span class="hsubtask-txt">' + esc(s.t) + '</span>' +
      '<button type="button" class="hsubtask-rm" data-subrm="' + i + '">×</button></div>';
  }
  function tarPintarSubtareasNuevas() {
    var cont = tarEl('tarSubtareasList');
    if (!cont) return;
    cont.innerHTML = TAR.subtareasNuevas.map(function(s, i) { return tarSubtareaRowHtml(s, i, false); }).join('');
    var rms = cont.querySelectorAll('[data-subrm]');
    for (var i = 0; i < rms.length; i++) {
      (function(el) { el.addEventListener('click', function() {
        TAR.subtareasNuevas.splice(parseInt(el.getAttribute('data-subrm'), 10), 1);
        tarPintarSubtareasNuevas();
      }); })(rms[i]);
    }
  }
  function tarPintarSubtareasModal() {
    var cont = tarEl('tmSubtareasList');
    if (!cont) return;
    cont.innerHTML = TAR.subtareasModal.map(function(s, i) { return tarSubtareaRowHtml(s, i, true); }).join('');
    var togs = cont.querySelectorAll('[data-subtoglocal]');
    for (var i = 0; i < togs.length; i++) {
      (function(el) { el.addEventListener('click', function() {
        var idx = parseInt(el.getAttribute('data-subtoglocal'), 10);
        TAR.subtareasModal[idx].d = !TAR.subtareasModal[idx].d;
        tarPintarSubtareasModal();
      }); })(togs[i]);
    }
    var rms = cont.querySelectorAll('[data-subrm]');
    for (var j = 0; j < rms.length; j++) {
      (function(el) { el.addEventListener('click', function() {
        TAR.subtareasModal.splice(parseInt(el.getAttribute('data-subrm'), 10), 1);
        tarPintarSubtareasModal();
      }); })(rms[j]);
    }
  }
  if (tarEl('tarSubtareaAddBtn')) tarEl('tarSubtareaAddBtn').addEventListener('click', function() {
    var v = (tarEl('tarSubtareaInput') && tarEl('tarSubtareaInput').value.trim()) || '';
    if (!v) return;
    TAR.subtareasNuevas.push({ t: v, d: false });
    tarEl('tarSubtareaInput').value = '';
    tarPintarSubtareasNuevas();
  });
  if (tarEl('tarSubtareaInput')) tarEl('tarSubtareaInput').addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); tarEl('tarSubtareaAddBtn').click(); }
  });
  if (tarEl('tmSubtareaAddBtn')) tarEl('tmSubtareaAddBtn').addEventListener('click', function() {
    var v = (tarEl('tmSubtareaInput') && tarEl('tmSubtareaInput').value.trim()) || '';
    if (!v) return;
    TAR.subtareasModal.push({ t: v, d: false });
    tarEl('tmSubtareaInput').value = '';
    tarPintarSubtareasModal();
  });
  if (tarEl('tmSubtareaInput')) tarEl('tmSubtareaInput').addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); tarEl('tmSubtareaAddBtn').click(); }
  });

  var tarTipoBtns = document.querySelectorAll('.tartipo');
  for (var ti = 0; ti < tarTipoBtns.length; ti++) {
    (function(b) {
      b.addEventListener('click', function() {
        for (var k = 0; k < tarTipoBtns.length; k++) tarTipoBtns[k].classList.remove('activo');
        b.classList.add('activo');
        TAR.tipoNuevo = b.getAttribute('data-tipo');
        var esCita = TAR.tipoNuevo === 'Cita';
        if (tarEl('tarCampoFechaCita')) tarEl('tarCampoFechaCita').hidden = !esCita;
        if (tarEl('tarCampoFechaTarea')) tarEl('tarCampoFechaTarea').hidden = esCita;
        // Las dos pueden ser recurrentes, pero una cita no "cuenta veces" — solo
        // repite en el mismo día de la semana/mes (ver _citaProximaFecha en el
        // server), así que a ella le alcanza con el selector "Cada".
        if (tarEl('tarCampoObjetivoNum')) tarEl('tarCampoObjetivoNum').hidden = esCita;
        if (tarEl('tarObjetivoRow')) tarEl('tarObjetivoRow').style.gridTemplateColumns = esCita ? '1fr' : '1fr 1fr';
        if (tarEl('tarPeriodoLbl')) tarEl('tarPeriodoLbl').textContent = esCita ? 'Se repite' : 'Cada';
        if (tarEl('tarRecurBtn')) tarEl('tarRecurBtn').textContent = esCita ? '🔁 Es una cita fija (ej: todos los martes)' : '🔁 Hacerla recurrente';
      });
    })(tarTipoBtns[ti]);
  }

  var tmTipoBtns = document.querySelectorAll('.tmtipo');
  for (var tmi = 0; tmi < tmTipoBtns.length; tmi++) {
    (function(b) {
      b.addEventListener('click', function() {
        for (var k = 0; k < tmTipoBtns.length; k++) tmTipoBtns[k].classList.remove('activo');
        b.classList.add('activo');
        TAR.tipoModal = b.getAttribute('data-tipo');
        var esCita = TAR.tipoModal === 'Cita';
        if (tarEl('tmCampoFechaCita')) tarEl('tmCampoFechaCita').hidden = !esCita;
        if (tarEl('tmCampoFechaTarea')) tarEl('tmCampoFechaTarea').hidden = esCita;
        if (tarEl('tmCampoObjetivoNum')) tarEl('tmCampoObjetivoNum').hidden = esCita;
        if (tarEl('tmObjetivoRow')) tarEl('tmObjetivoRow').style.gridTemplateColumns = esCita ? '1fr' : '1fr 1fr';
        if (tarEl('tmPeriodoLbl')) tarEl('tmPeriodoLbl').textContent = esCita ? 'Se repite' : 'Cada';
        if (tarEl('tmContadorRow')) tarEl('tmContadorRow').hidden = esCita;
        if (tarEl('tmRecurBtn')) tarEl('tmRecurBtn').textContent = esCita ? '🔁 Es una cita fija (ej: todos los martes)' : '🔁 Hacerla recurrente';
      });
    })(tmTipoBtns[tmi]);
  }

  if (tarEl('tarRecurBtn')) tarEl('tarRecurBtn').addEventListener('click', function() {
    TAR.recurNuevo = !TAR.recurNuevo;
    this.classList.toggle('activo', TAR.recurNuevo);
    if (tarEl('tarCampoObjetivo')) tarEl('tarCampoObjetivo').hidden = !TAR.recurNuevo;
  });
  if (tarEl('tmRecurBtn')) tarEl('tmRecurBtn').addEventListener('click', function() {
    TAR.recurModal = !TAR.recurModal;
    this.classList.toggle('activo', TAR.recurModal);
    if (tarEl('tmCampoObjetivo')) tarEl('tmCampoObjetivo').hidden = !TAR.recurModal;
  });

  function loadTareas() {
    tarStatus('Cargando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.ok) { tarStatus('✗ ' + ((r && r.error) || 'error'), 'err'); return; }
        TAR.tareas = r.tareas || [];
        TAR.categorias = r.categorias || [];
        TAR.periodos = r.periodos || [];
        TAR.subcategorias = r.subcategorias || {};
        TAR.hoy = r.hoy || '';
        tarPoblarCategorias();
        tarPoblarPeriodos();
        tarPoblarSubcatList(TAR.catNuevo, 'tarSubcatList');
        tarPoblarSubcatList(TAR.catModal, 'tmSubcatList');
        tarStatus('', '');
        tarPintar();
      })
      .withFailureHandler(function(err) {
        tarStatus('✗ ' + (err && err.message ? err.message : err), 'err');
      })
      .getTasksSafe();
  }

  if (tarEl('tarCategoria')) tarEl('tarCategoria').addEventListener('change', function() {
    TAR.catNuevo = this.value;
    tarPoblarSubcatList(TAR.catNuevo, 'tarSubcatList');
  });
  if (tarEl('tmCategoria')) tarEl('tmCategoria').addEventListener('change', function() {
    TAR.catModal = this.value;
    tarPoblarSubcatList(TAR.catModal, 'tmSubcatList');
  });

  function tarBadges(t, hideSubcat, hideSubtasks) {
    var out = '';
    if (t.tipo === 'Cita') {
      out += '<span class="task-badge cita">📅 ' + (t.recurrente ? '🔁 ' : '') + esc(tarDiaCorto(t.fecha)) +
             (t.hora ? ' ' + esc(t.hora) : '') + '</span>';
    } else if (t.fecha) {
      var venc = t.fecha < TAR.hoy, esHoy = t.fecha === TAR.hoy;
      out += '<span class="task-badge ' + (venc ? 'vencida' : (esHoy ? 'hoy' : 'cita')) + '">' +
             (venc ? '⚠️ vencía ' : '📌 ') + esc(tarDiaCorto(t.fecha)) + '</span>';
    }
    if (t.subcategoria && !hideSubcat) out += '<span class="task-badge subcat">' + esc(t.subcategoria) + '</span>';
    if (t.subtareas && t.subtareas.length && !hideSubtasks) {
      var hechas = t.subtareas.filter(function(s) { return s.d; }).length;
      out += '<span class="task-badge subtasks">☑️ ' + hechas + '/' + t.subtareas.length + '</span>';
    }
    if (t.notas) out += '<span class="task-badge notas">' + esc(t.notas) + '</span>';
    return out;
  }

  // Checklist de subtareas dentro de la tarjeta de la pizarra — el check de
  // cada una viaja solo (toggleSubtaskSafe), sin tocar el resto de la tarea.
  function tarSubtareasHtml(t) {
    if (!t.subtareas || !t.subtareas.length) return '';
    var hechas = t.subtareas.filter(function(s) { return s.d; }).length;
    var rows = t.subtareas.map(function(s, i) {
      return '<div class="hsubtask-row' + (s.d ? ' done' : '') + '">' +
        '<span class="hsubtask-check' + (s.d ? ' on' : '') + '" data-subtog="' + t.row + ':' + i + '">' + (s.d ? '✓' : '') + '</span>' +
        '<span class="hsubtask-txt">' + esc(s.t) + '</span></div>';
    }).join('');
    return '<div class="task-subtasks"><div class="task-subtasks-head"><span>☑️ Subtareas</span>' +
      '<span class="n">' + hechas + '/' + t.subtareas.length + '</span></div>' + rows + '</div>';
  }

  // withCat: la tarjeta "Hoy" y "Completadas" mezclan categorías, así que
  // muestran un badge; en la pizarra la categoría ya la dice la columna.
  function tarRowHtml(t, withCat) {
    var catBadge = withCat ? '<span class="task-badge cat">' + esc(tarCatEmoji(t.categoria)) + ' ' + esc(t.categoria) + '</span>' : '';
    return '<div class="task-row' + (t.completada ? ' done' : '') + '">' +
      '<div class="task-check' + (t.completada ? ' on' : '') + '" data-check="' + t.row + '">' + (t.completada ? '✓' : '') + '</div>' +
      '<div class="task-body" data-open="' + t.row + '">' +
        '<div class="task-text">' + esc(t.texto) + '</div>' +
        '<div class="task-meta">' + catBadge + tarBadges(t) + '</div>' +
      '</div>' +
    '</div>';
  }

  // Una recurrente muestra "3 / 10 · semanal" + un botón +1 en vez de (además
  // de) depender solo del checkbox: no se "completa" una vez, se cuenta y se
  // reinicia sola (ver _tasksRows en el server).
  function tarCounterHtml(t) {
    if (!t.recurrente) return '';
    var cumplido = t.objetivo > 0 && t.contador >= t.objetivo;
    return '<div class="task-counter' + (cumplido ? ' cumplido' : '') + '">' +
      '<span class="task-counter-txt">' + (cumplido ? '🎉 ' : '🔁 ') + t.contador + ' / ' + t.objetivo +
        ' · ' + esc((t.periodo || '').toLowerCase()) + '</span>' +
      '<button type="button" class="task-counter-btn" data-bump="' + t.row + '">+1</button>' +
    '</div>';
  }

  function tarCardHtml(t, hideSubcat) {
    return '<div class="task-card' + (t.completada ? ' done' : '') + ' ' + tarCatSlug(t.categoria) + '">' +
      '<div class="task-check' + (t.completada ? ' on' : '') + '" data-check="' + t.row + '">' + (t.completada ? '✓' : '') + '</div>' +
      '<div class="task-body" data-open="' + t.row + '">' +
        '<div class="task-text">' + esc(t.texto) + '</div>' +
        '<div class="task-meta">' + tarBadges(t, hideSubcat, true) + '</div>' +
        tarCounterHtml(t) +
        tarSubtareasHtml(t) +
      '</div>' +
    '</div>';
  }

  // Sub-pizarra: si alguna pendiente de la categoría tiene subcategoría, la
  // columna se parte en grupos por subcategoría (orden: como van apareciendo,
  // "Sin subcategoría" siempre al final). Si ninguna tiene, se listan todas
  // juntas como siempre — no se agrega un grupo por nada.
  function tarColBodyHtml(items) {
    var conSub = items.some(function(t) { return t.subcategoria; });
    if (!conSub) return '<div class="task-col-body">' + items.map(function(t) { return tarCardHtml(t); }).join('') + '</div>';
    var orden = [], grupos = {};
    items.forEach(function(t) {
      var key = t.subcategoria || '';
      if (!grupos[key]) { grupos[key] = []; orden.push(key); }
      grupos[key].push(t);
    });
    // "Sin subcategoría" (clave vacía) siempre al final; entre las demás se
    // respeta el orden en que fueron apareciendo (sort de JS es estable).
    orden.sort(function(a, b) { return (a ? 0 : 1) - (b ? 0 : 1); });
    return orden.map(function(key) {
      var esSinSub = !key;
      return '<div class="task-subgroup' + (esSinSub ? ' sin' : '') + '">' +
        '<div class="task-subgroup-head"><span>' + (esSinSub ? 'Sin subcategoría' : esc(key)) + '</span>' +
          '<span class="n">' + grupos[key].length + '</span></div>' +
        '<div class="task-col-body">' + grupos[key].map(function(t) { return tarCardHtml(t, true); }).join('') + '</div>' +
      '</div>';
    }).join('');
  }

  function tarWireRows(cont) {
    if (!cont) return;
    var checks = cont.querySelectorAll('[data-check]');
    for (var i = 0; i < checks.length; i++) {
      (function(el) {
        el.addEventListener('click', function(ev) {
          ev.stopPropagation();
          tarToggle(parseInt(el.getAttribute('data-check'), 10));
        });
      })(checks[i]);
    }
    var bumps = cont.querySelectorAll('[data-bump]');
    for (var m = 0; m < bumps.length; m++) {
      (function(el) {
        el.addEventListener('click', function(ev) {
          ev.stopPropagation();
          tarBump(parseInt(el.getAttribute('data-bump'), 10));
        });
      })(bumps[m]);
    }
    var subtogs = cont.querySelectorAll('[data-subtog]');
    for (var s = 0; s < subtogs.length; s++) {
      (function(el) {
        el.addEventListener('click', function(ev) {
          ev.stopPropagation();
          var partes = el.getAttribute('data-subtog').split(':');
          tarToggleSubtask(parseInt(partes[0], 10), parseInt(partes[1], 10));
        });
      })(subtogs[s]);
    }
    var opens = cont.querySelectorAll('[data-open]');
    for (var j = 0; j < opens.length; j++) {
      (function(el) {
        el.addEventListener('click', function() { tarAbrirModal(parseInt(el.getAttribute('data-open'), 10)); });
      })(opens[j]);
    }
  }

  function tarBump(row) {
    var t = TAR.tareas.find(function(x) { return x.row === row; });
    if (!t) return;
    var prev = t.contador || 0;
    t.contador = prev + 1; // optimista: se ve al toque
    tarPintar();
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.ok) { tarStatus('✗ ' + ((r && r.error) || 'error'), 'err'); t.contador = prev; tarPintar(); return; }
        t.contador = r.contador;
        tarPintar();
      })
      .withFailureHandler(function(err) {
        tarStatus('✗ ' + (err && err.message ? err.message : err), 'err');
        t.contador = prev; tarPintar();
      })
      .bumpTaskSafe({ row: row, delta: 1 });
  }

  function tarPintar() {
    var hoy = TAR.hoy;
    var pendientes = TAR.tareas.filter(function(t) { return !t.completada; });
    var completadas = TAR.tareas.filter(function(t) { return t.completada; });

    // Tarjeta "Hoy": citas de hoy (por hora) + tareas que vencen hoy
    var citasHoy = pendientes.filter(function(t) { return t.tipo === 'Cita' && t.fecha === hoy; })
      .sort(function(a, b) { return (a.hora || '99:99').localeCompare(b.hora || '99:99'); });
    var tareasHoy = pendientes.filter(function(t) { return t.tipo === 'Tarea' && t.fecha === hoy; });
    var hoyCard = tarEl('tarHoyCard'), hoyList = tarEl('tarHoyList');
    if (hoyList) {
      if (!citasHoy.length && !tareasHoy.length) {
        hoyList.innerHTML = '<div class="task-empty">Nada para hoy 🎉</div>';
        if (hoyCard) hoyCard.classList.add('vacio');
      } else {
        if (hoyCard) hoyCard.classList.remove('vacio');
        hoyList.innerHTML = citasHoy.concat(tareasHoy).map(function(t) { return tarRowHtml(t, true); }).join('');
      }
    }
    if (tarEl('tarHoyFecha')) tarEl('tarHoyFecha').textContent = hoy ? tarDiaCorto(hoy) : '';

    // Pizarra: una sección por categoría, pero solo las que tienen algo
    // pendiente — una categoría vacía no aporta nada y solo agrega scroll.
    // Adentro de cada una, vencidas primero para que no se pierdan de vista.
    var board = tarEl('tarBoard');
    if (board) {
      var catsHtml = TAR.categorias.map(function(cat) {
        var items = pendientes.filter(function(t) { return t.categoria === cat; })
          .sort(function(a, b) {
            var av = !!(a.fecha && a.fecha < hoy), bv = !!(b.fecha && b.fecha < hoy);
            if (av !== bv) return av ? -1 : 1;
            var ak = a.fecha ? a.fecha + (a.hora || '') : '9999';
            var bk = b.fecha ? b.fecha + (b.hora || '') : '9999';
            return ak.localeCompare(bk);
          });
        if (!items.length) return '';
        return '<div class="task-col ' + tarCatSlug(cat) + '">' +
          '<div class="task-col-head"><span>' + esc(tarCatEmoji(cat)) + ' ' + esc(cat) + '</span>' +
            '<span class="n">' + items.length + '</span></div>' +
          tarColBodyHtml(items) +
        '</div>';
      }).join('');
      board.innerHTML = catsHtml || '<div class="task-empty">No tenés tareas pendientes</div>';
    }

    completadas.sort(function(a, b) { return (b.fechaCompletada || '').localeCompare(a.fechaCompletada || ''); });
    if (tarEl('tarListDone')) {
      tarEl('tarListDone').innerHTML = completadas.length
        ? completadas.map(function(t) { return tarRowHtml(t, true); }).join('')
        : '<div class="task-empty">Todavía no completaste nada</div>';
    }
    if (tarEl('tarDoneSummary')) tarEl('tarDoneSummary').textContent = '✓ Completadas (' + completadas.length + ')';

    tarWireRows(hoyList);
    tarWireRows(board);
    tarWireRows(tarEl('tarListDone'));
  }

  function tarToggle(row) {
    var t = TAR.tareas.find(function(x) { return x.row === row; });
    if (!t) return;
    var nuevo = !t.completada;
    t.completada = nuevo; // optimista: se ve al toque, sin esperar la vuelta del server
    tarPintar();
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.ok) { tarStatus('✗ ' + ((r && r.error) || 'error'), 'err'); t.completada = !nuevo; tarPintar(); }
      })
      .withFailureHandler(function(err) {
        tarStatus('✗ ' + (err && err.message ? err.message : err), 'err');
        t.completada = !nuevo; tarPintar();
      })
      .toggleTaskSafe({ row: row, completada: nuevo });
  }

  // Check de UNA subtarea puntual, adentro de la tarjeta de la pizarra — no
  // pasa por el modal de editar, mismo criterio optimista que tarToggle/tarBump.
  function tarToggleSubtask(row, index) {
    var t = TAR.tareas.find(function(x) { return x.row === row; });

  // === SUBCATEGORÍAS (gestión) =============================================

    }
    cont.innerHTML = lista.map(function(s) {

  // === AHORROS =============================================================
  // Los ahorros no son de un mes: se leen enteros de su propia hoja. Cada
  // movimiento es una compra o un deposito; las posiciones salen de agruparlos.
  var AHO = { tipo: 'Acción', movimientos: [], posiciones: [], editando: null,
              cargado: false, ultimo: 'precio', modal: { ultimo: 'precio' } };

  function ahoEl(id) { return document.getElementById(id); }

  function ahoStatus(txt, cls) {
    var el = ahoEl('ahoStatus');
    if (!el) return;
    el.className = cls || '';
    el.textContent = txt || '';
  }

  function ahoUsd(n) {
    var v = Math.round((Number(n) || 0) * 100) / 100;
    return 'US$ ' + v.toLocaleString('es-UY', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  // "+US$ 650 (+27,7%)" — el signo va siempre, para que se lea de un vistazo
  // si ganaste o perdiste sin tener que comparar contra lo invertido.
  function ahoGan(usd, pct) {
    var signo = usd < 0 ? '−' : '+';
    var txt = signo + ahoUsd(Math.abs(usd));
    if (pct != null) txt += ' (' + signo + String(Math.abs(pct)).replace('.', ',') + '%)';
    return txt;
  }

  function ahoUyu(n) {
    return '$ ' + Math.round(Number(n) || 0).toLocaleString('es-UY');
  }

  // El logo sale del dominio de la empresa. Si DuckDuckGo no lo tiene se prueba
  // Google, y si tampoco queda un badge con el ticker: la fila nunca se rompe
  // por un logo que no cargo.
  function ahoLogo(dominio, ticker, tipo) {
    var tk = String(ticker || '').slice(0, 4);
    if (!dominio) {
      var ico = tipo === 'Banco' ? '🏦' : (tipo === 'Bono' ? '📜' : (tk || '?'));
      return '<span class="aholg badge">' + esc(ico) + '</span>';
    }
    return '<img class="aholg" alt="" src="https://icons.duckduckgo.com/ip3/' + esc(dominio) + '.ico"' +
           ' data-goo="https://www.google.com/s2/favicons?domain=' + esc(dominio) + '&sz=64"' +
           ' data-tk="' + esc(tk) + '">';
  }

  // Engancha el fallback despues de pintar. Se hace con listeners y no con
  // onerror inline porque el codigo vive dentro de una IIFE.
  function ahoEngancharLogos(box) {
    var imgs = box.querySelectorAll('img.aholg');
    for (var i = 0; i < imgs.length; i++) {
      (function(img) {
        function falla() {
          if (img.getAttribute('data-paso') === '2') {
            var sp = document.createElement('span');
            sp.className = 'aholg badge';
            sp.textContent = img.getAttribute('data-tk') || '?';
            if (img.parentNode) img.parentNode.replaceChild(sp, img);
            return;
          }
          img.setAttribute('data-paso', '2');
          img.src = img.getAttribute('data-goo');
        }
        img.addEventListener('error', falla);
        // Si venia fallado del cache el evento ya paso y no se dispara solo
        if (img.complete && img.naturalWidth === 0) falla();
      })(imgs[i]);
    }
  }

  function ahoPintarTotales(t) {
    t = t || {};
    if (ahoEl('ahoTotalUsd')) ahoEl('ahoTotalUsd').textContent = ahoUsd(t.totalUsd);
    if (ahoEl('ahoTotalUyu')) ahoEl('ahoTotalUyu').textContent = ahoUyu(t.totalUyu);
    var gan = ahoEl('ahoGanancia');
    if (gan) {
      // Sin acciones cargadas no hay ganancia que mostrar, y un "+US$ 0" seco
      // confunde mas de lo que informa.
      if (!t.invertidoAcciones) { gan.hidden = true; }
      else {
        gan.hidden = false;
        gan.textContent = (t.gananciaUsd < 0 ? '▼ ' : '▲ ') + ahoGan(t.gananciaUsd, t.gananciaPct);
        gan.className = 'ahogan ' + (t.gananciaUsd < 0 ? 'baja' : 'sube');
      }
    }
    var com = ahoEl('ahoComisiones');
    if (com) {
      // Solo si hay algo que mostrar: un "US$ 0 de comisiones" es ruido.
      com.hidden = !t.comisionesUsd;
      if (t.comisionesUsd) {
        com.textContent = 'Incluye ' + ahoUsd(t.comisionesUsd) + ' pagados en comisiones';
      }
    }
    if (ahoEl('ahoAcciones')) ahoEl('ahoAcciones').textContent = ahoUsd(t.enAcciones);
    if (ahoEl('ahoBanco'))    ahoEl('ahoBanco').textContent    = ahoUsd(t.enBanco);
    if (ahoEl('ahoBonos'))    ahoEl('ahoBonos').textContent    = ahoUsd(t.enBonos);
    if (ahoEl('ahoCotiz')) {
      ahoEl('ahoCotiz').textContent = t.cotizacion ? ('US$ 1 = $ ' + Math.round(t.cotizacion * 100) / 100) : '';
    }
  }

  function ahoPintarPosiciones() {
    var box = ahoEl('ahoList');
    if (!box) return;
    if (!AHO.posiciones.length) {
      box.innerHTML = '<div style="color:#aaa;font-size:13px;padding:6px 2px">Todavía no cargaste ningún ahorro</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < AHO.posiciones.length; i++) {
      var p = AHO.posiciones[i];
      var sub = p.tipo === 'Acción'
        ? (p.cantidad + (p.cantidad === 1 ? ' acción' : ' acciones') +
           (p.precioHoy ? ' · ' + ahoUsd(p.precioHoy) : ''))
        : (p.tipo === 'Banco' ? 'Banco' : 'Bono');
      html += '<div class="ahorow">' +
        ahoLogo(p.dominio, p.ticker, p.tipo) +
        '<span class="ahonom"><b>' + esc(p.nombre) + '</b><span>' + esc(sub) + '</span></span>' +
        '<span class="ahoval"><b>' + ahoUsd(p.valorHoyUsd) + '</b>' +
        (p.sinPrecio
          ? '<span class="gan nada">sin precio</span>'
          : (p.tipo === 'Acción'
            ? '<span class="gan ' + (p.gananciaUsd < 0 ? 'baja' : 'sube') + '">' +
              ahoGan(p.gananciaUsd, p.gananciaPct) + '</span>'
            : '')) +
        '</span></div>';
    }
    box.innerHTML = html;
    ahoEngancharLogos(box);
  }

  function ahoPintarMovimientos() {
    var box = ahoEl('ahoMovs');
    if (!box) return;
    if (!AHO.movimientos.length) {
      box.innerHTML = '<div style="color:#aaa;font-size:13px;padding:6px 2px">Sin movimientos</div>';
      return;
    }
    var html = '';
    for (var i = AHO.movimientos.length - 1; i >= 0; i--) {
      var m = AHO.movimientos[i];
      var det = m.tipo === 'Acción'
        ? (m.ticker + ' · ' + m.cantidad + ' x ' + ahoUsd(m.precioUsd) +
           (m.comisionUsd ? ' + ' + ahoUsd(m.comisionUsd) + ' com.' : ''))
        : (m.entidad + (m.moneda === 'UYU' ? ' · $ ' + m.monto : ' · US$ ' + m.monto));
      html += '<div class="hmeal-row" data-row="' + m.row + '">' +
        '<span class="mt">' + esc((m.fecha || '').slice(5)) + '</span>' +
        '<span class="mn">' + esc(det) + '</span>' +
        '<span class="mm">' + ahoUsd(m.invertidoUsd) + '</span>' +
      '</div>';
    }
    box.innerHTML = html;
    var rows = box.querySelectorAll('.hmeal-row');
    for (var k = 0; k < rows.length; k++) {
      (function(el) {
        el.addEventListener('click', function() { ahoAbrirModal(parseInt(el.getAttribute('data-row'), 10)); });
      })(rows[k]);
    }
  }

  function ahoPintar(d) {
    AHO.movimientos = (d && d.movimientos) || [];
    AHO.posiciones = (d && d.posiciones) || [];
    ahoPintarTotales(d && d.totales);
    ahoPintarSaldo(d && d.saldo);
    ahoPintarPosiciones();
    ahoPintarMovimientos();
  }

  function ahoPintarSaldo(s) {
    var card = ahoEl('ahoSaldoCard');
    if (!card) return;
    if (!s || (s.uyu === null && s.usd === null)) { card.hidden = true; return; }
    card.hidden = false;
    var mesEl = ahoEl('ahoSaldoMes');
    if (mesEl) mesEl.textContent = s.mesActual || '';

    var rowUyu = ahoEl('ahoSaldoUyu');
    if (rowUyu) {

  // Cantidad, precio por accion y total gastado estan atados: con dos alcanza
  // para sacar el tercero. Se guarda cual fue el ultimo campo que toco el
  // usuario para recalcular el OTRO y no pisarle lo que acaba de escribir.
  function ahoNum(id) {
    var el = ahoEl(id);
    var n = parseFloat(String((el && el.value) || '').replace(',', '.'));
    return isFinite(n) && n > 0 ? n : null;
  }
  function ahoSet(id, n) {
    var el = ahoEl(id);
    if (!el) return;
    // Se redondea a centavos: 1680/12 tiene que quedar en 140, no en 139,999…
    el.value = String(Math.round(n * 100) / 100).replace('.', ',');
  }

  // ids = { cantidad, precio, comision, gastado, hint }. Los cuatro campos estan
  // atados por la identidad que tiene que cerrar siempre:
  //     cantidad x precio + comision = total gastado
  // Se recuerda si el usuario venia cargando por precio o por total, para
  // recalcular el otro y no pisarle lo que acaba de escribir.
  // El mismo vinculo lo usan el alta y el modal: una sola regla.
  function ahoVincular(ids, estado) {
    function recalcular(cambio) {
      if (cambio === 'precio' || cambio === 'gastado') estado.ultimo = cambio;
      var c = ahoNum(ids.cantidad), p = ahoNum(ids.precio), g = ahoNum(ids.gastado);
      var f = ahoNum(ids.comision) || 0;

      function desdePrecio() { if (c && p) { g = c * p + f; ahoSet(ids.gastado, g); } }
      function desdeGastado() {
        if (c && g && g - f > 0) { p = (g - f) / c; ahoSet(ids.precio, p); }
      }

      if (cambio === 'precio') desdePrecio();
      else if (cambio === 'gastado') desdeGastado();
      else if (estado.ultimo === 'gastado') desdeGastado();
      else desdePrecio();

      var box = ids.hint && ahoEl(ids.hint);
      if (box) {
        // Se muestra la cuenta abierta, no solo el resultado: asi se ve de una
        // cuanto es de acciones y cuanto se lo lleva el broker.
        box.textContent = (c && p)
          ? (ahoUsd(c * p) + ' en acciones' + (f ? ' + ' + ahoUsd(f) + ' de comisión' : '') +
             ' = ' + ahoUsd(c * p + f))
          : '';
      }
    }
    ['cantidad', 'precio', 'comision', 'gastado'].forEach(function(campo) {
      var el = ahoEl(ids[campo]);
      if (el) el.addEventListener('input', function() { recalcular(campo); });
    });
    return recalcular;
  }

  var ahoCalcular = ahoVincular({ cantidad: 'ahoCantidad', precio: 'ahoPrecio',

  ahoVincular({ cantidad: 'amCantidad', precio: 'amPrecio', comision: 'amComision',

  // === Dashboard ===
  function fmt(n, cur) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    try {
      if (!cur) {
        return new Intl.NumberFormat('es-UY', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
      }
      // UYU: sin decimales (montos enteros). USD/ARS: 2 decimales.
      var maxFrac = cur === 'UYU' ? 0 : 2;
      return new Intl.NumberFormat('es-UY', {
        style: 'currency',
        currency: cur,
        currencyDisplay: 'symbol',
        minimumFractionDigits: 0,
        maximumFractionDigits: maxFrac
      }).format(n);
    } catch(e) {
      var sym = cur === 'USD' ? 'US$ ' : '$ ';
      return sym + n.toFixed(cur === 'UYU' ? 0 : 2);
    }
  }

  function renderDashboard(data) {
    dashLoadedOnce = true;
    var content = document.getElementById('dashContent');
    if (!data || !data.ok) {
      content.className = 'dash-loader';
      content.textContent = '✗ ' + ((data && data.error) || 'Error desconocido');
      return;
    }
    document.getElementById('dashTitle').textContent = data.tab;
    content.className = '';
    var t = data.totals || {};
    var html = '';

    // KPIs
    html += '<div class="dash-section"><div class="dash-kpis">';
    html += '<div class="dash-kpi big"><div class="dash-kpi-label">Total UYU+USD en UYU</div><div class="dash-kpi-val">' + fmt(t.uyuInUyu, 'UYU') + '</div><div class="dash-kpi-sub">cot. ' + fmt(data.cotizacion) + '</div></div>';
    html += '<div class="dash-kpi"><div class="dash-kpi-label">Total UYU</div><div class="dash-kpi-val">' + fmt(t.uyu, 'UYU') + '</div></div>';
    html += '<div class="dash-kpi"><div class="dash-kpi-label">Total USD</div><div class="dash-kpi-val">' + fmt(t.usd, 'USD') + '</div></div>';
    html += '<div class="dash-kpi"><div class="dash-kpi-label">Fijos UYU</div><div class="dash-kpi-val">' + fmt(t.fixedUyu, 'UYU') + '</div></div>';
    html += '<div class="dash-kpi"><div class="dash-kpi-label">Variable UYU</div><div class="dash-kpi-val">' + fmt(t.varUyu, 'UYU') + '</div><div class="dash-kpi-sub">' + (data.variableCount || 0) + ' gastos</div></div>';
    // Top categoría KPI
    if (data.byCategory && data.byCategory.length) {
      var topCat = data.byCategory.filter(function(c){ return (c.uyu||0) > 0; })[0];
      if (topCat) {
        html += '<div class="dash-kpi big" style="background:#fef3c7;border-color:#fde68a"><div class="dash-kpi-label">🥇 Top categoría</div><div class="dash-kpi-val" style="color:#92400e">' + topCat.name + '</div><div class="dash-kpi-sub">' + fmt(topCat.uyu, 'UYU') + '</div></div>';
      }
    }
    html += '</div></div>';

    // Por categoría con barras + ranking
    if (data.byCategory && data.byCategory.length) {
      var maxCat = data.byCategory.reduce(function(m, x){ return Math.max(m, x.uyu || 0); }, 0);
      var totalCatUyu = data.byCategory.reduce(function(s, x){ return s + (x.uyu || 0); }, 0);
      html += '<div class="dash-section"><h2>Por categoría (UYU)</h2><div class="dash-list">';
      var rank = 0;
      for (var i = 0; i < data.byCategory.length; i++) {
        var c = data.byCategory[i];
        if (!c.uyu && !c.usd) continue;
        rank++;
        var pct = maxCat > 0 ? (c.uyu / maxCat * 100) : 0;
        var pctTot = totalCatUyu > 0 ? (c.uyu / totalCatUyu * 100) : 0;
        var medal = rank === 1 ? '🥇 ' : (rank === 2 ? '🥈 ' : (rank === 3 ? '🥉 ' : ''));
        var rowStyle = rank === 1 ? ' style="background:#fefce8"' : '';
        var barColor = rank === 1 ? '#f59e0b' : '#0f766e';
        html += '<div class="dash-list-row"' + rowStyle + '>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="name">' + medal + c.name + '</div>' +
            '<div class="dash-bar"><div style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
          '</div>' +
          '<div class="val" style="text-align:right">' + fmt(c.uyu, 'UYU') +
            '<div class="sub" style="font-weight:400">' + pctTot.toFixed(0) + '%</div>' +
          '</div>' +
        '</div>';
      }
      html += '</div></div>';
    }

    // Por medio de pago
    if (data.byCard && data.byCard.length) {
      html += '<div class="dash-section"><h2>Por medio de pago</h2><div class="dash-list">';
      for (var k = 0; k < data.byCard.length; k++) {
        var card = data.byCard[k];
        if (!card.amount) continue;
        html += '<div class="dash-list-row"><span class="name">' + card.name + '</span><span class="val">' + fmt(card.amount, card.currency) + '</span></div>';
      }
      html += '</div></div>';
    }

    // Últimos gastos
    if (data.recent && data.recent.length) {
      html += '<div class="dash-section"><h2>Últimos gastos</h2><div class="dash-list">';
      for (var r = 0; r < data.recent.length; r++) {
        var e = data.recent[r];
        html += '<div class="dash-list-row"><div style="flex:1;min-width:0"><div class="name">' + e.item + '</div><div class="sub">' + (e.card || '') + (e.category ? ' · ' + e.category : '') + '</div></div><div class="val">' + fmt(e.amount, e.currency) + '</div></div>';
      }
      html += '</div></div>';
    }

    content.innerHTML = html;
  }
