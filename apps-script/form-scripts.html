  var habitLoadedOnce = false;
  var AGUA_STEP = 250, AGUA_META = 2400;

  // Estado local del dia que se esta editando. Los campos y el agua viven como
  // borrador local hasta tocar "Guardar dia". Las comidas siguen siendo un log
  // aparte y se guardan desde su propio boton.
  var H = {
    date: '', meals: [], waters: [], serverWaters: [], ejers: [], serverEjers: [],
    saved: {}, dirty: false, editingRow: null, editingWater: null, editingEjer: null,
    waterSeq: 0, ejerSeq: 0, loadSeq: 0, draftStorageFailed: false
  };
  var HABIT_DRAFT_PREFIX = 'gastos-tracker.habitos.borrador.v1.';

  function hEl(id) { return document.getElementById(id); }

  function habStatus(text, cls) {
    var el = hEl('habStatus');
    if (!el) return;
    el.className = cls || '';
    el.textContent = text || '';
    var ov = hEl('loadingOverlay');
    if (ov) {
      if (cls === 'loading') {
        var t = hEl('loadingText'); if (t) t.textContent = text || 'Guardando...';
        ov.classList.add('show');
      } else { ov.classList.remove('show'); }
    }
  }

  function nowHM() {
    var d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtMl(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  function waterLabel(ml) {
    var n = Number(ml) || 0;
    if (n <= 150) return 'Sorbo';
    if (n <= 220) return 'Taza';
    if (n <= 300) return 'Vaso';
    if (n <= 420) return 'Vaso grande';
    if (n <= 600) return 'Media botella';
    if (n <= 880) return 'Botella';
    if (n <= 1200) return 'Botella 1L';
    return 'Botella grande';
  }

  function nextWaterId() {
    H.waterSeq += 1;
    return 'draft-' + Date.now() + '-' + H.waterSeq;
  }

  function normalizeWaters(list) {
    var out = [];
    list = Array.isArray(list) ? list : [];
    for (var i = 0; i < list.length; i++) {
      var src = list[i] || {};
      var ml = parseInt(String(src.ml == null ? '' : src.ml).replace(/\D/g, ''), 10);
      if (!isFinite(ml) || ml <= 0) continue;
      var row = parseInt(src.row, 10);
      if (!isFinite(row) || row <= 0) row = null;
      out.push({
        id: String(src.id || (row ? 'row-' + row : nextWaterId())),
        row: row,
        hora: String(src.hora || ''),
        tipo: String(src.tipo || waterLabel(ml)),
        ml: ml
      });
    }
    return out;
  }

  function waterSignature(list) {
    return normalizeWaters(list).map(function(w) {
      return [w.row || '', w.hora, w.tipo, w.ml].join('|');
    }).join('||');
  }

  function watersChanged() {
    return waterSignature(H.waters) !== waterSignature(H.serverWaters);
  }

  function waterIsPending(w) {
    if (!w || !w.row) return true;
    for (var i = 0; i < H.serverWaters.length; i++) {
      var s = H.serverWaters[i];
      if (s.row === w.row) return s.hora !== w.hora || s.tipo !== w.tipo || s.ml !== w.ml;
    }
    return true;
  }

  // ---------- Ejercicio: misma mecanica que el agua ----------
  // Cada sesion es una entrada propia con su tipo y sus minutos. Se editan en
  // el borrador local y recien al guardar el dia se reemplaza la foto completa
  // en la hoja, igual que las tomas de agua.
  function nextEjerId() {
    H.ejerSeq += 1;
    return 'ejer-' + Date.now() + '-' + H.ejerSeq;
  }

  function normalizeEjers(list) {
    var out = [];
    list = Array.isArray(list) ? list : [];
    for (var i = 0; i < list.length; i++) {
      var src = list[i] || {};
      var tipo = String(src.tipo || '').trim();
      if (!tipo) continue;
      var min = parseInt(String(src.min == null ? '' : src.min).replace(/\D/g, ''), 10);
      if (!isFinite(min) || min < 0) min = 0;
      var row = parseInt(src.row, 10);
      if (!isFinite(row) || row <= 0) row = null;
      out.push({
        id: String(src.id || (row ? 'row-' + row : nextEjerId())),
        row: row,
        hora: String(src.hora || ''),
        tipo: tipo,
        min: min
      });
    }
    return out;
  }

  function ejerKey(e) { return [e.row || '', e.hora, e.tipo, e.min].join('|'); }

  function ejerSignature(list) {
    return normalizeEjers(list).map(ejerKey).join('||');
  }

  function ejersChanged() {
    return ejerSignature(H.ejers) !== ejerSignature(H.serverEjers);
  }

  // Pendiente = no hay una entrada identica del lado del servidor. Se compara
  // por contenido y no por fila porque los dias viejos llegan sin fila: el
  // ejercicio vivia solo en la fila diaria y todavia no tiene log propio.
  function ejerIsPending(e) {
    var k = ejerKey(e);
    for (var i = 0; i < H.serverEjers.length; i++) {
      if (ejerKey(H.serverEjers[i]) === k) return false;
    }
    return true;
  }

  function collectDayDraft() {
    var val = function(id) { var el = hEl(id); return el ? String(el.value || '') : ''; };
    return {
      levante: getWheel('levTime'), acoste: getWheel('acoTime'),
      trabajo: val('habTrabajo').trim(), animo: val('habAnimo'),
      medite: H.medite || '', mediteMin: val('mediteMin').trim(), lei: H.lei || '',
      mast: val('mastInput'), abordajes: val('abordInput'), notas: val('habNotas')
    };
  }

  function draftKey(dateStr) { return HABIT_DRAFT_PREFIX + dateStr; }

  function readDraft(dateStr) {
    if (!dateStr) return null;
    try {
      var raw = window.localStorage.getItem(draftKey(dateStr));
      if (!raw) return null;
      var d = JSON.parse(raw);
      return d && d.date === dateStr && d.day ? d : null;
    } catch (e) {
      H.draftStorageFailed = true;
      return null;
    }
  }

  function persistDraft() {
    if (!habitLoadedOnce || !H.date || !H.dirty) return false;
    try {
      window.localStorage.setItem(draftKey(H.date), JSON.stringify({
        version: 1, date: H.date, updatedAt: Date.now(),
        day: collectDayDraft(), waters: normalizeWaters(H.waters),
        ejers: normalizeEjers(H.ejers), serverEjers: normalizeEjers(H.serverEjers),
        saved: H.saved || {}, serverWaters: normalizeWaters(H.serverWaters)
      }));
      H.draftStorageFailed = false;
      return true;
    } catch (e) {
      H.draftStorageFailed = true;
      return false;
    }
  }

  function removeDraft(dateStr) {
    if (!dateStr) return;
    try { window.localStorage.removeItem(draftKey(dateStr)); }
    catch (e) { H.draftStorageFailed = true; }
  }

  function showDirty(restored) {
    var f = hEl('dirtyFlag');
    if (!f) return;
    f.classList.add('show');
    if (H.draftStorageFailed) {
      f.textContent = 'Cambios sin guardar · este navegador no pudo conservar el borrador';
    } else if (restored) {
      f.textContent = 'Borrador recuperado · tocá Guardar día para confirmar';
    } else {
      f.textContent = 'Borrador local · tocá Guardar día para confirmar';
    }
  }

  function markDirty(message) {
    H.dirty = true;
    persistDraft();
    showDirty(false);
    if (typeof message === 'string' && message) habStatus(message, 'draft');
  }
  function clearDirty(removeLocal) {
    H.dirty = false;
    var f = hEl('dirtyFlag'); if (f) f.classList.remove('show');
    if (removeLocal) removeDraft(H.date);
  }

  // ---------- Hora de acostarse / levantarse ----------
  // input type="time" nativo: en el celular abre el selector propio del
  // sistema (rueda/reloj), mucho mas rapido que elegir hora y minuto en dos
  // combos separados de 24 y 12 opciones.
  function getWheel(id) {
    var el = hEl(id);
    return (el && el.value) || '';
  }
  function setWheel(id, hm) {
    var el = hEl(id);
    if (!el) return;
    el.value = hm || '';
  }

  // ---------- Carga de un dia ----------
  function loadDay(dateStr) {
    var d = dateStr || todayISO();
    var loadSeq = ++H.loadSeq;
    // Pintar primero el borrador permite seguir viendo lo escrito aun si justo
    // no hay red al reabrir la app. La respuesta del servidor completa despues
    // la linea base necesaria para confirmar borrados correctamente.
    var earlyDraft = readDraft(d);
    if (earlyDraft) {
      habitLoadedOnce = true;
      H.date = d;
      H.meals = [];
      H.saved = earlyDraft.saved || {};
      H.serverWaters = normalizeWaters(earlyDraft.serverWaters || []);
      H.waters = normalizeWaters(earlyDraft.waters || []);
      H.serverEjers = normalizeEjers(earlyDraft.serverEjers || []);
      H.ejers = normalizeEjers(earlyDraft.ejers || []);
      if (hEl('dayPicker')) hEl('dayPicker').value = H.date;
      paintDay(earlyDraft.day);
      renderMeals();
      renderWaters();
      renderEjers();
      pintarEstadoDia();
      H.dirty = true;
      showDirty(true);
    }
    habStatus('Cargando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (loadSeq !== H.loadSeq) return;
        habStatus('', '');
        habitLoadedOnce = true;
        if (!r || !r.ok) { habStatus('✗ ' + ((r && r.error) || 'error'), 'err'); return; }
        H.date = r.date || d;
        H.meals = r.meals || [];
        H.serverWaters = normalizeWaters(r.waters || []);
        H.waters = normalizeWaters(H.serverWaters);
        H.serverEjers = normalizeEjers(r.ejercicios || []);
        H.ejers = normalizeEjers(H.serverEjers);
        H.saved = r.day || {};
        if (hEl('dayPicker')) hEl('dayPicker').value = H.date;
        var draft = readDraft(H.date);
        if (draft) {
          paintDay(draft.day || H.saved);
          H.waters = normalizeWaters(draft.waters || H.serverWaters);
          H.ejers = normalizeEjers(draft.ejers || H.serverEjers);
          H.dirty = true;
          showDirty(true);
          habStatus('Borrador recuperado en este dispositivo', 'draft');
        } else {
          paintDay(H.saved);
          clearDirty(false);
        }
        renderMeals();
        renderWaters();
        renderEjers();
        pintarEstadoDia();
      })
      .withFailureHandler(function(err) {
        if (loadSeq !== H.loadSeq) return;
        habStatus('✗ ' + (err && err.message ? err.message : err), 'err');
      })
      .getHabitDaySafe(d);
  }

  // Muestra si el día elegido ya tiene datos guardados
  function pintarEstadoDia() {
    var el = hEl('dayStatus');
    if (!el) return;
    var s = H.saved || {};
    var n = 0;
    // El ejercicio no entra aca: vive en el log y se cuenta como registro,
    // igual que las comidas y el agua. Sumarlo tambien como campo de la fila
    // diaria (donde queda el resumen calculado) lo contaria dos veces.
    ['levante','acoste','trabajo','animo',
     'medite','mediteMin','lei','abordajes','notas'].forEach(function(k) {
      if (s[k] !== undefined && s[k] !== null && s[k] !== '') n++;
    });
    var extras = (H.meals || []).length + (H.serverWaters || []).length +
                 (H.serverEjers || []).length;
    if (n || extras) {
      el.textContent = 'guardado · ' + n + ' campo' + (n === 1 ? '' : 's') +
                       (extras ? ' · ' + extras + ' registro' + (extras === 1 ? '' : 's') : '');
      el.className = 'hdaystatus con';
    } else {
      el.textContent = 'sin datos todavía';
      el.className = 'hdaystatus sin';
    }
  }

  function paintDay(d) {
    d = d || {};
    setWheel('levTime', d.levante || '');
    setWheel('acoTime', d.acoste || '');
    pintarSueno();
    if (hEl('habTrabajo')) hEl('habTrabajo').value = d.trabajo != null ? String(d.trabajo).replace('.', ',') : '';
    if (hEl('habNotas'))   hEl('habNotas').value   = d.notas || '';
    // ejerText/ejerMin no se pintan: no son el dato guardado sino la fila
    // para cargar la proxima sesion, y la lista de abajo es la que manda.
    if (hEl('mediteMin'))  hEl('mediteMin').value  = d.mediteMin != null ? String(d.mediteMin) : '';
    setSiNo('medite', d.medite || '');
    setSiNo('lei',    d.lei || '');
    setMood(d.animo);
    if (hEl('mastInput'))  hEl('mastInput').value  = d.mast != null ? d.mast : 0;
    if (hEl('abordInput')) hEl('abordInput').value = d.abordajes != null ? d.abordajes : 0;
    if (hEl('aguaHora') && !hEl('aguaHora').value) hEl('aguaHora').value = nowHM();
    if (hEl('mealHora') && !hEl('mealHora').value) hEl('mealHora').value = nowHM();
  }

  // Calcula y muestra las horas dormidas con los dos valores de la fila.
  // Como acostarse y levantarse describen la MISMA noche, si la hora de
  // acostarse es mayor que la de levantarse es que se cruzó la medianoche, y
  // por lo tanto fue el día anterior. Se muestra la fecha para que no quede
  // ninguna duda de a qué noche corresponde.
  function pintarSueno() {
    var aco = getWheel('acoTime');
    var lev = getWheel('levTime');
    var out = hEl('hsSueno'), sub = hEl('acosteDia');

    if (!aco || !lev) {
      if (out) out.textContent = '';
      if (sub) sub.textContent = '';
      return;
    }
    function mins(hm) { var p = hm.split(':'); return parseInt(p[0],10)*60 + parseInt(p[1],10); }
    var m = mins(lev) - mins(aco);
    var prevDia = m < 0;
    if (m < 0) m += 1440;
    var hs = Math.round(m / 60 * 100) / 100;

    if (sub) {
      if (!H.date) { sub.textContent = prevDia ? 'el día anterior' : 'ya pasada la medianoche'; }
      else {
        var pp = H.date.split('-');
        var dd = new Date(parseInt(pp[0],10), parseInt(pp[1],10)-1, parseInt(pp[2],10));
        if (prevDia) dd.setDate(dd.getDate() - 1);
        sub.textContent = String(dd.getDate()).padStart(2,'0') + '/' + String(dd.getMonth()+1).padStart(2,'0');
      }
    }
    if (out) out.textContent = hs ? ('😴 ' + String(hs).replace('.', ',') + ' hs dormidas') : '';
  }

  // Sí/No: el valor vive en H (no en un input) porque son botones. Tocar el que
  // ya está activo lo apaga, así se puede dejar el día sin contestar.
  function setSiNo(campo, val) {
    H[campo] = val || '';
    var bs = document.querySelectorAll('.hsino[data-campo="' + campo + '"]');
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('activo', bs[i].getAttribute('data-val') === H[campo]);
    }
  }
  (function() {
    var bs = document.querySelectorAll('.hsino');
    for (var i = 0; i < bs.length; i++) {
      (function(b) {
        b.addEventListener('click', function() {
          var campo = b.getAttribute('data-campo'), val = b.getAttribute('data-val');
          setSiNo(campo, H[campo] === val ? '' : val);
          markDirty();
        });
      })(bs[i]);
    }
  })();

  // ---------- Navegacion de dias ----------
  function shiftDay(delta) {
    var base = (hEl('dayPicker') && hEl('dayPicker').value) || todayISO();
    var parts = base.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    d.setDate(d.getDate() + delta);
    var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    goToDay(iso);
  }
  function goToDay(iso) {
    // Cada fecha tiene su propio borrador. Cambiar de día nunca confirma datos
    // en la hoja ni descarta lo escrito: se persiste localmente y se recupera
    // al volver a esa fecha.
    if (H.dirty) persistDraft();
    loadDay(iso);
  }
  if (hEl('dayPrev'))  hEl('dayPrev').addEventListener('click', function() { shiftDay(-1); });
  if (hEl('dayNext'))  hEl('dayNext').addEventListener('click', function() { shiftDay(1); });
  if (hEl('dayToday')) hEl('dayToday').addEventListener('click', function() { goToDay(todayISO()); });
  if (hEl('dayPicker')) hEl('dayPicker').addEventListener('change', function() { goToDay(hEl('dayPicker').value); });

  // ---------- Marcar cambios ----------
  ['levTime','acoTime','habTrabajo','habAnimo','habNotas',
   'mediteMin','mastInput','abordInput'].forEach(function(id) {
    var el = hEl(id);
    if (!el) return;
    el.addEventListener('change', markDirty);
    el.addEventListener('input', markDirty);
  });

  // La hora de acostarse/levantarse recalcula el sueño en vivo, sin esperar al guardado
  ['levTime','acoTime'].forEach(function(id) {
    var el = hEl(id);
    if (el) el.addEventListener('change', pintarSueno);
  });

  // "ahora" solo completa el campo y persiste la previsualizacion local.
  if (hEl('btnLevante')) hEl('btnLevante').addEventListener('click', function() {
    setWheel('levTime', nowHM());
    markDirty('Hora agregada al borrador · guardá el día para confirmarla');
    pintarSueno();
  });
  if (hEl('btnAcoste')) hEl('btnAcoste').addEventListener('click', function() {
    setWheel('acoTime', nowHM());
    markDirty('Hora agregada al borrador · guardá el día para confirmarla');
    pintarSueno();
  });

  // ---------- Animo ----------
  function setMood(val) {
    var input = hEl('habAnimo');
    var n = parseInt(val, 10);
    if (!isFinite(n) || n < 1 || n > 5) n = 0;
    if (input) input.value = String(n);
    var labels = ['', 'muy bajo', 'bajo', 'normal', 'bueno', 'muy bueno'];
    var badge = hEl('animoVal');
    if (badge) badge.textContent = n ? (n + ' · ' + labels[n]) : '—';
    var buttons = document.querySelectorAll('#animoRating button');
    for (var i = 0; i < buttons.length; i++) {
      var active = parseInt(buttons[i].getAttribute('data-value'), 10) === n;
      buttons[i].classList.toggle('activo', active);
      buttons[i].setAttribute('aria-pressed', active ? 'true' : 'false');
    }
  }

  (function() {
    var buttons = document.querySelectorAll('#animoRating button');
    for (var i = 0; i < buttons.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          setMood(parseInt(btn.getAttribute('data-value'), 10));
          markDirty();
        });
      })(buttons[i]);
    }
    if (hEl('clearAnimo')) hEl('clearAnimo').addEventListener('click', function() {
      setMood(0);
      markDirty();
    });
  })();

  // ---------- Numericos con +/- (solo cambian el campo en pantalla) ----------
  function bumpField(inputId, delta, after) {
    var el = hEl(inputId);
    if (!el) return;
    var v = parseInt(String(el.value).replace(/\D/g, ''), 10);
    if (!isFinite(v)) v = 0;
    v += delta;
    if (v < 0) v = 0;
    el.value = v;
    markDirty();
    if (after) after();
  }
  if (hEl('mastPlus'))  hEl('mastPlus').addEventListener('click',  function() { bumpField('mastInput',  1); });
  if (hEl('mastMinus')) hEl('mastMinus').addEventListener('click', function() { bumpField('mastInput', -1); });
  if (hEl('abordPlus'))  hEl('abordPlus').addEventListener('click',  function() { bumpField('abordInput',  1); });
  if (hEl('abordMinus')) hEl('abordMinus').addEventListener('click', function() { bumpField('abordInput', -1); });

  // ---------- Foto de comida (Gemini Vision) ----------
  if (hEl('btnScanMeal')) hEl('btnScanMeal').addEventListener('click', function() {
    if (hEl('mealPhoto')) hEl('mealPhoto').click();
  });

  if (hEl('mealPhoto')) hEl('mealPhoto').addEventListener('change', function(ev) {
    var file = ev.target.files[0];
    if (!file) return;
    habStatus('Procesando foto...', 'loading');
    var reader = new FileReader();
    reader.onload = function(e) {
      // Reusa el resize del scan de tickets: menos peso, misma calidad util
      resizeImage(e.target.result, 1280, function(dataUrl) {
        var b64 = dataUrl.split(',')[1];
        habStatus('Analizando la comida con AI...', 'loading');
        var hora = (hEl('mealHora') && hEl('mealHora').value) || nowHM();
        google.script.run
          .withSuccessHandler(onMealScan)
          .withFailureHandler(function(err) {
            habStatus('✗ ' + (err && err.message ? err.message : err), 'err');
          })
          .scanMealSafe(b64, hora);
      });
    };
    reader.readAsDataURL(file);
    ev.target.value = '';   // permite volver a elegir la misma foto
  });

  function onMealScan(r) {
    if (!r || !r.ok) { habStatus('✗ ' + ((r && r.error) || 'error al analizar'), 'err'); return; }
    habStatus('', '');
    if (hEl('scNombre')) hEl('scNombre').value = r.nombre || '';
    if (hEl('scIngr'))   hEl('scIngr').value   = r.ingredientes || '';
    if (hEl('scMacro'))  hEl('scMacro').value  = r.macro || '';
    if (hEl('scKcal'))   hEl('scKcal').value   = r.kcal || '';
    if (hEl('scProc'))   hEl('scProc').value   = r.procesado || 'Medio';
    if (hEl('scHora'))   hEl('scHora').value   = r.hora || nowHM();
    var conf = hEl('scanConf');
    if (conf) {
      var c = String(r.confianza || 'Media');
      conf.textContent = 'confianza ' + c.toLowerCase();
      conf.className = 'hscan-conf ' + c.toLowerCase();
    }
    if (hEl('mealScanBox')) hEl('mealScanBox').classList.add('show');
  }

  function closeScanBox() {
    if (hEl('mealScanBox')) hEl('mealScanBox').classList.remove('show');
  }
  if (hEl('scCancel')) hEl('scCancel').addEventListener('click', function() {
    closeScanBox(); habStatus('Descartado', 'ok');
  });

  if (hEl('scSave')) hEl('scSave').addEventListener('click', function() {
    var nombre = (hEl('scNombre') && hEl('scNombre').value.trim()) || '';
    if (!nombre) { habStatus('Poné un nombre al plato', 'err'); return; }
    habStatus('Guardando comida...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) {
          closeScanBox();
          var w = r.written || {};
          habStatus('✓ ' + nombre + ' — ' + (w.macro || '') + (w.kcal ? ' · ' + w.kcal + ' kcal' : ''), 'ok');
          reloadLog();
        } else { habStatus('✗ ' + ((r && r.error) || 'error'), 'err'); }
      })
      .withFailureHandler(function(err) { habStatus('✗ ' + (err && err.message ? err.message : err), 'err'); })
      .addMealSafe({
        date: H.date,
        comida: nombre,
        hora: (hEl('scHora') && hEl('scHora').value) || nowHM(),
        macro: (hEl('scMacro') && hEl('scMacro').value.trim()) || '',
        procesado: (hEl('scProc') && hEl('scProc').value) || '',

  // ---------- Guardar el dia ----------
  // Este es el unico punto que confirma el borrador contra la hoja.
  // opts: { then: callback al terminar }
  function saveDay(opts) {
    opts = opts || {};
    if (!H.dirty) {
      habStatus('No hay cambios en el borrador', 'draft');
      if (opts.then) opts.then(false);
      return;
    }
    var payload = { date: H.date };
    var campos = [];

    // Lo que se guarda es exactamente lo que se ve en el form. Un campo con
    // valor se manda; uno vacío que ANTES tenía algo se manda en 'clear'
    // para que se borre de la hoja. Sin esto no habría forma de corregir un
    // dato mal cargado.
    var borrar = [];
    var prev = H.saved || {};
    function poner(campo, valor, etiqueta) {
      var teniaAntes = prev[campo] !== undefined && prev[campo] !== null && prev[campo] !== '';
      if (valor !== '' && valor !== null && valor !== undefined) {
        payload[campo] = valor;
        campos.push(etiqueta);
      } else if (teniaAntes) {
        borrar.push(campo);
        campos.push(etiqueta + ' (borrado)');
      }
    }

    poner('levante', getWheel('levTime'), 'levanté');
    poner('acoste',  getWheel('acoTime'), 'acosté');

    var tr = hEl('habTrabajo');
    var trabajo = tr ? normDec(tr.value.trim()) : '';
    if (trabajo !== '') {
      var trabajoNum = Number(trabajo);
      if (!isFinite(trabajoNum) || trabajoNum < 0 || trabajoNum > 24) {
        habStatus('Las horas de trabajo tienen que estar entre 0 y 24', 'err');
        if (tr) tr.focus();
        if (opts.then) opts.then(false);
        return;
      }
      trabajo = String(trabajoNum);
    }
    poner('trabajo', trabajo, 'trabajo');
    var an = hEl('habAnimo');
    poner('animo', (an && an.value !== '0') ? an.value : '', 'ánimo');
    poner('medite', H.medite || '', 'meditación');
    var mm = hEl('mediteMin');
    poner('mediteMin', mm ? normDec(mm.value.trim()) : '', 'min medit.');
    poner('lei', H.lei || '', 'lectura');
    var nt = hEl('habNotas');
    poner('notas', nt ? nt.value.trim() : '', 'notas');

    // El agua se manda como la foto completa de la previsualizacion. El servidor
    // reemplaza solamente las tomas de esta fecha; las comidas no se tocan.
    var waterDraft = watersChanged();
    if (waterDraft) {
      payload.waters = H.waters.map(function(w) {
        return { hora: w.hora, tipo: w.tipo, ml: w.ml };
      });
      campos.push('agua');
    }

    // Si quedo algo escrito en la fila de carga y nunca se toco el "+", se
    // agrega igual: perder el ejercicio recien tipeado por no haber apretado un
    // boton seria justo el problema que este cambio viene a arreglar.
    var tipoPend = ejerTipoElegido().trim();
    if (tipoPend) {
      var emPend = hEl('ejerMin');
      addEjer(tipoPend, parseInt(String(emPend ? emPend.value : '').replace(/\D/g, ''), 10));
    }

    // El ejercicio viaja igual: la foto completa del dia. El servidor reescribe
    // sus filas del log y recalcula el resumen (texto + minutos) de la fila
    // diaria, que es lo que sigue leyendo el analisis del mes.
    var ejerDraft = ejersChanged();
    if (ejerDraft) {
      payload.ejercicios = H.ejers.map(function(e) {
        return { hora: e.hora, tipo: e.tipo, min: e.min };
      });
      campos.push('ejercicio');
    }

    // El contador pasa por poner() como el resto: antes se mandaba SIEMPRE, así
    // que un autoguardado con H.saved a medio cargar escribía 0 encima del
    // valor real, y además 'campos' nunca quedaba vacío.
    var ms = hEl('mastInput');
    var msv = ms ? parseInt(String(ms.value).replace(/\D/g,''), 10) : NaN;
    if (isFinite(msv) && msv > 0) poner('mast', msv, 'contador');
    else if ((Number(prev.mast) || 0) > 0) poner('mast', '', 'contador');
    var ab = hEl('abordInput');
    var abv = ab ? parseInt(String(ab.value).replace(/\D/g,''), 10) : NaN;
    if (isFinite(abv) && abv > 0) poner('abordajes', abv, 'abordajes');
    else if ((Number(prev.abordajes) || 0) > 0) poner('abordajes', '', 'abordajes');

    if (borrar.length) payload.clear = borrar.join(',');

    if (!campos.length) {
      clearDirty(true);
      habStatus('El borrador no tiene cambios efectivos', 'draft');
      if (opts.then) opts.then(false);
      return;
    }

    habStatus('Guardando día...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) {
          H.saved = r.day || collectDayDraft();
          H.meals = r.meals || H.meals;
          if (Array.isArray(r.waters)) {
            H.serverWaters = normalizeWaters(r.waters);
            H.waters = normalizeWaters(H.serverWaters);
          } else if (waterDraft) {
            H.serverWaters = normalizeWaters(H.waters);
          }
          if (Array.isArray(r.ejercicios)) {
            H.serverEjers = normalizeEjers(r.ejercicios);
            H.ejers = normalizeEjers(H.serverEjers);
          } else if (ejerDraft) {
            H.serverEjers = normalizeEjers(H.ejers);
          }
          clearDirty(true);
          pintarSueno();
          renderMeals();
          renderWaters();
          renderEjers();
          pintarEstadoDia();
          habStatus('✓ Guardado · ' + campos.join(', '), 'ok');
        } else {
          habStatus('✗ ' + ((r && r.error) || 'error'), 'err');
        }
        if (opts.then) opts.then(!!(r && r.ok));
      })
      .withFailureHandler(function(err) {
        habStatus('✗ ' + (err && err.message ? err.message : err), 'err');
        if (opts.then) opts.then(false);
      })
      .habitDaySafe(payload);
  }

  if (hEl('saveHabit')) hEl('saveHabit').addEventListener('click', function() { saveDay(); });

  // ---------- Persistencia local y cambio de día ----------
  var rolloverTimer = null;
  var observedToday = todayISO();

  // Conserva lo pendiente como borrador y pasa al dia nuevo con el form limpio.
  function rolloverDay() {
    // Si nunca se abrió la pestaña no hay nada que rotar: H.date está vacío
    // y cargar el día acá dispararía una llamada al server al pedo.
    if (!habitLoadedOnce) { programarMedianoche(); return; }
    var siguiente = todayISO();
    if (H.dirty) persistDraft();
    if (H.date !== siguiente) loadDay(siguiente);
    observedToday = siguiente;
    programarMedianoche();
  }

  // Timer hasta las 00:00:05 del dia siguiente (5s de gracia para no
  // pelearse con el reloj). Se reprograma solo despues de cada disparo.
  function programarMedianoche() {
    if (rolloverTimer) clearTimeout(rolloverTimer);
    var ahora = new Date();
    var proxima = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() + 1, 0, 0, 5);
    var ms = proxima.getTime() - ahora.getTime();
    // setTimeout revienta arriba de ~24.8 dias; acá nunca pasa de 24 hs.
    rolloverTimer = setTimeout(rolloverDay, ms);
  }
  programarMedianoche();

  // Al ir a segundo plano se escribe solamente localStorage. No se confirma
  // nada en la hoja sin tocar Guardar dia.
  document.addEventListener('visibilitychange', function() {
    // No se filtra por pestaña visible: si hay cambios de hábitos sin guardar
    // hay que rescatarlos aunque el usuario esté parado en Gastos.
    if (!habitLoadedOnce) return;

    if (document.visibilityState === 'hidden') {
      if (H.dirty) persistDraft();
    } else {
      // Rotar solo si realmente cambio la fecha mientras la app estaba cerrada.
      // Esto evita saltar a hoy al volver de editar intencionalmente otro dia.
      if (observedToday !== todayISO()) rolloverDay();
      else programarMedianoche();
    }
  });

  // Ultimo respaldo sin red al cerrar la pestaña/PWA.
  window.addEventListener('pagehide', function() {
    if (habitLoadedOnce && H.dirty) persistDraft();
  });

  // ---------- Borrar el dia ----------
  if (hEl('clearHabit')) hEl('clearHabit').addEventListener('click', function() {
    if (!confirm('¿Borrar TODOS los datos de este día, incluidas las comidas?')) return;
    habStatus('Borrando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) { removeDraft(H.date); habStatus('✓ Día borrado', 'ok'); loadDay(H.date); }
        else habStatus('✗ ' + ((r && r.error) || 'error'), 'err');
      })
      .withFailureHandler(function(err) { habStatus('✗ ' + (err && err.message ? err.message : err), 'err'); })
      .clearHabitDaySafe(H.date);
  });

  // ---------- Resumen del mes ----------
  function loadHabitsSummary() {
    var box = hEl('habitsSummary');
    if (!box) return;
    box.className = 'dash-loader';
    box.textContent = 'Cargando...';
    google.script.run
      .withSuccessHandler(renderHabitsSummary)
      .withFailureHandler(function(err) { box.textContent = '✗ ' + (err && err.message ? err.message : err); })
      .getHabitsDataSafe(null);
  }
  if (hEl('refreshHabits')) hEl('refreshHabits').addEventListener('click', loadHabitsSummary);

  function renderHabitsSummary(d) {
    var box = hEl('habitsSummary');
    if (!box) return;
    if (!d || !d.ok) { box.className = 'dash-loader'; box.textContent = '✗ ' + ((d && d.error) || 'error'); return; }
    box.className = '';
    var a = d.avg || {}, t = d.totals || {}, c = d.correlations || {};
    var nn = function(v, suf) { return (v == null) ? '—' : (v + (suf || '')); };

    var html = '<div class="hkpis">' +
      '<div class="hkpi"><div class="hkpi-l">Días con datos</div><div class="hkpi-v">' + d.daysTracked + '</div></div>' +
      '<div class="hkpi"><div class="hkpi-l">Sueño promedio</div><div class="hkpi-v">' + nn(a.sueno, ' hs') + '</div></div>' +
      '<div class="hkpi"><div class="hkpi-l">Trabajo total</div><div class="hkpi-v">' + nn(t.trabajo, ' hs') + '</div></div>' +
      '<div class="hkpi"><div class="hkpi-l">Avance promedio</div><div class="hkpi-v">' + nn(a.avance) + '</div></div>' +
      '<div class="hkpi"><div class="hkpi-l">Racha avance 4+</div><div class="hkpi-v">' + d.streak + ' d</div></div>' +
      '<div class="hkpi"><div class="hkpi-l">Comidas log</div><div class="hkpi-v">' + d.totalMeals + '</div></div>' +
      '<div class="hkpi"><div class="hkpi-l">Días ejercicio</div><div class="hkpi-v">' + (t.ejercicioDias || 0) + '</div></div>' +
      '<div class="hkpi"><div class="hkpi-l">Agua promedio</div><div class="hkpi-v">' + (a.agua == null ? '—' : fmtMl(Math.round(a.agua)) + ' ml') + '</div></div>' +
      '<div class="hkpi"><div class="hkpi-l">Masturbación</div><div class="hkpi-v">' + (t.mast || 0) + '</div></div>' +
      ((d.kcalInfo && d.kcalInfo.dias)
        ? '<div class="hkpi"><div class="hkpi-l">kcal/día (con foto)</div><div class="hkpi-v">' +
          fmtMl(Math.round(a.kcal)) + '</div></div>'
        : '') +
    '</div>';

    var corr = [];
    if (c.sleepGood && c.sleepBad && c.sleepGood.n >= 3 && c.sleepBad.n >= 3) {
      corr.push('😴 Con 7+ hs de sueño tu avance promedio es <b>' + c.sleepGood.avance +
                '</b> (' + c.sleepGood.n + ' días) vs <b>' + c.sleepBad.avance +
                '</b> con menos (' + c.sleepBad.n + ' días).');
    }
    if (c.withUltraprocesado && c.withoutUltraprocesado &&
        c.withUltraprocesado.n >= 3 && c.withoutUltraprocesado.n >= 3) {
      corr.push('🍫 Días con ultraprocesados: avance <b>' + c.withUltraprocesado.avance +
                '</b> vs <b>' + c.withoutUltraprocesado.avance + '</b> sin ellos.');
    }
    if (c.withEjercicio && c.withoutEjercicio && c.withEjercicio.n >= 3 && c.withoutEjercicio.n >= 3) {
      corr.push('🏃 Días con ejercicio: avance <b>' + c.withEjercicio.avance +
                '</b> vs <b>' + c.withoutEjercicio.avance + '</b> sin entrenar.');
    }
    if (corr.length) html += '<div class="hcorr">' + corr.join('<br>') + '</div>';
    else html += '<div class="hcorr">Seguí cargando datos — las correlaciones aparecen con 3+ días en cada grupo.</div>';

    if (d.byMacro && d.byMacro.length) {
      html += '<div class="dash-section" style="margin-top:12px"><h2>Macros del mes</h2><div class="dash-list">';
      for (var i = 0; i < d.byMacro.length; i++) {
        html += '<div class="dash-list-row"><span class="name">' + esc(d.byMacro[i].name) +
                '</span><span class="val">' + d.byMacro[i].count + '</span></div>';
      }
      html += '</div></div>';
    }
    box.innerHTML = html;
  }

  function loadHabitToday() { loadDay(todayISO()); }

  // ==========================================================
  // === ARGENTINA ============================================
  // ==========================================================
  var argLoadedOnce = false;
  var ARG = { tipo: 'Gasto', quien: 'Mía', entradas: [], editRow: null, cats: [] };

  function argStatus(t, cls) {
    var el = hEl('argStatus');
    if (!el) return;
    el.className = cls || '';
    el.textContent = t || '';
    var ov = hEl('loadingOverlay');
    if (ov) {
      if (cls === 'loading') {
        var x = hEl('loadingText'); if (x) x.textContent = t || 'Guardando...';
        ov.classList.add('show');
      } else { ov.classList.remove('show'); }
    }
  }
  function nArg(v) { return parseFloat(String(v == null ? '' : v).replace(/\./g, '').replace(',', '.')) || 0; }
  function fmtArs(n) { return '$ ' + fmtMl(Math.round(n || 0)); }
  function fmtUsd(n) { return 'US$ ' + (Math.round((n || 0) * 100) / 100).toString().replace('.', ','); }

  // ---- Selector de tipo: cambia qué campos se piden ----
  function setTipo(t) {
    ARG.tipo = t;
    var bs = document.querySelectorAll('.argtipo');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('activo', bs[i].getAttribute('data-tipo') === t);

    var esGasto = (t === 'Gasto');
    var show = function(id, on) { var e = hEl(id); if (e) e.style.display = on ? '' : 'none'; };
    show('argCampoArs', esGasto);     // pesos + cotización
    show('argCampoUsd', !esGasto);    // dólares que le devolviste
    show('argCampoCat', esGasto);
    show('argCampoQuien', esGasto);   // un pago siempre es a mamá
    show('argCampoDetalle', true);
    var d = hEl('argDetalle');
    if (d) d.placeholder = esGasto ? '¿En qué gastaste?' : 'ej: le transferí';
    var b = hEl('argAdd');
    if (b) b.textContent = esGasto ? 'Guardar gasto' : 'Guardar';

    var hint = hEl('argHint');
    if (hint) {
      hint.textContent = esGasto
        ? 'Pagaste algo en pesos. Con la cotización se anota cuántos dólares fueron.'
        : 'Le diste dólares a tu madre. Baja lo que le debés.';
    }
    argCalc();
  }
  (function() {
    var bs = document.querySelectorAll('.argtipo');
    for (var i = 0; i < bs.length; i++) {
      (function(b) { b.addEventListener('click', function() { setTipo(b.getAttribute('data-tipo')); }); })(bs[i]);
    }
    var qs = document.querySelectorAll('.argquien');
    for (var j = 0; j < qs.length; j++) {
      (function(b) {
        b.addEventListener('click', function() {
          ARG.quien = b.getAttribute('data-quien');
          for (var k = 0; k < qs.length; k++) qs[k].classList.toggle('activo', qs[k] === b);
        });
      })(qs[j]);
    }
  })();

  // Muestra cuántos dólares son esos pesos a la cotización puesta
  function argCalc() {
    var el = hEl('argCalc');
    if (!el) return;
    if (ARG.tipo !== 'Gasto') { el.textContent = ''; return; }
    var a = nArg(hEl('argArs') && hEl('argArs').value);
    var c = nArg(hEl('argCotiz') && hEl('argCotiz').value);
    el.textContent = (a > 0 && c > 0) ? ('= ' + fmtUsd(Math.round((a / c) * 100) / 100)) : '';
  }
  ['argArs','argCotiz'].forEach(function(id) {
    var e = hEl(id); if (e) e.addEventListener('input', argCalc);
  });

  // ---- Carga de datos ----
  function loadArg() {
    argStatus('Cargando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        argStatus('', '');
        argLoadedOnce = true;
        if (!r || !r.ok) { argStatus('✗ ' + ((r && r.error) || 'error'), 'err'); return; }
        ARG.entradas = r.entradas || [];
        ARG.cats = r.categorias || [];
        if (hEl('argMes')) hEl('argMes').textContent = '· ' + (r.tab || '');
        var sel = hEl('argCat');
        if (sel && !sel.options.length) {
          sel.innerHTML = ARG.cats.map(function(c) { return '<option>' + esc(c) + '</option>'; }).join('');
          sel.value = 'Comida';
        }
        if (hEl('argFecha') && !hEl('argFecha').value) hEl('argFecha').value = todayISO();
        pintarArg(r.totales);
      })
      .withFailureHandler(function(e) { argStatus('✗ ' + (e && e.message ? e.message : e), 'err'); })
      .getArgentinaDataSafe(null);
  }

  function pintarArg(t) {
    t = t || {};
    var set = function(id, v) { var e = hEl(id); if (e) e.textContent = v; };
    set('argGaste',    fmtArs(t.gastadoArs));
    set('argGasteUsd', fmtUsd(t.gastadoUsd));
    set('argMio',      fmtUsd(t.pusoMioUsd));
    set('argMama',     fmtUsd(t.pusoMamaUsd));
    set('argPagado',   fmtUsd(t.pagadoUsd));
    // La deuda arrastrada solo aparece si existe; en un mes que arranca de cero
    // es ruido.
    set('argAntes',    fmtUsd(t.deudaAntesUsd));
    var rowAntes = hEl('argRowAntes');
    if (rowAntes) rowAntes.style.display = (t.deudaAntesUsd || 0) ? '' : 'none';

    // Si le devolvió más de lo que gastó con plata suya, una deuda negativa se
    // lee mal. Se muestra al revés: le diste de más.
    var dd = hEl('argDeuda'), lblD = dd && dd.previousElementSibling;
    if ((t.deudaUsd || 0) < 0) {
      set('argDeuda', fmtUsd(Math.abs(t.deudaUsd)));
      if (lblD) lblD.textContent = 'Le di de más';
      if (dd) dd.style.color = '#15803d';
    } else {
      set('argDeuda', fmtUsd(t.deudaUsd));
      if (lblD) lblD.textContent = 'Le debo a mamá';
      if (dd) dd.style.color = '';
    }

    var box = hEl('argList');
    if (!box) return;
    if (!ARG.entradas.length) {
      box.innerHTML = '<div style="color:#aaa;font-size:13px;padding:6px 2px">Sin movimientos este mes</div>';
      return;
    }
    var html = '';
    for (var i = ARG.entradas.length - 1; i >= 0; i--) {
      var e = ARG.entradas[i];
      var tipoL = e.tipo.toLowerCase();
      // El sheet guarda Carga/Gasto/Pago; en pantalla se muestran en primera
      // persona, que es como el usuario piensa lo que hizo.
      var etiqueta = tipoL === 'carga' ? 'Cambié' : (tipoL === 'pago' ? 'Le di' : 'Gasté');
      var monto = (tipoL === 'pago') ? fmtUsd(e.usd) : fmtArs(e.ars);
      var extra = (tipoL !== 'pago' && e.usd) ? (' · ' + fmtUsd(e.usd)) : '';
      var fecha = e.fecha ? e.fecha.slice(8) + '/' + e.fecha.slice(5, 7) : '';
      html += '<div class="argmov" data-row="' + e.row + '">' +
        '<span class="at ' + tipoL + '">' + etiqueta + '</span>' +
        '<span class="ad">' + esc(e.detalle || '—') +
          (e.categoria ? ' <span class="aq">· ' + esc(e.categoria) + '</span>' : '') +
          (e.quien ? ' <span class="aq">· ' + esc(e.quien) + '</span>' : '') + '</span>' +
        '<span class="am">' + monto + extra + '<span class="aq"> ' + fecha + '</span></span>' +
      '</div>';
    }
    box.innerHTML = html;
    var rows = box.querySelectorAll('.argmov');
    for (var k = 0; k < rows.length; k++) {
      (function(el) {
        el.addEventListener('click', function() { abrirArgModal(parseInt(el.getAttribute('data-row'), 10)); });
      })(rows[k]);
    }
  }

  // ---- Alta ----
  if (hEl('argAdd')) hEl('argAdd').addEventListener('click', function() {
    var payload = {
      fecha: (hEl('argFecha') && hEl('argFecha').value) || todayISO(),
      tipo: ARG.tipo,
      detalle: (hEl('argDetalle') && hEl('argDetalle').value.trim()) || ''
    };
    if (ARG.tipo === 'Gasto') {
      var a = nArg(hEl('argArs') && hEl('argArs').value);
      if (!a) { argStatus('¿Cuántos pesos argentinos gastaste?', 'err'); return; }
      var c = nArg(hEl('argCotiz') && hEl('argCotiz').value);
      if (!c) { argStatus('Falta la cotización del dólar', 'err'); return; }
      payload.ars = a;
      payload.cotiz = c;
      payload.quien = ARG.quien;
      payload.categoria = (hEl('argCat') && hEl('argCat').value) || '';
    } else {
      var u = nArg(hEl('argUsd') && hEl('argUsd').value);
      if (!u) { argStatus('¿Cuántos dólares le diste?', 'err'); return; }
      payload.usd = u;
      payload.quien = 'Mamá';
    }
    argStatus('Guardando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) {
          // La cotización no se limpia: en un mismo viaje es casi siempre la
          // misma y volver a escribirla en cada gasto es un fastidio.
          ['argDetalle','argArs','argUsd'].forEach(function(id) {
            var e = hEl(id); if (e) e.value = '';
          });
          argCalc();
          var dicho = ARG.tipo === 'Pago' ? 'Anotado: le diste dólares a tu madre' : 'Gasto guardado';
          argStatus('✓ ' + dicho, 'ok');
          loadArg();
        } else { argStatus('✗ ' + ((r && r.error) || 'error'), 'err'); }
      })
      .withFailureHandler(function(e) { argStatus('✗ ' + (e && e.message ? e.message : e), 'err'); })
      .addArgentinaSafe(payload);
  });

  // ---- Editar / borrar ----
  function abrirArgModal(row) {
    var e = null;
    for (var i = 0; i < ARG.entradas.length; i++) if (ARG.entradas[i].row === row) { e = ARG.entradas[i]; break; }
    if (!e) return;
    ARG.editRow = row;
    ARG.editTipo = e.tipo || 'Gasto';
    ARG.editQuien = (String(e.quien || '').toLowerCase().indexOf('mam') >= 0) ? 'Mamá' : 'Mía';
    var esPago = String(e.tipo || '').toLowerCase() === 'pago';
    var showM = function(id, on) { var el = hEl(id); if (el) el.style.display = on ? '' : 'none'; };
    showM('agCampoGasto', !esPago);
    showM('agCampoPago', esPago);
    var qs = document.querySelectorAll('.agquien');
    for (var j = 0; j < qs.length; j++) qs[j].classList.toggle('activo', qs[j].getAttribute('data-quien') === ARG.editQuien);
    if (hEl('agDetalle')) hEl('agDetalle').value = e.detalle || '';
    if (hEl('agUsd'))     hEl('agUsd').value     = e.usd != null ? e.usd : '';
    if (hEl('agCotiz'))   hEl('agCotiz').value   = e.cotiz != null ? e.cotiz : '';
    if (hEl('agArs'))     hEl('agArs').value     = e.ars != null ? e.ars : '';
    if (hEl('agFecha'))   hEl('agFecha').value   = e.fecha || '';
    agCalc();
    if (hEl('argModal'))  hEl('argModal').classList.add('show');
  }
  function cerrarArgModal() {
    ARG.editRow = null;
    if (hEl('argModal')) hEl('argModal').classList.remove('show');
  }
  // Al tocar los pesos o la cotización, mostrar en vivo cuántos dólares son.
  // Sin esto el modal guardaba el USD viejo y la deuda quedaba mal.
  function agCalc() {
    var el = hEl('agCalc');
    if (!el) return;
    var a = nArg(hEl('agArs') && hEl('agArs').value);
    var c = nArg(hEl('agCotiz') && hEl('agCotiz').value);
    el.textContent = (a > 0 && c > 0) ? ('= ' + fmtUsd(Math.round((a / c) * 100) / 100)) : '';
  }
  ['agArs','agCotiz'].forEach(function(id) {
    var e = hEl(id);
    if (e) e.addEventListener('input', agCalc);
  });
  (function() {
    var qs = document.querySelectorAll('.agquien');
    for (var j = 0; j < qs.length; j++) {
      (function(b) {
        b.addEventListener('click', function() {
          ARG.editQuien = b.getAttribute('data-quien');
          for (var k = 0; k < qs.length; k++) qs[k].classList.toggle('activo', qs[k] === b);
        });
      })(qs[j]);
    }
  })();

  if (hEl('agCancel')) hEl('agCancel').addEventListener('click', cerrarArgModal);
  if (hEl('argModal')) hEl('argModal').addEventListener('click', function(ev) {
    if (ev.target === hEl('argModal')) cerrarArgModal();
  });

  if (hEl('agSave')) hEl('agSave').addEventListener('click', function() {
    if (ARG.editRow == null) return;
    argStatus('Guardando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        cerrarArgModal();
        if (r && r.ok) { argStatus('✓ Actualizado', 'ok'); loadArg(); }
        else argStatus('✗ ' + ((r && r.error) || 'error'), 'err');
      })
      .withFailureHandler(function(e) { cerrarArgModal(); argStatus('✗ ' + (e && e.message ? e.message : e), 'err'); })
      .updateArgentinaSafe({
        row: ARG.editRow,
        detalle: (hEl('agDetalle') && hEl('agDetalle').value.trim()) || '',
        usd:   (hEl('agUsd')   && hEl('agUsd').value.trim())   || '',
        cotiz: (hEl('agCotiz') && hEl('agCotiz').value.trim()) || '',
        ars:   (hEl('agArs')   && hEl('agArs').value.trim())   || '',
        quien: ARG.editQuien || '',
        fecha: (hEl('agFecha') && hEl('agFecha').value) || ''
      });
  });

  if (hEl('agDelete')) hEl('agDelete').addEventListener('click', function() {
    if (ARG.editRow == null) return;
    if (!confirm('¿Borrar este movimiento?')) return;
    var row = ARG.editRow;
    argStatus('Borrando...', 'loading');
    google.script.run
      .withSuccessHandler(function(r) {
        cerrarArgModal();
        if (r && r.ok) { argStatus('✓ Borrado: ' + r.deleted, 'ok'); loadArg(); }
        else argStatus('✗ ' + ((r && r.error) || 'error'), 'err');
      })
      .withFailureHandler(function(e) { cerrarArgModal(); argStatus('✗ ' + (e && e.message ? e.message : e), 'err'); })
      .deleteArgentinaSafe({ row: row });
  });

  setTipo('Gasto');
</script>
