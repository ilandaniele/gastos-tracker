<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #fafafa; color: #1a1a1a; margin: 0; padding: 16px; max-width: 420px; margin-left: auto; margin-right: auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: #666; margin: 14px 0 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select { width: 100%; padding: 12px 14px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 16px; background: white; -webkit-appearance: none; appearance: none; }
  input:focus, select:focus { outline: none; border-color: #0f766e; }
  button { width: 100%; background: #0f766e; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; margin-top: 20px; cursor: pointer; }
  button:active { background: #0d5c52; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick-section { margin-bottom: 10px; }
  .quick-label { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; padding-left: 2px; }
  .quick-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .quick-scroll::-webkit-scrollbar { height: 4px; }
  .quick-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  .quick-scroll button { flex: 0 0 auto; width: auto; background: #f5f5f5; color: #1a1a1a; padding: 7px 10px; font-size: 12px; margin: 0; font-weight: 500; white-space: nowrap; border-radius: 7px; border: none; min-width: 56px; }
  .quick-scroll button:active { background: #e5e5e5; }
  .quick-scroll.fijos button { background: #fef3c7; color: #92400e; }
  .quick-scroll.fijos button:active { background: #fde68a; }
  #status { margin-top: 14px; padding: 14px; border-radius: 8px; font-size: 14px; display: none; }
  #status.ok { display: block; background: #ecfdf5; border: 1px solid #10b981; color: #15803d; }
  #status.err { display: block; background: #fef2f2; border: 1px solid #dc2626; color: #dc2626; }
  #status.loading { display: block; background: #f0f9ff; border: 1px solid #0ea5e9; color: #0369a1; }
  /* Overlay full-screen con spinner para mostrar mientras se guarda */
  #loadingOverlay { position: fixed; inset: 0; background: rgba(255,255,255,0.92); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; z-index: 9999; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); pointer-events: auto; }
  #loadingOverlay.show { display: flex; }
  #loadingOverlay .spinner { width: 64px; height: 64px; border: 6px solid #e5e5e5; border-top-color: #0f766e; border-radius: 50%; animation: spin 0.9s linear infinite; }
  #loadingOverlay .spinner-text { font-size: 16px; color: #0f766e; font-weight: 600; text-align: center; padding: 0 24px; max-width: 320px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Tabs — con 6 secciones ya no entran repartidas a lo ancho (flex:1 las
     aplastaba y la última quedaba ilegible o cortada). Scroll horizontal en
     vez de eso: cada tab mantiene su ancho natural y se llega a las de más
     a la derecha deslizando, igual que el scroll de accesos rápidos del
     panel de Gasto. switchTab() además centra la tab activa al tocarla. */
  .tabs-wrap { position: sticky; top: 0; z-index: 10; background: #fafafa; margin: 0 0 16px;
               display: flex; align-items: flex-start; gap: 6px; }
  .tabs-wrap[hidden] { display: none; }
  /* Flecha para volver a la pantalla de inicio — solo visible dentro de una
     sección (tabs-wrap arranca oculto, ver switchTab()/goHome() en el JS). */
  .back-btn { flex: 0 0 auto; width: auto; margin: 4px 0 0; padding: 9px 12px; font-size: 16px;
              font-weight: 700; background: #f5f5f5; color: #0f766e; border-radius: 8px; border: none; }
  .back-btn:active { background: #e5e5e5; }
  .tabs { flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; border-bottom: 1px solid #e5e5e5; padding-top: 4px; overflow-x: auto;
          -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 10px 13px; text-align: center; cursor: pointer; border: none; background: transparent;
         color: #666; font-size: 14px; font-weight: 600; white-space: nowrap; border-bottom: 2px solid transparent;
         margin: 0; width: auto; border-radius: 0; }
  .tab.active { color: #0f766e; border-bottom-color: #0f766e; }
  /* Pista de que hay más tabs a la derecha: un degradé + flechita que se
     desvanece sola cuando ya scrolleaste hasta el final (ver JS de tabsFade). */
  .tabs-fade { position: absolute; right: 0; top: 4px; bottom: 1px; width: 30px; display: flex;
               align-items: center; justify-content: flex-end; padding-right: 1px;
               background: linear-gradient(to right, rgba(250,250,250,0), #fafafa 60%);
               color: #0f766e; font-size: 17px; font-weight: 700; pointer-events: none;
               transition: opacity 0.2s; opacity: 1; }
  .tabs-fade.hide { opacity: 0; }
  .panel { display: none; }
  .panel.active { display: block; }
  /* Dashboard */
  .dash-loader { color: #666; padding: 24px; text-align: center; font-size: 14px; }
  .dash-section { margin-bottom: 18px; }
  .dash-section h2 { font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px; font-weight: 700; }
  .dash-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dash-kpi { background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px; }
  .dash-kpi.big { grid-column: span 2; background: #ecfdf5; border-color: #a7f3d0; }
  .dash-kpi-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .dash-kpi-val { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .dash-kpi.big .dash-kpi-val { font-size: 26px; color: #0f766e; }
  .dash-kpi-sub { font-size: 11px; color: #888; margin-top: 2px; }
  .dash-list { background: white; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
  .dash-list-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .dash-list-row:last-child { border-bottom: none; }
  .dash-list-row .name { color: #1a1a1a; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
  .dash-list-row .val { font-weight: 600; color: #0f766e; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dash-list-row .sub { font-size: 11px; color: #888; }
  .dash-bar { height: 4px; background: #f0f0f0; border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .dash-bar > div { height: 100%; background: #0f766e; }
  .dash-refresh { width: auto; padding: 8px 14px; font-size: 13px; margin: 0 0 16px; background: #f5f5f5; color: #1a1a1a; }
  .dash-refresh:active { background: #e5e5e5; }
  /* Ticket scan */
  .scan-section { margin: 10px 0 16px; }
  .scan-btn { background: #6366f1; color: white; padding: 12px; font-size: 14px; margin: 0; width: 100%; border-radius: 8px; border: none; font-weight: 600; }
  .scan-btn:active { background: #4f46e5; }
  .scan-btn.cancel { background: #f5f5f5; color: #1a1a1a; }
  .scan-btn.save { background: #10b981; }
  .scan-btn.save:active { background: #059669; }
  #scanPreview { background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; margin: 12px 0; }
  #scanPreview h3 { margin: 0 0 10px; font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .scan-row { display: grid; grid-template-columns: 1fr 70px 90px 26px; gap: 4px; margin-bottom: 6px; align-items: center; }
  .scan-row input, .scan-row select { padding: 6px 6px; font-size: 12px; border-radius: 5px; }
  .scan-row .del-btn { padding: 4px 0; background: #fecaca; color: #991b1b; margin: 0; font-size: 14px; line-height: 1; width: 100%; font-weight: 700; border-radius: 5px; border: none; }
  .scan-total { display: flex; justify-content: space-between; padding: 10px 4px 12px; font-size: 13px; border-top: 1px solid #f0f0f0; margin-top: 8px; }
  .scan-total .v { font-weight: 700; color: #0f766e; font-variant-numeric: tabular-nums; }
  .scan-actions { display: flex; gap: 8px; margin-top: 8px; }
  .scan-actions button { margin: 0; }
  .scan-actions .cancel { flex: 1; }
  .scan-actions .save { flex: 2; }

  /* === HABITOS === */
  .hdate { font-size: 13px; color: #888; font-weight: 400; }
  .hcard { background: white; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .hcard-title { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .hmini { width: auto; margin: 0; padding: 3px 9px; font-size: 13px; background: #f5f5f5; color: #1a1a1a; border-radius: 6px; }
  .hrow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hbig { margin: 0; padding: 14px 8px; font-size: 13px; background: #f0fdfa; color: #0f766e; border: 1px solid #a7f3d0; display: flex; flex-direction: column; gap: 4px; align-items: center; font-weight: 600; }
  .hbig:active { background: #ccfbf1; }
  .hbig .hval { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hsleep { margin-top: 10px; text-align: center; font-size: 14px; color: #0f766e; font-weight: 600; min-height: 18px; }
  .quick-scroll.meals button { background: #ecfdf5; color: #065f46; }
  .quick-scroll.meals button:active { background: #d1fae5; }
  .hmeal-input { display: grid; grid-template-columns: 1fr 96px 46px; gap: 6px; margin-top: 10px; }
  .hmeal-input input { padding: 10px; font-size: 15px; }
  .hmeal-input button { margin: 0; padding: 10px; font-size: 20px; font-weight: 700; background: #0f766e; }
  .hmeal-list { margin-top: 10px; }
  .hmeal-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 2px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .hmeal-row:last-child { border-bottom: none; }
  .hmeal-row .mt { color: #888; font-variant-numeric: tabular-nums; font-size: 12px; min-width: 42px; }
  .hmeal-row .mn { flex: 1; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hmeal-row .mm { font-size: 11px; color: #0f766e; background: #f0fdfa; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .hlabel { display: block; font-size: 12px; color: #666; margin: 14px 0 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .hbadge { background: #0f766e; color: white; padding: 1px 9px; border-radius: 10px; font-size: 12px; margin-left: 6px; }
  .hcounter { display: flex; align-items: center; justify-content: center; gap: 22px; }
  .hcounter button { width: 54px; height: 54px; margin: 0; border-radius: 50%; font-size: 26px; font-weight: 700; background: #f5f5f5; color: #1a1a1a; padding: 0; }
  .hcounter button:active { background: #e5e5e5; }
  .hcounter-val { text-align: center; min-width: 60px; }
  .hcounter-val span { font-size: 32px; font-weight: 700; color: #0f766e; display: block; line-height: 1; }
  .hcounter-val small { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  #habStatus { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  #habStatus.ok { display: block; background: #ecfdf5; border: 1px solid #10b981; color: #15803d; }
  #habStatus.draft { display: block; background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; }
  #habStatus.err { display: block; background: #fef2f2; border: 1px solid #dc2626; color: #dc2626; }
  #habStatus.loading { display: block; background: #f0f9ff; border: 1px solid #0ea5e9; color: #0369a1; }
  .hkpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hkpi { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 9px 10px; }
  .hkpi-l { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .hkpi-v { font-size: 19px; font-weight: 700; color: #0f766e; margin-top: 2px; }
  .hcorr { background: #fefce8; border: 1px solid #fde68a; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 13px; color: #713f12; line-height: 1.5; }
  #ejerTipo { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%231e40af' stroke-width='2'%3E%3Cpath d='M4 6l4 4 4-4'/%3E%3C/svg%3E");
             background-repeat: no-repeat; background-position: right 10px center; background-size: 15px;
             padding-right: 30px; background-color: #eff6ff; color: #1e40af; font-weight: 600; }
  .hejer-otro { margin-top: 8px; }
  .hwater { display: flex; gap: 4px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .hwater i { width: 15px; height: 22px; border-radius: 3px 3px 6px 6px; background: #e5e7eb; display: inline-block; }
  .hwater i.on { background: #38bdf8; }
  .htime-row { display: grid; grid-template-columns: 1fr 118px 68px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .htime-row:last-of-type { margin-bottom: 0; }
  .htime-lbl { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .htime-row input[type="time"] { padding: 10px 8px; font-size: 16px; text-align: center; font-variant-numeric: tabular-nums; }
  .hnow { margin: 0; padding: 10px 6px; font-size: 12px; font-weight: 600; background: #f0fdfa; color: #0f766e; border: 1px solid #a7f3d0; border-radius: 8px; }
  .hnow:active { background: #ccfbf1; }
  .quick-scroll.agua { margin-top: 12px; }
  .quick-scroll.agua button { background: #f0f9ff; color: #0369a1; font-variant-numeric: tabular-nums; }
  .quick-scroll.agua button:active { background: #e0f2fe; }
  .hcounter-val small { white-space: nowrap; }
  /* --- selector de dia --- */
  .hdatebar { display: grid; grid-template-columns: 44px 1fr 44px 56px; gap: 6px; align-items: center; margin-bottom: 10px; }
  .hdatebar button { margin: 0; padding: 10px 0; font-size: 20px; background: #f5f5f5; color: #1a1a1a; border-radius: 8px; }
  .hdatebar button:active { background: #e5e5e5; }
  .hdatebar input[type="date"] { padding: 10px 8px; font-size: 15px; text-align: center; }
  .hdatetoday { font-size: 13px !important; font-weight: 600; background: #f0fdfa !important; color: #0f766e !important; border: 1px solid #a7f3d0; }
  .hdirty { display: none; background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; font-weight: 600; }
  .hdirty.show { display: block; }
  .hwork-field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
  .hwork-field input { min-width: 0; font-size: 20px; font-weight: 700; color: #0f766e; font-variant-numeric: tabular-nums; }
  .hwork-field span { color: #64748b; font-size: 13px; font-weight: 600; padding-right: 4px; }
  .hfield-hint { color: #94a3b8; font-size: 11px; margin-top: 6px; }
  .hrating { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .hrating button { margin: 0; padding: 9px 2px 7px; background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; border-radius: 9px; }
  .hrating button span { display: block; font-size: 23px; line-height: 1.1; filter: grayscale(0.75); opacity: 0.72; }
  .hrating button small { display: block; margin-top: 4px; font-size: 10px; font-weight: 700; }
  .hrating button.activo { background: #ecfdf5; color: #0f766e; border-color: #34d399; box-shadow: 0 0 0 1px #34d399 inset; }
  .hrating button.activo span { filter: none; opacity: 1; }
  .hrating-clear { width: auto; display: block; margin: 7px 0 0 auto; padding: 5px 8px; background: transparent; color: #94a3b8; font-size: 11px; font-weight: 600; }
  .hrating-clear:active { background: #f1f5f9; color: #64748b; }
  .hhint { font-size: 10px; color: #aaa; font-weight: 400; text-transform: none; letter-spacing: 0; }

  /* --- hora de acostarse / levantarse --- */
  .htime-row { display: grid; grid-template-columns: 1fr 110px 62px; gap: 8px; align-items: center; margin-bottom: 9px; }
  .htime-row:last-of-type { margin-bottom: 0; }
  .htime-input { padding: 11px 8px; font-size: 17px; text-align: center; font-variant-numeric: tabular-nums; }

  /* --- numericos con +/- --- */
  .hnum-row { display: grid; grid-template-columns: 54px 1fr auto 54px; gap: 8px; align-items: center; }
  .hnum-row input { text-align: center; font-size: 22px; font-weight: 700; padding: 10px 4px; font-variant-numeric: tabular-nums; color: #0f766e; }
  .hnumbtn { margin: 0; width: 54px; height: 50px; border-radius: 10px; font-size: 24px; font-weight: 700; background: #f5f5f5; color: #1a1a1a; padding: 0; }
  .hnumbtn:active { background: #e5e5e5; }
  .hunit { font-size: 13px; color: #888; font-weight: 600; }
  .hejer-input { display: grid; grid-template-columns: 1fr 72px 46px; gap: 8px; margin-top: 10px; }
  .hejer-input input, .hejer-input select { padding: 10px; font-size: 15px; }
  .hejer-input button { margin: 0; padding: 10px; font-size: 20px; font-weight: 700; background: #1d4ed8; }

  /* --- botones secundarios --- */
  .hdanger { background: #fef2f2 !important; color: #b91c1c !important; border: 1px solid #fecaca !important; }
  .hdanger:active { background: #fee2e2 !important; }
  .hsecondary { background: #f5f5f5 !important; color: #1a1a1a !important; }
  #clearHabit { margin-top: 8px; font-size: 14px; padding: 11px; }

  /* --- modal editar comida --- */
  #mealModal, #waterModal, #ejerModal, #ahoModal, #argModal, #tarModal, #subcatModal, #catModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9998; align-items: center; justify-content: center; padding: 18px; }
  #mealModal.show, #waterModal.show, #ejerModal.show, #ahoModal.show, #argModal.show, #tarModal.show, #subcatModal.show, #catModal.show { display: flex; }
  .hmodal-box { background: white; border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; }
  .hmodal-box h3 { margin: 0 0 4px; font-size: 17px; }
  .hmodal-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 18px; }
  .hmodal-actions button { margin: 0; padding: 12px 4px; font-size: 14px; }
  .hmeal-row { cursor: pointer; }
  .hmeal-row:active { background: #fafafa; }
  .hwater { min-height: 24px; }
  #aguaList .hmeal-row .mm { background: #f0f9ff; color: #0369a1; }
  #aguaList .hmeal-row.pending { background: #fffbeb; }
  #aguaList .hmeal-row.pending .mm { background: #fef3c7; color: #92400e; }
  #ejerList .hmeal-row .mm { background: #eff6ff; color: #1e40af; }
  #ejerList .hmeal-row.pending { background: #fffbeb; }
  #ejerList .hmeal-row.pending .mm { background: #fef3c7; color: #92400e; }
  /* --- ahorros --- */
  .ahototal { background: linear-gradient(135deg, #064e3b, #047857); color: white; text-align: center; }
  .ahototal .hcard-title { color: rgba(255,255,255,0.75); }
  .ahobig { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .ahosub { font-size: 14px; color: rgba(255,255,255,0.75); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .ahogan { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
            padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 700;
            font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.16); }
  .ahogan.sube { color: #6ee7b7; }
  .ahogan.baja { color: #fca5a5; }
  .ahorow .gan { font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ahorow .gan.sube { color: #047857; }
  .ahorow .gan.baja { color: #b91c1c; }
  .ahorow .gan.nada { color: #9ca3af; font-weight: 600; }
  .ahobreak { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px;
              border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; }
  .ahobreak div { display: flex; flex-direction: column; gap: 2px; }
  .ahobreak span { font-size: 10px; color: rgba(255,255,255,0.7); }
  .ahobreak b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .ahocom { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.65);
             font-variant-numeric: tabular-nums; }
  .ahotipo { margin: 0; padding: 10px 6px; font-size: 13px; background: #f5f5f5; color: #1a1a1a; font-weight: 600; }
  .ahotipo.activo { background: #047857; color: white; }
  .ahootro { margin-top: 8px; }
  .aholist { margin-top: 10px; }
  .ahorow { display: flex; align-items: center; gap: 10px; padding: 9px 2px;
            border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .ahorow:last-child { border-bottom: none; }
  .aholg { width: 30px; height: 30px; border-radius: 7px; object-fit: contain;
           background: #fafafa; flex: 0 0 auto; border: 1px solid #f0f0f0; }
  .aholg.badge { display: flex; align-items: center; justify-content: center; font-size: 9px;
                 font-weight: 800; color: #047857; background: #ecfdf5; border-color: #d1fae5; }
  .ahonom { flex: 1; overflow: hidden; }
  .ahonom b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ahonom span { font-size: 11px; color: #888; }
  .ahoval { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ahoval b { display: block; font-size: 13px; }
  .ahoval span { font-size: 10px; color: #888; }
  #ahoStatus { margin-top: 10px; }

  .hphoto { width: 100%; margin: 10px 0 0; padding: 12px; font-size: 14px; font-weight: 600;
             background: #6366f1; color: white; border: none; border-radius: 8px; }
  .hphoto:active { background: #4f46e5; }
  #mealScanBox { display: none; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px;
                 padding: 12px; margin-top: 10px; }
  #mealScanBox.show { display: block; }
  .hscan-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px;
                color: #64748b; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 700; }
  .hscan-conf { padding: 2px 8px; border-radius: 10px; font-size: 10px; }
  .hscan-conf.alta  { background: #dcfce7; color: #15803d; }
  .hscan-conf.media { background: #fef3c7; color: #92400e; }
  .hscan-conf.baja  { background: #fee2e2; color: #b91c1c; }
  .hscan-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hscan-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 14px; }
  .hscan-actions button { margin: 0; padding: 12px 4px; font-size: 14px; }
  .hmeal-row .mk { font-size: 10px; color: #94a3b8; white-space: nowrap; margin-left: 6px; }
  .hdaystatus { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 6px;
                 margin-bottom: 8px; text-align: center; letter-spacing: 0.3px; }
  .hdaystatus.con { background: #ecfdf5; color: #15803d; border: 1px solid #a7f3d0; }
  .hdaystatus.sin { background: #f8fafc; color: #94a3b8; border: 1px solid #e2e8f0; }
  .hsub { display: block; font-size: 10px; color: #94a3b8; font-weight: 400; margin-top: 1px; }
  .argsaldo { background: #f0f9ff; border-color: #bae6fd; }
  .argrow { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-size: 13px; color: #475569; }
  .argrow b { font-variant-numeric: tabular-nums; color: #0f172a; font-size: 14px; }
  .argrow.deuda b { color: #b91c1c; font-size: 19px; }
  .argrow.queda b { color: #0f766e; font-size: 17px; }
  .argsep { border: none; border-top: 1px solid #bae6fd; margin: 8px 0; }
  .argtipos { display: flex; gap: 6px; margin-bottom: 4px; }
  .argtipos button { flex: 1; margin: 0; padding: 10px 4px; font-size: 13px; font-weight: 600;
                     background: #f1f5f9; color: #64748b; border-radius: 8px; }
  .argtipos button.activo { background: #0f766e; color: white; }
  /* El selector de tipo va en columna: las frases completas no entran en tres
     botones lado a lado y quedaban partidas en cuatro renglones. */
  .argtipos.vert { flex-direction: column; gap: 5px; }
  .argtipos.vert button { text-align: left; padding: 11px 12px; font-size: 14px; }
  .argcalc { font-size: 13px; color: #0369a1; text-align: center; margin-top: 8px; min-height: 16px; font-weight: 600; }
  #argStatus { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  #argStatus.ok { display: block; background: #ecfdf5; border: 1px solid #10b981; color: #15803d; }
  #argStatus.err { display: block; background: #fef2f2; border: 1px solid #dc2626; color: #dc2626; }
  #argStatus.loading { display: block; background: #f0f9ff; border: 1px solid #0ea5e9; color: #0369a1; }
  .argmov { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid #f0f0f0; font-size: 13px; cursor: pointer; }
  .argmov:last-child { border-bottom: none; }
  .argmov .at { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 700; white-space: nowrap; }
  .argmov .at.carga { background: #dcfce7; color: #15803d; }
  .argmov .at.gasto { background: #fef3c7; color: #92400e; }
  .argmov .at.pago  { background: #e0e7ff; color: #3730a3; }
  .argmov .ad { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .argmov .am { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .argmov .aq { font-size: 10px; color: #94a3b8; white-space: nowrap; }
  .arghint { font-size: 12px; color: #64748b; background: #f8fafc; border-left: 3px solid #cbd5e1;
             padding: 7px 10px; border-radius: 0 6px 6px 0; margin: 8px 0 4px; line-height: 1.4; }

  /* TAREAS */
  #tarStatus { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  #tarStatus.ok { display: block; background: #ecfdf5; border: 1px solid #10b981; color: #15803d; }
  #tarStatus.err { display: block; background: #fef2f2; border: 1px solid #dc2626; color: #dc2626; }
  #tarStatus.loading { display: block; background: #f0f9ff; border: 1px solid #0ea5e9; color: #0369a1; }
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 2px; border-bottom: 1px solid #f0f0f0; }
  .task-row:last-child { border-bottom: none; }
  .task-check { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 7px; border: 2px solid #cbd5e1;
                background: white; display: flex; align-items: center; justify-content: center;
                font-size: 15px; color: white; margin-top: 1px; cursor: pointer; }
  .task-check.on { background: #0f766e; border-color: #0f766e; }
  .task-body { flex: 1; min-width: 0; cursor: pointer; }
  .task-text { font-size: 14px; line-height: 1.35; word-break: break-word; }
  .task-row.done .task-text { text-decoration: line-through; color: #9ca3af; }
  .task-meta { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 5px; }
  .task-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .task-badge.cita { background: #eef2ff; color: #4338ca; }
  .task-badge.vencida { background: #fef2f2; color: #b91c1c; }
  .task-badge.hoy { background: #f0fdfa; color: #0f766e; }
  .task-badge.notas { background: #f5f5f5; color: #666; font-weight: 500; }
  .task-badge.cat { background: #f1f5f9; color: #475569; }
  .task-badge.subcat { background: #ede9fe; color: #5b21b6; }
  .task-empty { font-size: 13px; color: #999; padding: 8px 2px; }
  #tarHoyCard.vacio { opacity: 0.7; }
  #tarDoneSummary { cursor: pointer; list-style: none; }
  #tarDoneSummary::-webkit-details-marker { display: none; }

  /* Filtro de la pizarra: tipo (Todas/Tareas/Citas) + toggle "Solo hoy" —
     combinados dan "citas de hoy" sin agregar un tercer selector aparte. */
  .task-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .task-filters .argtipos { flex: 1 1 auto; min-width: 0; margin: 0; }
  .task-filter-hoy { width: auto; margin: 0; padding: 10px 12px; font-size: 13px; font-weight: 600;
                     background: #f1f5f9; color: #64748b; border-radius: 8px; white-space: nowrap; }
  .task-filter-hoy:active { background: #e5e5e5; }
  .task-filter-hoy.activo { background: #0f766e; color: white; }
  .task-filter-hoy.activo:active { background: #0d5c52; }

  /* PIZARRA — una sección grande y a todo el ancho por categoría, apiladas
     verticalmente (no un carrusel horizontal angosto). Solo aparecen las
     categorías que tienen algo pendiente — ver tarPintar(): una vacía no
     suma nada y solo agrega scroll de más. */
  .task-board { display: flex; flex-direction: column; gap: 14px; }
  .task-col { background: #f8fafc; border: 1px solid #e5e7eb; border-top: 4px solid #94a3b8;
              border-radius: 12px; padding: 12px; }
  .task-col-head { display: flex; align-items: center; justify-content: space-between;
                   padding: 0 2px 10px; font-size: 15px; font-weight: 700; color: #334155;
                   cursor: pointer; user-select: none; -webkit-user-select: none; }
  .task-col-head .n { font-size: 12px; font-weight: 700; background: #e2e8f0; color: #475569;
                       padding: 2px 9px; border-radius: 999px; }
  /* Flechita que gira al compactar la columna (▾ -> ◂) */
  .task-col-chevron { display: inline-block; transition: transform 0.25s ease; }
  .task-col.colapsado .task-col-chevron { transform: rotate(-90deg); }
  /* Compactar/expandir con animación: el truco es un grid cuya fila pasa de
     1fr a 0fr (soportado en todos los navegadores modernos, iOS incluido) —
     a diferencia de max-height, no hay que adivinar una altura fija. */
  .task-col-collapse { display: grid; grid-template-rows: 1fr; opacity: 1;
                       transition: grid-template-rows 0.25s ease, opacity 0.2s ease; }
  .task-col-collapse.colapsado { grid-template-rows: 0fr; opacity: 0; }
  .task-col-collapse-inner { overflow: hidden; min-height: 0; }
  .task-col-body { display: flex; flex-direction: column; gap: 9px; }
  .task-card { background: white; border-radius: 10px; border: 1px solid #e5e7eb; border-left: 5px solid #94a3b8;
               padding: 11px 13px; display: flex; align-items: flex-start; gap: 10px;
               box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .task-card .task-text { font-size: 15px; }
  .task-card .task-check { width: 26px; height: 26px; flex: 0 0 26px; }
  .task-card.done { opacity: 0.6; }
  .task-card.done .task-text { text-decoration: line-through; color: #9ca3af; }
  .task-col.cat-salud    { border-top-color: #e11d48; }
  .task-col.cat-trabajo  { border-top-color: #2563eb; }
  .task-col.cat-personal { border-top-color: #7c3aed; }
  .task-col.cat-hogar    { border-top-color: #ea580c; }
  .task-col.cat-finanzas { border-top-color: #16a34a; }
  .task-col.cat-otros    { border-top-color: #64748b; }
  .task-card.cat-salud    { border-left-color: #e11d48; }
  .task-card.cat-trabajo  { border-left-color: #2563eb; }
  .task-card.cat-personal { border-left-color: #7c3aed; }
  .task-card.cat-hogar    { border-left-color: #ea580c; }
  .task-card.cat-finanzas { border-left-color: #16a34a; }
  .task-card.cat-otros    { border-left-color: #64748b; }

  /* SUB-PIZARRA — dentro de una columna de categoría, si alguna de sus
     tareas pendientes tiene subcategoría, se agrupan por subcategoría en vez
     de listarse todas juntas (ver tarPintar()). Las que no tienen quedan en
     un grupo "Sin subcategoría" al final, solo cuando conviven con otras que
     sí la tienen — si NINGUNA tiene subcategoría no se arma ningún grupo. */
  .task-subgroup { margin-bottom: 12px; }
  .task-subgroup:last-child { margin-bottom: 0; }
  .task-subgroup-head { display: flex; align-items: center; gap: 6px; margin: 0 0 7px 2px;
                        font-size: 11px; font-weight: 700; color: #6d28d9; text-transform: uppercase; letter-spacing: 0.4px; }
  .task-subgroup-head .n { font-size: 10px; font-weight: 700; background: #ede9fe; color: #6d28d9;
                           padding: 1px 7px; border-radius: 999px; }
  .task-subgroup.sin .task-subgroup-head { color: #94a3b8; }
  .task-subgroup.sin .task-subgroup-head .n { background: #f1f5f9; color: #94a3b8; }
  .task-subgroup .task-col-body { gap: 9px; }

  /* Subcategoría — texto libre con gear al lado para gestionar la lista */
  .hsubcat-row { display: grid; grid-template-columns: 1fr 44px; gap: 8px; }
  .hsubcat-row input { margin: 0; }
  .hsubcat-gear { margin: 0; padding: 0; width: 44px; height: 44px; font-size: 18px;
                 background: #f1f5f9; color: #475569; border-radius: 8px; flex: 0 0 auto; }
  .hsubcat-gear:active { background: #e2e8f0; }
  .hsubcat-add { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
  .hsubcat-add input { margin: 0; padding: 12px 14px; }
  .hsubcat-add button { margin: 0; padding: 0 8px; font-size: 13px; }
  /* Igual que .hsubcat-add pero con un campo angosto para el emoji al frente
     — elegir el ícono de la categoría en vez de que todas caigan en 📌. */
  .hcat-add { display: grid; grid-template-columns: 56px 1fr 96px; gap: 8px; }
  .hcat-add input { margin: 0; padding: 12px 8px; text-align: center; }
  .hcat-add input#catNuevoInput { text-align: left; padding: 12px 14px; }
  .hcat-add button { margin: 0; padding: 0 8px; font-size: 13px; }
  .hsubcat-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 42vh; overflow-y: auto; }
  .hsubcat-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px;
                 background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; }
  .hsubcat-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hsubcat-item button { margin: 0; width: auto; padding: 5px 9px; font-size: 12px; font-weight: 700; background: transparent; }
  .hsubcat-item .hsub-rn { color: #0f766e; }
  .hsubcat-item .hsub-del { color: #b91c1c; }
  /* Flechas para reordenar categorías — ese orden es el mismo en que
     aparecen las columnas de la pizarra (ver moveTaskCategory). */
  .hsubcat-item .hsub-mv { color: #64748b; font-size: 11px; padding: 5px 7px; }
  .hsubcat-item .hsub-mv:disabled { opacity: 0.3; }
  .hsubcat-empty { font-size: 12px; color: #94a3b8; padding: 8px 2px; }

  /* SUBTAREAS — checklist propio dentro de una tarea. Paleta ámbar a
     propósito (distinta del teal del check principal y del violeta de
     subcategoría) para que las tres cosas se distingan de un vistazo. */
  .task-subtasks { margin-top: 9px; padding-top: 9px; border-top: 1px dashed #e5e7eb; }
  .task-subtasks-head { display: flex; align-items: center; gap: 6px; margin: 0 0 6px;
                        font-size: 10px; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: 0.4px; }
  .task-subtasks-head .n { font-size: 10px; font-weight: 700; background: #fef3c7; color: #92400e;
                           padding: 1px 7px; border-radius: 999px; }
  .task-badge.subtasks { background: #fef3c7; color: #92400e; }

  .hsubtask-list { display: flex; flex-direction: column; gap: 6px; }
  .hsubtask-list:not(:empty) { margin-top: 8px; }
  .hsubtask-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .hsubtask-row.done .hsubtask-txt { text-decoration: line-through; color: #9ca3af; }
  .hsubtask-txt { flex: 1; word-break: break-word; }
  .hsubtask-check { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 6px; border: 2px solid #fcd34d;
                    background: white; display: flex; align-items: center; justify-content: center;
                    font-size: 12px; color: white; cursor: pointer; }
  .hsubtask-check.on { background: #d97706; border-color: #d97706; }
  .hsubtask-rm { margin: 0; width: 26px; height: 26px; flex: 0 0 26px; padding: 0; font-size: 16px;
                font-weight: 700; background: #fef2f2; color: #b91c1c; border-radius: 6px; line-height: 1; }
  .hsubtask-rm:active { background: #fee2e2; }
  .hsubtask-add { display: grid; grid-template-columns: 1fr 44px; gap: 8px; margin-top: 8px; }
  .hsubtask-add input { margin: 0; padding: 10px 12px; font-size: 14px; }
  .hsubtask-add button { margin: 0; padding: 0; font-size: 20px; font-weight: 700; background: #d97706; }
  .hsubtask-add button:active { background: #b45309; }

  /* Botón "Hacerla recurrente" — toggle simple, un solo botón (no un grupo
     como .argtipos), mismo criterio visual: gris apagado / teal cuando está
     prendido. */
  .htoggle { display: block; width: 100%; margin: 14px 0 0; padding: 11px 12px; background: #f1f5f9;
             color: #64748b; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px;
             font-weight: 600; text-align: left; }
  .htoggle.activo { background: #f0fdfa; color: #0f766e; border-color: #0f766e; }

  /* Contador de una tarea recurrente: "3 / 10 · semanal" + botón +1. Cuando
     se llega al objetivo se pone verde — sigue siendo la misma tarjeta, no
     desaparece, porque una recurrente no se "completa", se reinicia sola. */
  .task-counter { margin-top: 7px; display: flex; align-items: center; gap: 8px; }
  .task-counter-txt { font-size: 12px; font-weight: 700; color: #475569; background: #f1f5f9;
                      padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .task-counter.cumplido .task-counter-txt { background: #dcfce7; color: #15803d; }
  .task-counter-btn { width: auto; margin: 0; padding: 4px 11px; font-size: 12px; font-weight: 700;
                      background: #0f766e; color: white; border-radius: 999px; }
  .task-counter-btn:active { background: #0d5f58; }

  /* COMPRAS — lista simple, propia tarjeta adentro de Tareas. Mismo check
     redondo que las tareas (teal) porque acá sí es "la misma acción": tocás
     y queda comprado, sin capas de subtareas ni categorías. */
  .hcompra-add { display: grid; grid-template-columns: 1fr 44px; gap: 8px; margin-bottom: 4px; }
  .hcompra-add input { margin: 0; padding: 12px 14px; }
  .hcompra-add button { margin: 0; padding: 0; font-size: 22px; font-weight: 700; }
  .comp-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid #f0f0f0; }
  .comp-row:last-child { border-bottom: none; }
  .comp-check { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 7px; border: 2px solid #cbd5e1;
               background: white; display: flex; align-items: center; justify-content: center;
               font-size: 15px; color: white; cursor: pointer; }
  .comp-check.on { background: #0f766e; border-color: #0f766e; }
  .comp-text { flex: 1; font-size: 14px; word-break: break-word; cursor: pointer; }
  .comp-row.done .comp-text { text-decoration: line-through; color: #9ca3af; }
  .comp-del { margin: 0; width: 26px; height: 26px; flex: 0 0 26px; padding: 0; font-size: 16px;
             font-weight: 700; background: #fef2f2; color: #b91c1c; border-radius: 6px; line-height: 1; }
  .comp-del:active { background: #fee2e2; }
  #compStatus { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  #compStatus.ok { display: block; background: #ecfdf5; border: 1px solid #10b981; color: #15803d; }
  #compStatus.err { display: block; background: #fef2f2; border: 1px solid #dc2626; color: #dc2626; }
  #compStatus.loading { display: block; background: #f0f9ff; border: 1px solid #0ea5e9; color: #0369a1; }

  /* === PANTALLA DE INICIO === */
  .home-hero { text-align: center; padding: 22px 6px 26px; }
  .home-hero-emoji { font-size: 46px; line-height: 1; margin-bottom: 10px; }
  .home-hero h1 { font-size: 23px; margin: 0 0 4px; }
  .home-sub { color: #888; font-size: 13px; margin: 0; }
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .home-card { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end;
               gap: 3px; text-align: left; margin: 0; width: auto; min-height: 112px;
               padding: 16px 14px; border: none; border-radius: 16px; color: white;
               box-shadow: 0 3px 10px rgba(0,0,0,0.12); transition: transform 0.1s; }
  .home-card:active { transform: scale(0.96); }
  .home-card-icon { font-size: 26px; }
  .home-card-title { font-size: 15px; font-weight: 700; }
  .home-card-sub { font-size: 11px; opacity: 0.85; font-weight: 500; }
  .home-add    { background: linear-gradient(135deg, #0f766e, #2dd4bf); }
  .home-tareas { background: linear-gradient(135deg, #4338ca, #818cf8); }
  .home-dash   { background: linear-gradient(135deg, #0369a1, #38bdf8); }
  .home-habit  { background: linear-gradient(135deg, #7c3aed, #c4b5fd); }
  .home-aho    { background: linear-gradient(135deg, #064e3b, #10b981); }
  .home-arg    { background: linear-gradient(135deg, #1d4ed8, #60a5fa); }
  /* :active necesita repetir el gradiente con dos clases (mismo criterio que
     .scan-btn.save:active etc.): la regla genérica button:active del tope del
     archivo tiene más especificidad que una sola clase .home-card y taparía
     el gradiente con el teal plano si no se repite acá. */
  .home-add:active    { background: linear-gradient(135deg, #0d5c52, #14b8a6); }
  .home-tareas:active { background: linear-gradient(135deg, #3730a3, #6366f1); }
