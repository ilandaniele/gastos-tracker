# Worker de la app: formulario, API, D1, avisos push y cron. Reemplaza a Apps Script y al Worker "gastos-habitos".
name = "gastos-app"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "gastos-db"
database_id = "6e60920a-c1e0-4f32-b6e2-42666e6e304c"
migrations_dir = "migrations"

# Secretos (wrangler secret put): VIEW_KEY = clave de respaldo del visor.
#
# Cloudflare Access (verificación real del JWT). Se activa al definir ACCESS_AUD:
# es el "Application Audience (AUD) Tag" de la app de Access que cubre este host.
# (agregar dentro de [vars], abajo)
# ACCESS_TEAM = "ilandaniele.cloudflareaccess.com"
# ACCESS_AUD = "<aud tag>"
# ACCESS_EMAILS = "ilan.daniele@gmail.com"


# Cron único cada 15 min (el plan gratis limita a 5 por cuenta): scheduled() en src/index.js sincroniza
# (con todos los módulos en D1 no hace nada) y manda los avisos push y mails (push.js, tickPush).
[triggers]
crons = ["*/15 * * * *"]

[vars]
# Access activo: app "gastos-app" en Zero Trust (política "Solo Ilan"). El Worker verifica el JWT.
ACCESS_TEAM = "ilandaniele.cloudflareaccess.com"
ACCESS_AUD = "34c57ce6eb89f6f441c7d8063f7ce54a40fb5fabc8afbca591cebbcc61b873da"
ACCESS_EMAILS = "ilan.daniele@gmail.com"
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_Nom1eonYjrZvHIAixp6YzEhKfYqGjl5qfUrddtbEm8zJLIviB1oULPWcP2GH9VRUZA/exec"

# Clave pública VAPID de los avisos push por cuenta (la privada es el secreto VAPID_PRIVATE_JWK).
VAPID_PUBLIC_KEY = "BGfZIBVN63wNcHooJpxr4EBWc-D6GTB_QUcqL7YQxpOw7iu5aGHL6V4xljGfqwxzK9S5BNuSQesa7YYYhKXKBis"
